<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的小农场 · GUI 版</title>
<meta name="description" content="文字种田游戏《我的小农场》的网页 GUI 版：种菜、浇水、钓鱼、卖鱼、扩张农场。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🌾</div>
    <div class="brand-txt">
      <h1>我的小农场</h1>
      <p id="season">—</p>
    </div>
  </div>

  <div class="hud">
    <div class="chip coins" id="hud-coins" title="金币">💰 <b>—</b></div>
    <div class="chip energy" title="体力">
      <span>🔋</span>
      <div class="ebar"><i id="hud-ebar"></i></div>
      <b id="hud-etxt">—</b>
    </div>
    <div class="chip weather" id="hud-weather">☀️ 晴天</div>
    <div class="chip" id="hud-fee" title="每天睡觉扣一次">🍖 —</div>
    <div class="chip" id="hud-plots">🏞️ —</div>
  </div>

  <div class="top-actions">
    <button class="btn primary sleep-btn" data-act="sleep" title="推进到下一天，扣伙食费并恢复体力">🌙 睡觉</button>
    <button class="icon-btn" id="btn-market" title="市场">📈</button>
    <button class="icon-btn" id="btn-status" title="查看状态">📊</button>
    <button class="icon-btn" id="btn-ach" title="成就">🏆</button>
    <button class="icon-btn" id="btn-codex" title="图鉴">📖</button>
    <button class="icon-btn" id="btn-profile" title="经营档案">🗂️</button>
    <button class="icon-btn" id="btn-settings" title="设置">⚙️</button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
  </div>
</header>

<main class="layout">

  <!-- 左列 -->
  <section class="col-main">

    <div class="panel farm">
      <div class="panel-head">
        <h2>🧑‍🌾 农田</h2>
        <span class="lv-chip" id="farm-lv">🌱 Lv1</span>
        <div class="legend">
          <span>💧 今日已浇</span>
          <span>🧪 已施肥</span>
        </div>
      </div>
      <div class="plot-grid" id="plot-grid"></div>
      <div class="farm-foot">
        <button class="btn wide" data-act="plantAll">🌱 全部播种<small id="plantall-txt"></small></button>
        <button class="btn wide" data-act="fertilizeAll">🧪 全部施肥<small id="fertall-txt"></small></button>
        <button class="btn wide" data-act="waterAll">💧 全部浇水</button>
        <button class="btn wide" data-act="harvestAll">🧺 全部收获</button>
      </div>
    </div>

    <div class="panel fishing">
      <div class="panel-head">
        <h2>🎣 河边</h2>
        <span class="lv-chip" id="fish-lv">🎣 Lv1</span>
      </div>
      <div class="bait-row" id="bait-row"></div>
      <div class="fish-forecast" id="fish-forecast"></div>
      <div class="fish-row">
        <button class="btn primary big" data-act="cast">🎣 甩一杆<small id="cast-cost"></small></button>
        <button class="btn big" data-act="cast5">⚡ 连甩 <span id="cast5-n">5</span> 杆</button>
        <button class="btn big" data-act="castAll">🌊 全部体力</button>
      </div>
      <div class="catch-area" id="catch-area">
        <div class="catch-empty">今天还没开张，甩一杆试试 🌊</div>
      </div>
      <div class="crew-row" id="crew-row"></div>
    </div>

    <div class="panel orchard">
      <div class="panel-head">
        <h2>🍑 果园</h2>
        <span class="muted" id="orchard-sum"></span>
      </div>
      <div id="orchard-locked" class="orchard-locked" hidden></div>
      <div id="orchard-grid" class="orchard-grid" hidden></div>
      <div class="orchard-foot" id="orchard-foot" hidden>
        <button class="btn" data-act="orchardWater">💧 浇果树<small id="orchard-water-txt"></small></button>
        <button class="btn" data-act="orchardHarvest">🧺 收获全部<small id="orchard-harvest-txt"></small></button>
        <button class="btn" data-act="orchardExpand">🕳️ 开垦树坑<small id="orchard-expand-txt"></small></button>
      </div>
    </div>

    <div class="panel store">
      <div class="panel-head">
        <h2>🧺 仓库</h2>
        <span class="muted" id="store-sum"></span>
        <button class="btn mini" id="btn-box">📦 收购箱</button>
      </div>
      <div class="store-tools">
        <label class="store-search">🔎 <input id="store-search" type="search" placeholder="搜索物品名称" autocomplete="off" aria-label="搜索仓库物品"></label>
        <div class="store-filters" aria-label="仓库分类">
          <button class="store-filter active" data-store-filter="all" aria-pressed="true">全部 <span>0</span></button>
          <button class="store-filter" data-store-filter="crops" aria-pressed="false">作物 <span>0</span></button>
          <button class="store-filter" data-store-filter="wild" aria-pressed="false">收集物 <span>0</span></button>
          <button class="store-filter" data-store-filter="fish" aria-pressed="false">渔获 <span>0</span></button>
          <button class="store-filter" data-store-filter="junk" aria-pressed="false">杂物/宝箱 <span>0</span></button>
          <button class="store-filter" data-store-filter="supplies" aria-pressed="false">用品 <span>0</span></button>
        </div>
      </div>
      <div id="store-list" class="store-list"></div>
      <div class="seed-box" id="seed-box"></div>
    </div>

  </section>

  <!-- 右列 -->
  <aside class="col-side">

    <div class="panel">
      <div class="panel-head"><h2>🔧 干活</h2>
        <span class="lv-chip" id="dig-lv">🪱 Lv1</span>
        <span class="lv-chip" id="forage-lv">🌿 Lv1</span>
      </div>
      <div class="action-grid">
        <button class="btn" data-act="dig">🪱 挖蚯蚓<small id="dig-txt"></small></button>
        <button class="btn" data-act="work">🕐 打零工<small id="work-txt"></small></button>
        <button class="btn wide-cell" data-act="forage">🌿 采集<small id="forage-txt"></small></button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>🏡 农场</h2></div>
      <div class="action-grid farm-actions">
        <button class="btn" data-act="tea">🍵 下午茶<small id="tea-txt"></small></button>
        <button class="btn" data-act="expand">🏞️ 扩张土地<small id="expand-txt"></small></button>
        <button class="btn wide-cell" data-act="upgrade">💪 强化体力<small id="upgrade-txt"></small></button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>🔧 设备</h2><span class="muted" id="dev-sum"></span></div>
      <div class="action-grid farm-actions">
        <button class="btn" data-act="sprinkler">🚿 洒水器<small id="sprinkler-txt"></small></button>
        <button class="btn" data-act="harvester">🤖 自动收获器<small id="harvester-txt"></small></button>
        <button class="btn wide-cell" data-act="seeder">🌱 自动播种器<small id="seeder-txt"></small></button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>🏪 商店</h2>
        <span class="lv-chip" id="trade-lv">🤝 Lv1</span>
        <button class="btn mini" id="btn-town">🏘️ 小镇</button>
      </div>
      <div class="shop-two shop-four">
        <button class="btn" data-act="seedshop">🌰 种子店<small>买种子</small></button>
        <button class="btn" data-act="shop">🛒 渔具店<small>面团饵 · 假饵</small></button>
        <button class="btn" data-act="fishshop">🐟 水产店<small>买卖渔获</small></button>
        <button class="btn" data-act="cropshop">🧺 农产品店<small>买卖作物</small></button>
        <button class="btn wide-cell" data-act="depart">🏬 百货店<small>茶 · 钥匙 · 回收</small></button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>📋 今日委托</h2>
        <span class="muted" id="orders-sum"></span>
        <button class="btn mini" id="btn-refresh-orders">🔄 刷新</button>
      </div>
      <div id="order-list" class="order-list"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>📒 账本</h2>
        <span class="muted" id="ledger-sum"></span>
        <button class="btn mini" id="btn-stats">📈 统计</button>
        <button class="btn mini" id="btn-ledger">⬇ 导出账本</button>
      </div>
      <div class="ledger" id="ledger"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>📔 钓鱼记录</h2></div>
      <div id="book-stats" class="book-stats"></div>
      <div id="book-list" class="book-list"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>📜 日志</h2>
        <button class="btn mini" id="btn-log">⬇ 导出日志</button>
      </div>
      <div class="log" id="log"></div>
    </div>

  </aside>
</main>

<div id="modal-root" class="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="fx" class="fx"></div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
