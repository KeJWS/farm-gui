<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的小农场 · GUI 版</title>
<meta name="description" content="文字种田游戏《我的小农场》的网页 GUI 版：种菜、浇水、钓鱼、卖鱼、扩张农场。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<style>
/* ================= 我的小农场 · 样式 ================= */
:root{
  --bg:#f6ecd8;
  --bg2:#efe0c3;
  --ink:#3d3122;
  --ink-2:#6d5b45;
  --ink-3:#9a866c;
  --panel:rgba(255,253,247,.86);
  --panel-2:rgba(255,253,247,.6);
  --line:rgba(122,96,60,.16);
  --line-2:rgba(122,96,60,.28);
  --green:#4f9c5f;
  --green-d:#37794a;
  --soil:#8b5c3d;
  --soil-d:#6d462e;
  --gold:#d9a32c;
  --gold-l:#f0c65a;
  --red:#c9554a;
  --blue:#3f7fc4;
  --r:18px;
  --shadow:0 8px 24px rgba(102,78,44,.10), 0 1px 0 rgba(255,255,255,.7) inset;
  --shadow-hover:0 14px 30px rgba(102,78,44,.16);
}

*{ box-sizing:border-box; }

/* hidden 属性优先于组件自身的 display（果园面板 / 底部按钮用得到） */
[hidden]{ display:none !important; }

html,body{ height:100%; }

body{
  margin:0;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, var(--glow1) 0%, transparent 60%),
    radial-gradient(900px 500px at 95% 0%, var(--glow2) 0%, transparent 55%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}

button{ font-family:inherit; }

/* ---------------- 顶栏 ---------------- */

.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:18px;
  padding:12px 20px;
  background:var(--topbar);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 20px rgba(120,95,60,.07);
}

.brand{ display:flex; align-items:center; gap:11px; }
.logo{
  width:42px; height:42px; display:grid; place-items:center;
  font-size:23px; border-radius:13px;
  background:linear-gradient(160deg,#ffeab5,#f7d179);
  box-shadow:0 4px 10px rgba(190,140,50,.28), 0 0 0 1px rgba(255,255,255,.6) inset;
}
.brand-txt h1{ margin:0; font-size:17px; letter-spacing:.5px; }
.brand-txt p{ margin:1px 0 0; font-size:12px; color:var(--ink-2); }

.hud{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

.chip{
  display:inline-flex; align-items:center; gap:7px;
  height:34px; padding:0 13px;
  border-radius:999px;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:0 2px 6px rgba(120,95,60,.07);
  font-weight:600; font-size:13px; color:var(--ink);
  white-space:nowrap;
}
.chip.coins b{ color:var(--gold); font-size:14px; font-variant-numeric:tabular-nums; }
.chip.energy{ padding-right:14px; }
.chip .ebar{
  width:74px; height:9px; border-radius:99px; overflow:hidden;
  background:var(--track); box-shadow:0 0 0 1px rgba(120,95,60,.08) inset;
}
.chip .ebar i{
  display:block; height:100%; width:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#7fd08a,#4f9c5f);
  transition:width .35s cubic-bezier(.2,.8,.3,1), background .3s;
}
.chip.energy.low .ebar i{ background:linear-gradient(90deg,#f0b25a,#e08a3c); }
.chip.energy.empty .ebar i{ background:linear-gradient(90deg,#e08a7a,#c9554a); }
.chip b#hud-etxt{ font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-2); }

.chip.weather{ background:linear-gradient(160deg,#fff8e2,#ffeebf); border-color:rgba(200,160,60,.35); }
.chip.weather[data-w="cloudy"]{ background:linear-gradient(160deg,#f2f4f7,#e3e8ef); }
.chip.weather[data-w="rain"]{ background:linear-gradient(160deg,#e9f1fb,#d6e4f7); }
.chip.weather[data-w="storm"]{ background:linear-gradient(160deg,#e8e3f2,#d5cde8); }

.top-actions{ margin-left:auto; display:flex; gap:8px; }
.icon-btn{
  width:36px; height:36px; border-radius:11px; font-size:16px; cursor:pointer;
  background:var(--card); border:1px solid var(--line); color:var(--ink-2);
  box-shadow:0 2px 6px rgba(120,95,60,.07);
  transition:transform .15s, box-shadow .15s, background .15s;
}
.icon-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 14px rgba(120,95,60,.14); background:var(--card-solid); }
.icon-btn.off{ opacity:.45; }

/* ---------------- 布局 ---------------- */

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 372px;
  gap:16px;
  padding:16px 20px 40px;
  max-width:1560px; margin:0 auto;
  align-items:start;
}
.col-main,.col-side{ display:flex; flex-direction:column; gap:16px; min-width:0; }

.panel{
  background:var(--topbar);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:15px 16px 16px;
}
.panel-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 12px;
}
.panel-head h2{
  margin:0; font-size:14.5px; font-weight:800; letter-spacing:.4px;
  display:flex; align-items:center; gap:6px;
}
.panel-head .muted{ margin-left:auto; font-size:12px; color:var(--ink-3); font-weight:600; }
.legend{
  margin-left:auto; display:flex; gap:12px; flex-wrap:wrap;
  font-size:11.5px; color:var(--ink-3); font-weight:600;
}
.legend .ripe-hint{ color:var(--green-d); }

/* ---------------- 农田 ---------------- */

.farm{
  background:
    radial-gradient(700px 220px at 50% -40%, rgba(255,255,255,.85), transparent 70%),
    rgba(255,253,248,.94);
}

.plot-grid{
  display:grid;
  grid-template-columns:repeat(5, minmax(0, 1fr));
  gap:11px;
  max-height:min(478px, 56vh);
  overflow-y:auto;
  padding-right:4px;
  border-radius:12px;
}
.plot-grid:focus{ outline:none; }
.plot-grid:focus-visible{ outline:2px solid rgba(79,156,95,.45); outline-offset:3px; }
@media (max-width:1180px){
  .plot-grid{ grid-template-columns:repeat(4, minmax(0, 1fr)); }
}
@media (max-width:820px){
  .plot-grid{ grid-template-columns:repeat(3, minmax(0, 1fr)); }
}
@media (max-width:560px){
  .plot-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
}

.plot{  position:relative;
  border-radius:15px;
  padding:10px 11px 11px;
  background:linear-gradient(180deg,var(--plot1) 0%, var(--plot2) 55%, var(--plot3) 100%);
  border:1px solid var(--line);
  box-shadow:0 3px 10px rgba(120,95,60,.08), 0 1px 0 rgba(255,255,255,.8) inset;
  cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s;
  overflow:hidden;
  min-height:150px;
  display:flex; flex-direction:column;
}
.plot::after{ /* 土垄 */
  content:""; position:absolute; left:0; right:0; bottom:0; height:34px;
  background:repeating-linear-gradient(90deg, rgba(160,120,80,.13) 0 9px, rgba(160,120,80,0) 9px 20px);
  opacity:.7; pointer-events:none;
}
.plot:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hover); border-color:var(--line-2); }
.plot:active{ transform:translateY(0) scale(.995); }

.plot.empty{ background:linear-gradient(180deg,var(--plot1),var(--plot2)); }

/* 空地：CSS 画的土堆 */
.plot-art.soil{
  width:66px; height:34px; margin:8px auto 6px;
  border-radius:50% 50% 42% 42% / 62% 62% 38% 38%;
  background:
    radial-gradient(circle at 22% 42%, rgba(255,255,255,.14) 0 2px, transparent 3px),
    radial-gradient(circle at 68% 62%, rgba(0,0,0,.14) 0 2px, transparent 3px),
    radial-gradient(circle at 45% 25%, #b0835b 0%, #96613f 48%, #7a4c31 100%);
  box-shadow:
    inset 0 3px 5px rgba(255,255,255,.22),
    inset 0 -6px 10px rgba(0,0,0,.22),
    0 3px 6px rgba(90,65,35,.22);
  position:relative;
  display:grid; place-items:center;
  transition:transform .2s;
}
.plot-art.soil .seed-dot{
  font-size:13px; font-weight:900; color:rgba(255,255,255,.55);
  text-shadow:0 1px 2px rgba(0,0,0,.25);
  transform:translateY(-1px);
}
.plot:hover .plot-art.soil{ transform:scale(1.06); }

.plot.ripe{
  border-color:rgba(79,156,95,.55);
  box-shadow:0 0 0 2px rgba(79,156,95,.16), 0 8px 22px rgba(79,156,95,.18);
  animation:ripePulse 2.2s ease-in-out infinite;
}
@keyframes ripePulse{
  0%,100%{ box-shadow:0 0 0 2px rgba(79,156,95,.14), 0 6px 18px rgba(79,156,95,.14); }
  50%{ box-shadow:0 0 0 4px rgba(79,156,95,.22), 0 10px 26px rgba(79,156,95,.26); }
}
.plot.waited{ border-color:rgba(240,180,80,.5); }

.plot-top{ display:flex; align-items:center; gap:5px; height:16px; }
.plot-no{
  font-size:10.5px; font-weight:800; color:var(--ink-3);
  background:var(--chip-bg); border-radius:6px; padding:1px 6px;
  border:1px solid var(--line);
}
.plot-badges{ margin-left:auto; display:flex; gap:3px; font-size:11px; }

.plot-art{
  font-size:41px; line-height:1.1; text-align:center; margin:5px 0 3px;
  filter:drop-shadow(0 3px 4px rgba(90,65,35,.18));
  transition:transform .2s;
}
.plot:hover .plot-art{ transform:scale(1.07) rotate(-2deg); }
.plot.ripe .plot-art{ animation:bob 1.8s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

.plot-name{
  font-size:12px; font-weight:800; text-align:center; color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.plot-name small{ font-weight:600; color:var(--ink-3); font-size:10.5px; }

.bar{
  height:6px; border-radius:99px; margin:7px 0 6px;
  background:rgba(120,95,60,.13); overflow:hidden;
}
.bar i{
  display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg,#8ed29a,#4f9c5f);
  transition:width .4s cubic-bezier(.2,.8,.3,1);
}
.plot.ripe .bar i{ background:linear-gradient(90deg,var(--gold-l),var(--gold)); }

.plot-foot{
  margin-top:auto; font-size:11px; text-align:center; font-weight:700;
  color:var(--ink-2); position:relative; z-index:1;
}
.plot-foot.can{ color:var(--green-d); }
.plot-foot .warn{ color:#b4771f; }

/* 农田底部按钮 */
.farm-foot{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:9px; margin-top:13px;
}
@media (max-width:820px){
  .farm-foot{ grid-template-columns:repeat(2, 1fr); }
}

/* ---------------- 按钮 ---------------- */

.btn{
  position:relative;
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  min-height:40px; padding:7px 13px;
  border-radius:12px; cursor:pointer;
  background:linear-gradient(180deg,var(--card),var(--card-2));
  border:1px solid var(--line-2);
  color:var(--ink); font-size:13px; font-weight:700; letter-spacing:.2px;
  box-shadow:0 2px 0 rgba(160,130,90,.14), 0 4px 10px rgba(120,95,60,.06);
  transition:transform .12s, box-shadow .12s, background .12s, opacity .12s;
}
.btn small{ font-size:10.5px; font-weight:600; color:var(--ink-3); }
.btn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 4px 0 rgba(160,130,90,.14), 0 10px 18px rgba(120,95,60,.12); background:linear-gradient(180deg,var(--card-2),var(--card)); }
.btn:active:not(:disabled){ transform:translateY(1px); box-shadow:0 1px 0 rgba(160,130,90,.14); }
.btn:disabled{ opacity:.45; cursor:not-allowed; filter:grayscale(.4); }
.btn.wide{ width:100%; }
.btn.mini{ min-height:26px; padding:3px 9px; font-size:11.5px; border-radius:8px; box-shadow:none; background:var(--card); }
.btn.primary{
  background:linear-gradient(180deg,#6cbf7b,#4f9c5f);
  border-color:#3f8350; color:#fff;
  box-shadow:0 3px 0 #3a7748, 0 8px 16px rgba(60,120,70,.22);
  text-shadow:0 1px 1px rgba(0,0,0,.15);
}
.btn.primary small{ color:rgba(255,255,255,.85); }
.btn.primary:hover:not(:disabled){ background:linear-gradient(180deg,#78cb87,#57a768); }
.btn.big{ min-height:48px; font-size:14.5px; border-radius:14px; }
.btn.gold{
  background:linear-gradient(180deg,#f6ce6b,#dfa52e); border-color:#c08c1f; color:#4a3310;
  box-shadow:0 3px 0 #b8871c, 0 8px 16px rgba(200,150,50,.24);
}
.btn.danger{ color:var(--red); border-color:rgba(201,85,74,.35); }

.action-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:9px; }

/* ---------------- 钓鱼 ---------------- */

.fish-meta{ margin-left:auto; font-size:11.5px; color:var(--ink-3); font-weight:600; }

/* 河边：左边钓具（饵 / 预估 / 甩杆 / 渔获），右边小队（渔网 / 渔夫） */
.river{ display:grid; grid-template-columns:minmax(0,1fr) 226px; gap:14px; align-items:start; }
.river-main{ min-width:0; }
.river-side{
  min-width:0; display:flex; flex-direction:column; gap:7px;
  padding-left:12px; border-left:1px dashed var(--line-2);
}
.river-side-head{ display:flex; align-items:baseline; gap:6px; font-size:11px; font-weight:800; color:var(--ink-2); }
.river-side-head span{ font-size:10px; font-weight:700; color:var(--ink-3); }
.river-side .crew-row{ grid-template-columns:1fr; margin-top:0; gap:7px; }
.river-side .crew-card{ padding:8px 9px 7px; }

/* 五种饵料：一行铺满，窄屏自动换行 */
.bait-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(102px, 1fr)); gap:7px; margin-bottom:9px; }
.bait{
  display:flex; align-items:center; gap:6px; min-width:0;
  padding:6px 9px; border-radius:11px; cursor:pointer;
  background:var(--card); border:1px solid var(--line);
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  transition:.14s;
}
.bait .bn{ color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bait .bc{ margin-left:auto; font-size:11px; color:var(--ink-3); font-weight:700; white-space:nowrap; }
.bait:hover{ border-color:var(--line-2); transform:translateY(-1px); }
.bait.sel{
  background:linear-gradient(180deg,#eaf7ec,#d7efdb);
  border-color:rgba(79,156,95,.5); color:var(--green-d);
  box-shadow:0 0 0 2px rgba(79,156,95,.12);
}
.bait.off{ opacity:.4; cursor:not-allowed; }

/* 甩一杆 / 连甩 5 杆 / 全部体力：一行三个，主按钮略宽 */
.fish-row{ display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:9px; }
.fish-row .btn{ padding:10px 8px; }
.fish-row .fb{ white-space:nowrap; }
.fish-row .fb b{ font-weight:900; }
.fish-row .btn small{ font-size:9.5px; opacity:.85; }

.catch-area{ margin-top:10px; min-height:94px; }
.catch-empty{
  display:grid; place-items:center; min-height:94px;
  border:1.5px dashed var(--line-2); border-radius:14px;
  color:var(--ink-3); font-size:12.5px; font-weight:600;
  background:var(--soft);
}
.catch-card{
  display:flex; align-items:center; gap:13px;
  padding:11px 14px; border-radius:14px;
  background:linear-gradient(180deg,var(--card),var(--card-2));
  border:1px solid var(--line);
  box-shadow:0 4px 14px rgba(120,95,60,.1);
  animation:popIn .3s cubic-bezier(.2,1.2,.4,1);
}
@keyframes popIn{ from{ transform:scale(.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
.catch-card .ce{ font-size:34px; filter:drop-shadow(0 3px 5px rgba(90,65,35,.2)); }
.catch-card .cname{ font-size:14.5px; font-weight:800; }
.catch-card .cq{ font-size:12px; font-weight:800; margin-top:2px; }
.catch-card .cprice{ margin-left:auto; font-size:19px; font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums; }

/* 最近渔获（单杆 / 连甩都列出来） */
.catch-sum{ font-size:11px; font-weight:700; color:var(--ink-3); margin:0 2px 6px; }
.catch-list{ display:flex; flex-wrap:nowrap; gap:6px; overflow-x:auto; padding-bottom:2px; }
.catch-item{
  flex:none;
  display:flex; align-items:center; gap:6px;
  padding:4px 9px; border-radius:10px;
  background:var(--card); border:1px solid var(--line);
  border-left:3px solid var(--line-2);
  font-size:12px; white-space:nowrap;
  animation:popIn .22s ease;
}
.catch-item .ce{ font-size:15px; }
.catch-item .cn2{ font-weight:800; }
.catch-item .cq2{ font-size:10.5px; font-weight:800; }
.catch-item .cp2{ font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums; }

/* 商店两连 */
.shop-two{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }

/* ---------------- 仓库 ---------------- */

.store-tools{ display:flex; flex-direction:column; gap:8px; margin:0 0 9px; }
.store-search{
  display:flex; align-items:center; gap:7px; min-height:36px; padding:0 10px;
  border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink-3);
}
.store-search input{
  min-width:0; width:100%; border:0; outline:0; background:transparent;
  color:var(--ink); font:inherit; font-size:12px;
}
.store-search input::placeholder{ color:var(--ink-3); }
.store-filters{ display:flex; gap:6px; overflow-x:auto; padding:1px 1px 4px; scrollbar-width:thin; }
.store-filter{
  flex:none; display:inline-flex; align-items:center; gap:5px; min-height:29px; padding:4px 9px;
  border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink-2);
  cursor:pointer; font:inherit; font-size:10.5px; font-weight:800; white-space:nowrap;
}
.store-filter span{
  display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px;
  padding:0 4px; border-radius:99px; background:var(--card-2); color:var(--ink-3); font-size:9px;
}
.store-filter:hover{ border-color:var(--green); }
.store-filter.active{ background:rgba(79,156,95,.12); border-color:rgba(79,156,95,.42); color:var(--green-d); }
.store-filter.active span{ background:rgba(79,156,95,.14); color:var(--green-d); }
.store-list{ display:flex; flex-direction:column; gap:7px; max-height:380px; overflow-y:auto; padding-right:4px; }
.store-sub{
  margin:4px 0 0; padding-top:8px; font-size:11px; font-weight:800; color:var(--ink-3);
  border-top:1px dashed var(--line-2);
}
.store-row{
  display:flex; align-items:center; gap:9px;
  padding:7px 9px; border-radius:11px;
  background:var(--card); border:1px solid var(--line);
}
.store-row>div{ min-width:0; flex:1; }
.store-row .se{ font-size:20px; }
.store-row .sn{ font-size:12.5px; font-weight:800; }
.store-row .sv{ font-size:11px; color:var(--ink-3); font-weight:700; }
.store-row .sp{ margin-left:auto; font-size:12.5px; font-weight:800; color:var(--gold); }
.store-empty{ font-size:12px; color:var(--ink-3); font-weight:600; padding:8px 2px; }

.seed-box{
  margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-2);
  font-size:11.5px; color:var(--ink-2); font-weight:600;
  display:flex; gap:6px; flex-wrap:wrap; align-items:center;
}
.seed-box .tag{
  background:#eef7ec; color:var(--green-d); border:1px solid rgba(79,156,95,.28);
  padding:2px 8px; border-radius:7px; font-weight:800; font-size:11px;
}
@media (max-width:560px){
  .store-list{ max-height:340px; }
  .store-row{ gap:7px; padding:7px; }
  .store-row .sv{ overflow-wrap:anywhere; }
}
.seed-box .tag-sell{
  display:inline-flex; align-items:center; gap:5px;
  font-family:inherit; cursor:pointer;
  transition:transform .12s, background .12s, border-color .12s;
}
.seed-box .tag-sell:hover{
  background:#e0f2dd; border-color:rgba(79,156,95,.52); transform:translateY(-1px);
}
.seed-box .tag-sell b{ font-size:10px; font-weight:800; color:#b4771f; }

.book-stats{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:9px; }

.book-list{ max-height:190px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; padding-right:4px; }

.log{ max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; padding-right:4px; }

/* ---------------- 弹窗 ---------------- */

.modal-root{ position:fixed; inset:0; z-index:200; display:none; }
.modal-root.on{ display:block; }
.modal-mask{
  position:absolute; inset:0; background:rgba(60,45,25,.42);
  backdrop-filter:blur(3px); animation:fadeIn .18s ease;
}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.modal{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(620px, calc(100vw - 32px)); max-height:calc(100vh - 60px);
  display:flex; flex-direction:column;
  background:var(--card); border-radius:20px;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 30px 70px rgba(60,40,15,.3);
  animation:modalIn .24s cubic-bezier(.2,1.1,.35,1);
  overflow:hidden;
}
@keyframes modalIn{ from{ opacity:0; transform:translate(-50%,-46%) scale(.96); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
.modal-head{
  display:flex; align-items:center; gap:10px;
  padding:15px 18px 12px; border-bottom:1px solid var(--line);
}
.modal-head h3{ margin:0; font-size:15.5px; }
.modal-head .x{

}

.modal-body{ padding:14px 18px 18px; overflow-y:auto; }
.modal-foot{ padding:12px 18px 16px; border-top:1px solid var(--line); display:flex; gap:9px; }

.crop-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:9px; }
.crop-card{
  text-align:center; padding:10px 8px 9px; border-radius:13px; cursor:pointer;

}
.crop-card:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 10px 20px rgba(120,95,60,.14); border-color:rgba(79,156,95,.4); }
.crop-card:disabled{ opacity:.42; cursor:not-allowed; filter:grayscale(.5); }
.crop-card .ce{ font-size:27px; }
.crop-card .cn{ font-weight:800; font-size:12.5px; margin-top:3px; }
.crop-card .cs{ font-size:10.5px; color:var(--ink-3); font-weight:700; margin-top:2px; }
.crop-card .cm{ font-size:10.5px; color:var(--ink-2); font-weight:600; margin-top:3px; line-height:1.35; }
.crop-card .cp{ font-size:10.5px; font-weight:800; color:var(--green-d); margin-top:3px; }

.kv{ display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12.5px; margin-bottom:12px; }
.kv dt{ color:var(--ink-3); font-weight:700; }
.kv dd{ margin:0; font-weight:700; color:var(--ink); }

/* ---------------- 每日总结 ---------------- */

.day-sum-top{

}

.day-sec{ margin-top:11px; }
.day-sec h4{ margin:0 0 6px; font-size:11px; letter-spacing:.04em; color:var(--ink-3); text-transform:uppercase; }

.day-list{ display:flex; flex-direction:column; gap:5px; }
.day-line{

}

.day-empty{ font-size:11.5px; color:var(--ink-3); font-weight:700; padding:2px 0; }
.day-todo{ margin:0; padding-left:18px; font-size:12.5px; font-weight:700; color:var(--ink-2); line-height:1.8; }
.day-kpis{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:12px; }
.day-kpi{ display:flex; align-items:baseline; flex-wrap:wrap; gap:3px 5px; padding:9px 10px; border-radius:11px;
  border:1px solid var(--line); background:var(--card); min-width:0; }
.day-kpi span{ width:100%; color:var(--ink-3); font-size:10.5px; font-weight:800; }
.day-kpi b{ font-size:18px; line-height:1.15; font-variant-numeric:tabular-nums; }
.day-kpi b.up{ color:var(--green-d); } .day-kpi b.down{ color:var(--red); }
.day-kpi small{ color:var(--ink-3); font-size:9.5px; font-weight:700; }
.stat-kpis{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin:0 0 12px; }
.stat-kpi{ display:flex; flex-direction:column; gap:3px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); }

.stat-chart-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin:8px 1px 5px; font-size:12px; }
.stat-chart-head>b{ font-size:12px; }
.stat-chart-head>span{ color:var(--ink-3); font-size:10px; font-weight:700; white-space:nowrap; }
.stat-chart-head i{ display:inline-block; width:8px; height:8px; border-radius:3px; margin:0 3px 0 7px; }
.stat-chart-head .legend-in{ background:#4a9b5b; } .stat-chart-head .legend-out{ background:#d46a5f; }
.stat-chart-foot{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; color:var(--ink-3); font-size:10px; font-weight:700; }

@media(max-width:520px){ .day-kpis{ gap:5px; } .day-kpi{ padding:7px; } .day-kpi b{ font-size:15px; } .stat-kpis{ gap:5px; }
  .stat-kpi{ padding:8px; } .stat-kpi b{ font-size:16px; } .stat-chart-head{ align-items:flex-start; flex-direction:column; gap:3px; } }

/* ---------------- 果园 ---------------- */

.orchard-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:9px; }
.orc-card{

}

.orc-full{ color:var(--gold); }
.orc-lv{ margin-left:auto; font-size:9.5px; font-weight:800; color:var(--blue); background:rgba(63,127,196,.12);
  border-radius:6px; padding:1px 5px; white-space:nowrap; }
.orc-lv + .orc-tag{ margin-left:4px; }

.rule-table{ width:100%; border-collapse:collapse; font-size:11.8px; margin:6px 0 14px; }

/* ---------------- 种子店 ---------------- */

.shop-head{
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  margin-bottom:10px; padding-bottom:9px; border-bottom:1px dashed var(--line-2);
}
.shop-head b{ color:var(--gold); font-size:15px; font-variant-numeric:tabular-nums; }

.shop-list{
  display:flex; flex-direction:column; gap:6px;
  max-height:440px; overflow-y:auto; padding-right:4px;
}
.shop-row{
  display:flex; align-items:center; gap:9px;
  padding:6px 9px; border-radius:11px;

}

/* ---------------- 顶栏的睡觉按钮 ---------------- */

.sleep-btn{
  flex-direction:row; gap:6px; min-height:36px; height:36px;
  padding:0 16px; font-size:13.5px; border-radius:11px;
}

/* ---------------- Toast ---------------- */

.toast-root{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  z-index:300; display:flex; flex-direction:column; gap:7px; align-items:center;
  pointer-events:none;
}
.toast{
  padding:9px 18px; border-radius:999px; font-size:13px; font-weight:700;
  background:rgba(48,37,20,.9); color:#fff;
  box-shadow:0 10px 26px rgba(50,35,10,.3);
  animation:toastIn .28s cubic-bezier(.2,1.2,.4,1);
}
.toast.good{ background:linear-gradient(180deg,#5cb06d,#3f8b4f); }
.toast.warn{ background:linear-gradient(180deg,#e2b04a,#c48e26); color:#3a2800; }
.toast.bad{ background:linear-gradient(180deg,#d76a5e,#b8443a); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(12px) scale(.96); } to{ opacity:1; transform:none; } }
.toast.out{ animation:toastOut .3s ease forwards; }
@keyframes toastOut{ to{ opacity:0; transform:translateY(-8px); } }

/* ---------------- 飘字 ---------------- */

.fx{ position:fixed; inset:0; pointer-events:none; z-index:250; overflow:hidden; }
.float{
  position:absolute; font-size:15px; font-weight:900;
  color:var(--gold); text-shadow:0 2px 6px rgba(0,0,0,.18);
  animation:floatUp 1.05s ease-out forwards;
  white-space:nowrap;
}
.float.green{ color:#2f8c4a; }
.float.red{ color:#c9554a; }
.float.water{ color:#3f7fc4; }
@keyframes floatUp{
  0%{ opacity:0; transform:translate(-50%,6px) scale(.85); }
  22%{ opacity:1; transform:translate(-50%,-6px) scale(1.06); }
  100%{ opacity:0; transform:translate(-50%,-50px) scale(1); }
}

/* ---------------- 滚动条 ---------------- */

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(150,120,85,.28); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover{ background:rgba(150,120,85,.45); background-clip:padding-box; }

.rule-tab.on{
  background:linear-gradient(180deg,var(--green),var(--green-d)); border-color:transparent;
  color:#fff; box-shadow:0 4px 12px rgba(79,156,95,.3);
}
.rule-crumb{
  font-size:10.5px; font-weight:800; color:var(--ink-3); letter-spacing:.02em;

}
.rule-page{ animation:ruleIn .16s ease-out; }
@keyframes ruleIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
.rule-page .rule-sec:last-child{ margin-bottom:2px; }

/* ---------- nets / dark mode ---------- */

/* ---------- v2.10: 河边「渔网 / 渔夫」小队卡 ---------- */
.crew-row{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:9px; }
.crew-card{ padding:9px 10px 8px; border-radius:12px; background:var(--card);
  border:1px solid var(--line); display:flex; flex-direction:column; gap:4px; min-width:0; }
.crew-card.locked{ opacity:.55; }
.crew-card.warn{ border-color:rgba(217,159,43,.5); background:rgba(217,159,43,.07); }
.crew-card.on{ border-color:rgba(79,156,95,.4); }
.cc-head{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:800; }
.cc-ic{ font-size:15px; line-height:1; }
.cc-t{ flex:1; min-width:0; }
.cc-tag{ font-size:10.5px; font-weight:800; color:var(--ink-3); background:var(--track);
  padding:1px 6px; border-radius:8px; white-space:nowrap; }
.cc-dots{ display:flex; gap:3px; flex-wrap:wrap; }
.cc-dots i{ width:8px; height:8px; border-radius:50%; background:var(--track); display:block; }
.cc-dots i.on{ background:var(--green); }
.cc-bar{ height:5px; border-radius:4px; background:var(--track); overflow:hidden; }
.cc-bar i{ display:block; height:100%; border-radius:4px; background:var(--green); transition:width .3s; }
.cc-sub{ font-size:10.5px; font-weight:700; color:var(--ink-3); line-height:1.45; }
.cc-sub2{ font-size:10px; font-weight:700; color:var(--green-d); }
.cc-ok{ font-size:10.5px; font-weight:800; color:var(--green-d); }
.cc-act{ display:flex; gap:5px; flex-wrap:wrap; margin-top:2px; }
.cc-act .btn.mini{ flex:none; }
@media (max-width:720px){ .crew-row{ grid-template-columns:1fr; } }
:root[data-theme="dark"]{
  --bg:#14161a; --bg2:#191c21; --panel:#1e2228; --panel-2:#23272e;
  --ink:#e9e5db; --ink-2:#b9b3a6; --ink-3:#8a8578;
  --line:#2f343c; --line-2:#3a4048;
  --green:#5fb36f; --green-d:#7ec98d; --gold:#e0b352; --gold-l:#4a3c1f;
  --red:#e06767; --blue:#6aa6e0; --soil:#2a2622; --soil-d:#1c1916;
}
:root[data-theme="dark"] body{ background:var(--bg); color:var(--ink); }
:root[data-theme="dark"] .store-row,
:root[data-theme="dark"] .order-row{ background:#242a31; border-color:#333a43; }
:root[data-theme="dark"] .plot{ background:#20242a; }


/* ---------- theme tokens ---------- */
:root{
  --card:#fffdf7; --card-2:#f8f1e2; --card-solid:#fff;
  --hover:#fff9e8; --chip-bg:rgba(255,255,255,.75);
  --track:#ece1cb; --topbar:rgba(255,253,248,.94);
  --glow1:#fff8e8; --glow2:#eaf6e6;
  --plot1:#fdf8ec; --plot2:#f7efdd; --plot3:#efe4cd;
  --soft:rgba(255,255,255,.6);
}
:root[data-theme="dark"]{
  --card:#20242a; --card-2:#272d35; --card-solid:#262c34;
  --hover:#2b323a; --chip-bg:rgba(255,255,255,.08);
  --track:#2f353d; --topbar:rgba(20,22,26,.94);
  --glow1:rgba(255,180,80,.05); --glow2:rgba(90,200,120,.05);
  --plot1:#232930; --plot2:#20242b; --plot3:#1b1f25;
  --soft:rgba(255,255,255,.08);
}
:root[data-theme="dark"] .chip.weather{ background:linear-gradient(160deg,#2a3039,#232830); border-color:#3a4149; }
:root[data-theme="dark"] .chip.weather[data-w="sunny"]{ color:#f0c46a; }
:root[data-theme="dark"] .catch-area,
:root[data-theme="dark"] .modal{ box-shadow:0 18px 40px rgba(0,0,0,.45); }
/* 表单控件默认不继承文字色，深色模式会把按钮字吃掉 */
button{ color:inherit; font:inherit; }
.btn small{ color:var(--ink-3); }

:root[data-theme="dark"] .farm{
  background:radial-gradient(700px 220px at 50% -40%, rgba(255,255,255,.05), transparent 70%), var(--topbar);
}
:root[data-theme="dark"] .chip.weather[data-w="sunny"]{ background:linear-gradient(160deg,#332c20,#2a2620); }
:root[data-theme="dark"] .chip.weather[data-w="cloudy"]{ background:linear-gradient(160deg,#2b3037,#242a31); }
:root[data-theme="dark"] .chip.weather[data-w="rain"]{ background:linear-gradient(160deg,#232b36,#1f2630); }

/* ---------- codex stats ---------- */
.codex-stat{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
.codex-stat div{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:8px 6px; text-align:center; }
.codex-stat b{ display:block; font-size:15px; font-weight:900; }
.codex-stat span{ font-size:10.5px; font-weight:700; color:var(--ink-3); }
.book-row .bd{ width:36px; text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-3); flex:none; }
.book-row .bv{ width:56px; text-align:right; font-size:10.5px; font-weight:800; color:var(--gold); flex:none; }

/* ---------- v1.5: 3-col shop / stats canvas ---------- */
.shop-two{ grid-template-columns:repeat(3, minmax(0,1fr)) !important; }
#stat-canvas{ width:100%; max-width:100%; height:auto; display:block; margin:4px 0 8px; border-radius:10px; background:var(--card); border:1px solid var(--line); }
@media (max-width:560px){ .shop-two{ grid-template-columns:1fr !important; } }

/* ---------- v1.5.1: stats colors / toast wrap ---------- */
.cat-in{ color:#3d8b4f; }
.cat-out{ color:#c9554a; }
.toast-root .toast, .toast{ max-width:min(560px, 88vw); white-space:normal; line-height:1.5; text-align:left; }

/* ---------- v1.6: 水产库存 / 成就 ---------- */
.store-row .sf-note{ color:var(--ink-3); font-weight:700; }
.store-row.sold-out{ opacity:.55; }

/* ---------- v2.8: 进货库存圆点 / 反季小标签 ---------- */
.stock-dots{ display:inline-flex; gap:3px; align-items:center; vertical-align:middle; margin:0 4px 0 2px; }
.stock-dots i{ width:7px; height:7px; border-radius:50%; background:var(--track); display:block; }
.stock-dots i.on{ background:var(--green); }
.store-row.sold-out .stock-dots i.on{ background:var(--line-2); }
.store-row .btn.mini{ flex:none; white-space:nowrap; }
.tago{ display:inline-block; font-size:10px; font-weight:800; padding:0 5px; border-radius:6px;
  background:rgba(201,85,74,.15); color:var(--red); vertical-align:middle; }

/* ---------- v2.12: 市场分析曲线 ---------- */
.market-tabs{ display:flex; gap:6px; margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.market-tab{ flex:1; padding:7px 10px; border:1px solid var(--line); border-radius:9px; background:var(--card-2);
  color:var(--ink-2); font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
.market-tab.active{ border-color:var(--green); background:var(--green); color:#fff; }
.sparkwrap{ flex:none; display:flex; align-items:center; justify-content:flex-end; }
.spark{ color:var(--green); display:block; overflow:visible; }
:root[data-theme="dark"] .spark{ color:#7fc98d; }
.market-portfolio{ padding:9px 10px; margin:9px 0 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
.market-portfolio-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(86px,1fr)); gap:7px; margin:8px 0 6px; }
.market-portfolio-grid div{ min-width:0; padding:7px 5px; border:1px solid var(--line); border-radius:9px; background:var(--card-2); text-align:center; }
.market-portfolio-grid span{ display:block; color:var(--ink-3); font-size:10px; font-weight:700; }
.market-portfolio-grid b{ display:block; font-size:13px; font-variant-numeric:tabular-nums; }
.market-portfolio-grid .market-up b{ color:var(--green-d); }
.market-portfolio-grid .market-down b{ color:var(--red); }
.sv .market-up{ color:var(--green-d); }
.sv .market-down{ color:var(--red); }
.market-wait-note{ line-height:1.5; }
:root[data-theme="dark"] .market-portfolio-grid .market-up b{ color:#7ec98d; }
:root[data-theme="dark"] .market-portfolio-grid .market-down b{ color:#e28b80; }
:root[data-theme="dark"] .sv .market-up{ color:#7ec98d; }
:root[data-theme="dark"] .sv .market-down{ color:#e28b80; }

.ach-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:11px;
  background:var(--card); border:1px solid var(--line); margin-top:6px; }
.ach-row .ae{ font-size:20px; flex:none; width:26px; text-align:center; }
.ach-row .ai{ flex:1; min-width:0; }
.ach-row .an{ font-size:12.5px; font-weight:800; display:flex; align-items:center; gap:6px; }
.ach-row .ad{ font-size:11px; color:var(--ink-3); font-weight:600; margin:1px 0 5px; line-height:1.45; }
.ach-row .abar{ height:5px; border-radius:4px; background:var(--track); overflow:hidden; }
.ach-row .abar i{ display:block; height:100%; border-radius:4px; background:var(--green); transition:width .3s; }
.ach-row .ap{ font-size:11px; font-weight:800; color:var(--ink-3); flex:none; }
.ach-row.done{ border-color:rgba(79,156,95,.45); background:var(--soft); }
.ach-row.done .abar i{ background:var(--green-d); }
.ach-row .adone{ font-size:10px; font-weight:800; color:var(--green-d); background:rgba(79,156,95,.14);
  border-radius:6px; padding:1px 6px; }

/* ---------- v1.7: 四按钮商店 / 自定义数量 ---------- */
.shop-four{ grid-template-columns:repeat(2, minmax(0,1fr)) !important; }
.shop-four .wide-cell{ grid-column:1 / -1; }
.buy-custom{ display:flex; align-items:center; gap:8px; margin-top:8px; padding:8px 10px; border-radius:11px;
  background:var(--card); border:1px solid var(--line); font-size:11.5px; font-weight:700; color:var(--ink-2);
  flex-wrap:wrap; }
.buy-custom input{ width:76px; padding:4px 8px; border-radius:8px; border:1px solid var(--line-2);
  background:transparent; color:var(--ink); font:inherit; font-weight:800; text-align:center; }
.buy-custom select{ padding:4px 8px; border-radius:8px; border:1px solid var(--line-2);
  background:transparent; color:var(--ink); font:inherit; font-weight:800; max-width:140px; }
.order-row.long{ border-color:rgba(217,159,43,.45); background:rgba(217,159,43,.08); }

.lv-chip{ font-size:11px; font-weight:800; color:var(--green-d); background:rgba(79,156,95,.14);
  border:1px solid rgba(79,156,95,.28); border-radius:8px; padding:1px 8px; margin-left:8px; }
:root[data-theme="dark"] .lv-chip{ color:#7ec98d; }
.buy-custom .bc-tip{ color:var(--ink-3); font-weight:600; }
@media (max-width:560px){ .shop-four{ grid-template-columns:1fr !important; } }

/* ---------- v1.8: 等级解锁 ---------- */
.shop-row.locked, .store-row.locked{ opacity:.62; }
.lock{ font-size:10px; font-weight:800; color:#a9701a; background:rgba(217,159,43,.16);
  border-radius:6px; padding:1px 6px; }
:root[data-theme="dark"] .lock{ color:#e0b352; }

/* ---------- 分享名片 ---------- */
.share-preview{ margin:0 auto 12px; max-width:420px; }
.share-preview img{ display:block; width:100%; height:auto; border-radius:16px;
  border:1px solid var(--line-2); box-shadow:var(--shadow); }
.share-fallback{ display:flex; flex-direction:column; gap:10px; }
.share-fb-day{ font-size:13px; color:var(--ink-2); font-weight:700; }
.share-fb-coins{ font-size:34px; font-weight:800; color:var(--gold); line-height:1.1; }
.share-fb-grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.share-fb-grid>div{ background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:9px 10px; display:flex; flex-direction:column; gap:2px; }
.share-fb-grid b{ font-size:15px; }
.share-fb-grid span{ font-size:11px; color:var(--ink-3); font-weight:600; }

/* ---------- 图鉴奖励 ---------- */
.codex-rw{ display:flex; align-items:center; gap:8px; padding:6px 9px; margin-bottom:6px;
  border-radius:10px; background:var(--card); border:1px solid var(--line);
  font-size:11.5px; font-weight:700; color:var(--ink-2); }
.codex-rw.got{ opacity:.55; }
.codex-rw .cw-k{ flex:none; }
.codex-rw .cw-bar{ flex:1 1 auto; min-width:36px; height:6px; border-radius:99px;
  background:rgba(122,96,60,.14); overflow:hidden; }
.codex-rw .cw-bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--green-d)); }
.codex-rw .cw-n{ flex:none; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.codex-rw .cw-r{ flex:none; color:var(--gold); white-space:nowrap; }

  .codex-rw{ flex-wrap:wrap; }

}

/* ---------- 状态页分区 / 收益条形 ---------- */
.stat-sec{ margin-bottom:14px; }
.stat-sec:last-child{ margin-bottom:0; }
.stat-sec h4{ margin:0 0 7px; font-size:12.5px; font-weight:800; color:var(--ink-2); letter-spacing:.3px; }
.stat-sec .kv{ margin:0; }
.stat-sum{ font-size:12.5px; font-weight:700; color:var(--ink-2); margin:0 0 8px; }
.stat-bar{ display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11.5px; font-weight:700; }
.stat-bar .sb-n{ width:104px; flex:none; color:var(--ink-2); }
.stat-bar .sb-t{ flex:1; height:7px; border-radius:99px; background:rgba(122,96,60,.14); overflow:hidden; }
.stat-bar .sb-t i{ display:block; height:100%; border-radius:99px; }
.stat-bar .sb-t i.in{ background:linear-gradient(90deg,var(--green),var(--green-d)); }
.stat-bar .sb-t i.out{ background:linear-gradient(90deg,#d98b7f,var(--red)); }
.stat-bar b{ width:74px; flex:none; text-align:right; font-variant-numeric:tabular-nums; }
.stat-tip{ font-size:11px; color:var(--ink-3); font-weight:600; margin-top:6px; line-height:1.55; }
@media (max-width:560px){
  .stat-bar .sb-n{ width:82px; }
  .stat-bar b{ width:62px; }
}

/* ---------- 经营档案 ---------- */
.profile-head{ display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:12px;
  border-radius:16px; border:1px solid var(--line);
  background:linear-gradient(135deg, rgba(79,156,95,.14), rgba(217,163,43,.12)); }
.profile-rank{ font-size:34px; line-height:1; flex:none; }
.profile-title{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.profile-title b{ font-size:16px; }
.profile-title small{ font-size:11.5px; color:var(--ink-3); font-weight:600; }
.profile-worth{ flex:none; display:flex; align-items:baseline; gap:4px; }
.profile-worth b{ font-size:20px; font-weight:900; color:var(--gold); }
.profile-worth small{ font-size:10.5px; color:var(--ink-3); font-weight:700; }

/* ---------- 河边：每杆预估（一排小胶囊） ---------- */
.fish-forecast{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px;
  font-size:11.5px; font-weight:700; color:var(--ink-3); }
.fish-forecast > span{
  display:inline-flex; align-items:baseline; gap:4px; min-width:0;
  padding:4px 9px; border-radius:9px; line-height:1.35;
  background:var(--soft); border:1px solid var(--line);
}
.fish-forecast b{ color:var(--ink); font-weight:900; }
.fish-forecast i{ font-style:normal; font-size:10.5px; margin-left:2px; color:var(--ink-3); }
.fish-forecast b.up, .fish-forecast i.up{ color:var(--green-d); }
.fish-forecast b.down, .fish-forecast i.down{ color:var(--red); }
.fish-forecast .ff-warn{ color:var(--blue); }

/* 河边两栏的断点 */
@media (max-width:1080px){
  .river{ grid-template-columns:1fr; gap:10px; }
  .river-side{ padding-left:0; border-left:0; border-top:1px dashed var(--line-2); padding-top:9px; }
  .river-side .crew-row{ grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:720px){
  .river-side .crew-row{ grid-template-columns:1fr; }
  .bait-row{ grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); }
}

/* ---------- 行内小按钮组（仓库「全部」/ 渔具店买饵） ---------- */
.store-row .spw{ margin-left:auto; display:flex; gap:5px; flex:none; }
.store-row .spw .btn{ min-height:24px; padding:3px 8px; }
@media (max-width:560px){
  .store-row .spw{ flex-wrap:wrap; justify-content:flex-end; }
}

/* ---------- v2.39: 钓鱼记录卡片网格 ---------- */
.book-stats-bar{ display:flex; gap:12px; font-size:12px; font-weight:700; color:var(--ink-3); margin-bottom:8px; flex-wrap:wrap; }
.book-stats-bar b{ color:var(--ink); font-weight:900; }
.bstat{ display:flex; flex-direction:column; gap:2px; }
.bl{ font-size:10.5px; font-weight:600; color:var(--ink-3); }
.bv{ font-size:12px; font-weight:800; }
.book-tabs{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.book-tab{
  padding:5px 10px; border-radius:10px; cursor:pointer;
  border:1px solid var(--line); background:var(--card);
  font-size:11.5px; font-weight:700; color:var(--ink-3);
}
.book-tab.active{ background:var(--blue); color:#fff; border-color:transparent; }
#book-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:6px; }
.book-card{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:8px 6px; border-radius:10px; border-left:3px solid var(--line-2);
  background:var(--card); border:1px solid var(--line);
  font-size:10.5px; text-align:center; transition:transform .15s;
}
.book-card-sm{ padding:6px 5px; min-width:0; }
.book-card:hover{ transform:translateY(-2px); }
.book-card-emoji{ font-size:24px; line-height:1.2; }
.book-card-name{ font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; font-size:10.5px; }
.book-card-type{ font-size:9.5px; font-weight:700; }
.book-card-price{ font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums; font-size:10.5px; }


/* ---------- v2.40: 自动播种器卡片布局 ---------- */
.seed-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(146px,1fr)); gap:8px; margin:8px 0 4px; }
.seed-card{
  display:flex; flex-direction:column; gap:3px; min-width:0;
  padding:8px 9px; border-radius:12px; background:var(--card);
  border:1px solid var(--line); font-size:11px;
}
.seed-card.on{ border-color:rgba(79,156,95,.55); background:rgba(79,156,95,.08); }
.seed-card.empty{ opacity:.75; border-style:dashed; }
.seed-card .sc-head{ display:flex; align-items:baseline; gap:5px; }
.seed-card .sc-head b{ font-size:11.5px; font-weight:800; }
.seed-card .sc-head span{ font-size:10px; color:var(--ink-3); font-weight:700; margin-left:auto; }
.seed-card .sc-main{ font-size:12px; font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seed-card .sc-foot{ font-size:10px; color:var(--ink-3); font-weight:700; }
.seed-card .btn.mini{ margin-top:3px; }

.seed-picks{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:6px; margin-top:6px; }
.seed-chip{
  display:flex; align-items:center; gap:5px; min-width:0;
  padding:6px 8px; border-radius:10px; cursor:pointer;
  background:var(--card); border:1px solid var(--line);
  font-family:inherit; font-size:11.5px; font-weight:700; color:var(--ink-2);
}
.seed-chip:hover{ border-color:var(--line-2); }
.seed-chip.on{ border-color:rgba(79,156,95,.55); background:rgba(79,156,95,.1); color:var(--green-d); }
.seed-chip .sc-emoji{ font-size:14px; }
.seed-chip .sc-name{ color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seed-chip .sc-n{ margin-left:auto; font-size:10.5px; color:var(--ink-3); }
.seed-chip .sc-used{ font-size:9.5px; color:var(--green-d); }


/* ---------- 厨房 / 烹饪 ---------- */
.cook-top{ font-size:11.5px; line-height:1.6; color:var(--ink-2); font-weight:700; padding:8px 10px; border-radius:10px; background:var(--soft); }
.cook-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px; }

<body>

<header class="topbar">

  <div class="hud">

    <div class="chip energy" title="体力">

    </div>
    <div class="chip weather" id="hud-weather">☀️ 晴天</div>
    <div class="chip" id="hud-fee" title="每天睡觉扣一次">🍖 —</div>
    <div class="chip" id="hud-plots">🏞️ —</div>
  </div>

  <div class="top-actions">
    <button class="btn primary sleep-btn" data-act="sleep" title="推进到下一天，扣伙食费并恢复体力">🌙 睡觉</button>
    <button class="icon-btn" id="btn-market" title="市场">📈</button>
    <button class="icon-btn" id="btn-status" title="查看状态">📊</button>
    <button class="icon-btn" id="btn-ach" title="成就">🏆</button>
    <button class="icon-btn" id="btn-codex" title="图鉴">📖</button>
    <button class="icon-btn" id="btn-profile" title="经营档案">🗂️</button>
    <button class="icon-btn" id="btn-settings" title="设置">⚙️</button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
  </div>
</header>

<main class="layout">

  <!-- 左列 -->
  <section class="col-main">

    <div class="panel farm">
      <div class="panel-head">
        <h2>🧑‍🌾 农田</h2>
        <span class="lv-chip" id="farm-lv">🌱 Lv1</span>
        <div class="legend">
          <span>💧 今日已浇</span>
          <span>🧪 已施肥</span>
        </div>
      </div>
      <div class="plot-grid" id="plot-grid"></div>
      <div class="farm-foot">
        <button class="btn wide" data-act="plantAll">🌱 全部播种<small id="plantall-txt"></small></button>
        <button class="btn wide" data-act="fertilizeAll">🧪 全部施肥<small id="fertall-txt"></small></button>
        <button class="btn wide" data-act="waterAll">💧 全部浇水</button>
        <button class="btn wide" data-act="harvestAll">🧺 全部收获</button>
      </div>
    </div>

    <div class="panel fishing">
      <div class="panel-head">
        <h2>🎣 河边</h2>
        <span class="lv-chip" id="fish-lv">🎣 Lv1</span>
        <span class="fish-meta" id="fish-meta"></span>
      </div>
      <div class="river">

          <div class="bait-row" id="bait-row"></div>
          <div class="fish-forecast" id="fish-forecast"></div>

          </div>
        </div>
        <div class="river-side">

        </div>
      </div>
    </div>

    <div class="panel orchard">

</main>

  /* 成就奖励文案：成就点 + 金币 / 种子 / 肥料 / 饵料 / 茶 / 钥匙 */
  function rewardText(a) {
    const parts = [];
    if (a.pts) parts.push(a.pts + ' 点');
    const r = a.reward || {};
    if (r.coins) parts.push(r.coins + ' 金');
    ['seeds', 'ferts', 'bait', 'teas', 'keys'].forEach(function (k) {
      const bag = r[k] || {};
      Object.keys(bag).forEach(function (id) {
        let name = id;
        if (k === 'seeds' && CROPS[id]) name = CROPS[id].name + '种子';
        if (k === 'ferts' && FERT[id]) name = FERT[id].name;
        if (k === 'bait') name = id === 'worm' ? '蚯蚓' : '面团饵';
        if (k === 'teas' && TEAS[id]) name = TEAS[id].name;
        if (k === 'keys' && KEYS[id]) name = KEYS[id].name;
        parts.push(name + '×' + bag[id]);
      });
    });
    return '奖励 ' + parts.join(' · ');
  }

  function applyReward(s, r, label) {
    r = r || {};
    if (r.coins) addCoins(s, r.coins, label || '成就奖励');
    Object.keys(r.seeds || {}).forEach(function (id) {
      s.seeds[id] = (s.seeds[id] || 0) + r.seeds[id];
    });
    Object.keys(r.ferts || {}).forEach(function (id) {
      s.ferts[id] = (s.ferts[id] || 0) + r.ferts[id];
    });
    Object.keys(r.bait || {}).forEach(function (id) {
      s.bait[id] = (s.bait[id] || 0) + r.bait[id];
    });
    Object.keys(r.teas || {}).forEach(function (id) {
      s.teas = s.teas || {};
      s.teas[id] = (s.teas[id] || 0) + r.teas[id];
    });
    Object.keys(r.keys || {}).forEach(function (id) {
      s.keys = s.keys || {};
      s.keys[id] = (s.keys[id] || 0) + r.keys[id];
    });
  }

  /* 成就点 → 售价加成：每 10 点 +1%，最多 +20% */
  function achPts(s) {
    s.ach = s.ach || {};
    return ACH.reduce(function (n, a) { return n + (s.ach[a.id] ? (a.pts || 0) : 0); }, 0);
  }
  function sellBonus(s) {
    return 1 + Math.min(0.2, Math.floor(achPts(s) / 10) * 0.01);

  /* 检查并解锁：点数 + 实质奖励一起发放 */
  function checkAchievements(s) {
    s.ach = s.ach || {};
    const out = [];
    ACH.forEach(function (a) {
      if (s.ach[a.id]) return;
      if (a.val(s) < a.goal) return;
      s.ach[a.id] = s.day;
      applyReward(s, a.reward);
      const bonus = Math.round((sellBonus(s) - 1) * 100);
      log(s, '🏆 成就解锁：' + a.emoji + ' ' + a.name + '（' + rewardText(a) +
        ' · 售价 +' + bonus + '%）', 'good');
      out.push({ id: a.id, name: a.name, emoji: a.emoji, pts: a.pts, bonus: bonus, text: rewardText(a) });
    });
    return out;
  }

  /* 单个成就的进度信息，给界面用 */
  function achInfo(s) {
    s.ach = s.ach || {};
    return ACH.map(function (a) {
      const cur = Math.min(a.val(s), a.goal);
      return { id: a.id, cat: a.cat, emoji: a.emoji, name: a.name, desc: a.desc,
               goal: a.goal, cur: cur, done: !!s.ach[a.id], day: s.ach[a.id] || 0,
               pts: a.pts, reward: rewardText(a) };
    });
  }

/* ==================== src/03-core.js ==================== */
/* 基础工具：随机、季节、等级、等级解锁 */
  /* ---------------- 随机 ---------------- */

  let RNG = Math.random;
  function setRng(fn) { RNG = fn || Math.random; }
  function rand() { return RNG(); }
  function randInt(a, b) { return a + Math.floor(rand() * (b - a + 1)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function weighted(list, key) {
    let total = 0;
    for (let i = 0; i < list.length; i++) total += list[i][key] || 0;
    let r = rand() * total;
    for (let i = 0; i < list.length; i++) {
      r -= (list[i][key] || 0);
      if (r <= 0) return list[i];
    }
    return list[list.length - 1];
  }

  /* 季节：每 30 天换一季，冬天（第 4 季）土地封冻、河面结冰 */
  const SEASONS = ['春', '夏', '秋', '冬'];
  const WINTER = 3;
  function seasonIdx(day) {
    return Math.floor((Math.max(1, day || 1) - 1) / BALANCE.seasonDays) % 4;
  }
  function seasonOf(day) { return SEASONS[seasonIdx(day)]; }
  function isWinter(day) { return seasonIdx(day) === WINTER; }

  /* 这种作物现在能不能种 / 买 */
  function cropSeasonOk(id, day) {
    const c = CROPS[id];
    if (!c) return false;
    return (c.seasons || [0, 1, 2]).indexOf(seasonIdx(day)) >= 0;
  }
  function seasonText(id) {
    const c = CROPS[id];
    const ss = (c && c.seasons) || [];
    return ss.map(function (i) { return SEASONS[i]; }).join('·');
  }

  /* 天气按季节抽：权重表见 SEASON_WEATHER（冬天会下雪） */
  function seasonWeatherTable(day) {
    const t = SEASON_WEATHER[seasonIdx(day)] || SEASON_WEATHER[0];
    return Object.keys(t).filter(function (id) { return t[id] > 0 && WEATHER[id]; })
      .map(function (id) { return { id: id, w: t[id] }; });
  }
  function rollWeather(day) { return weighted(seasonWeatherTable(day || 1), 'w').id; }

  /* 多次取最好：boost = true 滚 2 次（蚯蚓），数字则滚 N 次（施肥） */
  function rollQuality(boost) {
    let n = 1;
    if (boost === true) n = 2;
    else if (typeof boost === 'number') n = Math.max(1, Math.round(boost));
    let best = null, bestIdx = -1;
    for (let i = 0; i < n; i++) {
      const q = weighted(QUALITY, 'w');
      const idx = QUALITY.indexOf(q);
      if (idx > bestIdx) { best = q; bestIdx = idx; }
    }
    return best;
  }

  /* ---------------- 等级（种田 / 钓鱼 / 挖蚯蚓 / 采集 / 交易） ---------------- */

  const SKILLS = ['farm', 'fish', 'dig', 'forage', 'trade', 'cook'];
  const SKILL_NAME = { farm: '种田', fish: '钓鱼', dig: '挖蚯蚓', forage: '采集', trade: '交易', cook: '烹饪' };

  /* 交易等级用一条更长的曲线（经验来自交易额，来得快）；烹饪略短一点 */
  function levelNeed(lv, kind) {
    const l = lv || 1;
    if (kind === 'trade') {
      const T = BALANCE.trade;
      return T.xpBase + T.xpStep * (l - 1);
    }
    if (kind === 'cook') {
      const C = BALANCE.cook;
      return C.xpBase + C.xpStep * (l - 1);
    }
    const L = BALANCE.level;
    return L.xpBase + L.xpStep * (l - 1);
  }

  /* 挖蚯蚓每 4 级 +1 条（Lv4 / Lv8） */
  function digYieldBonus(s) {
    return Math.floor(skillLv(s, 'dig') / BALANCE.dig.yieldAt);
  }
  /* 采集每 4 级多取一次品质（Lv4 / Lv8），效果等同施肥 */
  function forageRolls(s) {
    return 1 + Math.floor(skillLv(s, 'forage') / BALANCE.forage.qualityAt);
  }

  function tradeLv(s) { return skillLv(s, 'trade'); }
  /* 交易等级：商店进价小幅下调 */
  function tradeCut(s) {
    const T = BALANCE.trade;
    return 1 - Math.min(T.maxCut, (tradeLv(s) - 1) * T.buyCut);
  }
  /* 交易经验：按成交金额给（每 5 金 1 点） */
  function tradeXp(s, gold) {
    const g = Math.max(0, Math.round(gold || 0));
    if (!g) return 0;
    return addLevelXp(s, 'trade', g / BALANCE.trade.xpPer);
  }

  function levelEffectText(kind, lv) {
    const max = BALANCE.level.max;
    if (kind === 'fish') {
      return '咬钩 +' + Math.min(10, (lv - 1) * 1.1).toFixed(1) + '% · 好鱼 +' +
        Math.min(22.5, (lv - 1) * 2.5).toFixed(1) + '%';
    }
    if (kind === 'dig') {
      return '挖蚯蚓 ' + digCostByLv(lv) + ' 体力 · 产量 +' + Math.floor(lv / BALANCE.dig.yieldAt) +
        (lv >= max ? '（满级已省 1 点）' : '');
    }
    if (kind === 'forage') {
      return '采集 ' + forageCostByLv(lv) + ' 体力 · 品质 ×' +
        (1 + Math.floor(lv / BALANCE.forage.qualityAt)) +
        (lv >= max ? '（满级已省 1 点）' : '');
    }
    if (kind === 'trade') {
      return '商店进价 −' + (Math.min(BALANCE.trade.maxCut, (lv - 1) * BALANCE.trade.buyCut) * 100).toFixed(1) + '%';
    }
    if (kind === 'cook') {
      return '失败 ' + Math.round(cookFailByLv(lv) * 100) + '% · 品质取 ' + cookRollsByLv(lv) + ' 次最好';
    }
    return '收获产量 +' + Math.floor(lv / 4);
  }

  /* 满级奖励：挖蚯蚓 3→2、采集 5→4 */
  function digCostByLv(lv) {
    return BALANCE.dig.energy - ((lv >= BALANCE.level.max) ? BALANCE.level.maxEnergySave : 0);
  }
  function forageCostByLv(lv) {
    return BALANCE.forage.energy - ((lv >= BALANCE.level.max) ? BALANCE.level.maxEnergySave : 0);
  }
  function digCost(s) { return digCostByLv(skillLv(s, 'dig')); }
  function forageCost(s) { return forageCostByLv(skillLv(s, 'forage')); }

  /* 烹饪：等级越高，做砸的概率越低、品质判定次数越多 */
  function cookFailByLv(lv) {
    const C = BALANCE.cook;
    return Math.max(C.failMin, C.failBase - C.failStep * (lv - 1));
  }
  function cookRollsByLv(lv) {
    let n = 1;
    (BALANCE.cook.qualityAt || []).forEach(function (at) { if (lv >= at) n++; });
    return n;
  }
  function cookLv(s) { return skillLv(s, 'cook'); }
  function cookFail(s) { return cookFailByLv(cookLv(s)); }
  function cookRolls(s) { return cookRollsByLv(cookLv(s)); }
  /* 每天能做的份数：基础 3，Lv4 +1，Lv8 再 +1 */
  function cookDailyLimit(s) {
    let n = BALANCE.cook.dailyBase;
    (BALANCE.cook.dailyAt || []).forEach(function (at) { if (cookLv(s) >= at) n++; });
    return n;
  }
  function cookLeft(s) {
    const used = (s.cookedDay === (s.day || 1)) ? (s.cookedToday || 0) : 0;
    return Math.max(0, cookDailyLimit(s) - used);
  }
  function kitchenUnlocked(s) {
    return farmLv(s) >= BALANCE.cook.unlockFarm && fishLv(s) >= BALANCE.cook.unlockFish;
  }
  function lunchEaten(s) { return (s.lunchDay || 0) === (s.day || 1); }
  /* 实际要扣的伙食费：厨房已解锁且没吃午饭 → ×1.5 */
  function mealFeeDue(s) {
    const base = mealFee(s);
    if (!kitchenUnlocked(s) || lunchEaten(s)) return base;
    return Math.round(base * BALANCE.meal.skipLunchMul);
  }

  /* 加经验，返回升了几级 */
  function addLevelXp(s, kind, n) {
    if (!s.levels) s.levels = {};
    const key = SKILLS.indexOf(kind) >= 0 ? kind : 'farm';
    const xpKey = key + 'Xp';
    if (!s.levels[key]) s.levels[key] = 1;
    // n 省略时默认 +1；显式传 0 就是「这一杆不给经验」
    const gain = (n === undefined || n === null) ? 1 : Math.max(0, Math.round(n));
    s.levels[xpKey] = (s.levels[xpKey] || 0) + gain;
    let ups = 0;
    while (s.levels[key] < BALANCE.level.max && s.levels[xpKey] >= levelNeed(s.levels[key], key)) {
      s.levels[xpKey] -= levelNeed(s.levels[key], key);
      s.levels[key]++;
      ups++;
    }
    if (s.levels[key] >= BALANCE.level.max) {
      s.levels[xpKey] = Math.min(s.levels[xpKey], levelNeed(BALANCE.level.max, key) - 1);
    }
    if (ups) {
      log(s, '⭐ ' + SKILL_NAME[key] + '等级 → Lv' + s.levels[key] +
        '（' + levelEffectText(key, s.levels[key]) + '）', 'good');
    }
    return ups;
  }

  /* 种田等级：每 yieldEvery 级 +1 产量（普通作物）；大作物不吃等级 */
  function farmYieldBonus(s) {
    return Math.floor((((s.levels && s.levels.farm) || 1)) / BALANCE.level.yieldEvery);
  }
  /* 钓鱼等级：咬钩率 +hookPerLv/级（上限 +hookMax），好鱼权重 +goodPerLv/级（上限 +goodMax） */
  function fishHookBonus(s) {
    const L = BALANCE.level;
    return Math.min(L.hookMax, L.hookPerLv * ((((s.levels && s.levels.fish) || 1)) - 1));
  }
  function fishGoodBonus(s) {
    const L = BALANCE.level;
    return 1 + Math.min(L.goodMax, L.goodPerLv * ((((s.levels && s.levels.fish) || 1)) - 1));
  }

  /* ---------------- 等级解锁 ---------------- */

  function farmLv(s) { return (s.levels && s.levels.farm) || 1; }
  function fishLv(s) { return (s.levels && s.levels.fish) || 1; }
  function digLv(s) { return (s.levels && s.levels.dig) || 1; }
  function forageLv(s) { return (s.levels && s.levels.forage) || 1; }
  function skillLv(s, kind) { return (s.levels && s.levels[kind]) || 1; }

  /* 种子：高级种子要种田等级 */
  function seedUnlocked(s, id) {
    const c = CROPS[id];
    return !!c && farmLv(s) >= (c.lv || 1);
  }
  /* 肥料：特效肥要种田等级 */
  function fertUnlocked(s, kind) {
    const f = FERT[kind];
    return !!f && farmLv(s) >= (f.lv || 1);
  }
  function sprinklerUnlocked(s) { return farmLv(s) >= BALANCE.gate.sprinkler; }
  function harvesterUnlocked(s) { return farmLv(s) >= BALANCE.gate.harvester; }
  function netUnlocked(s) { return fishLv(s) >= BALANCE.gate.net; }
  /* 渔网上限随钓鱼等级提高：钓鱼 Lv2 可放 4 张，Lv7 起封顶 9 张 */
  function netMax(s) {
    if (!netUnlocked(s)) return 0;
    return Math.min(NET_MAX, BALANCE.gate.netBase + fishLv(s));
  }

  /* 水产店每日进货：每种鱼随机一个库存量；高级水产要等中后期 */
  function rollShopStock(day) {
    const d = day || 1;
    const stock = {};
    FISH.forEach(function (f) {
      if (f.trash || f.noOrder) return;
      if (d < (FISH_UNLOCK[f.id] || 1)) { stock[f.id] = 0; return; }
      const r = SHOP_STOCK[f.id] || [1, 2];
      stock[f.id] = randInt(r[0], r[1]);
    });
    return stock;
  }

  function makeShop(day) {
    return { day: day || 1, stock: rollShopStock(day || 1) };
  }

  /* 农产品店每日进货：便宜菜进得多，贵菜不一定有；南瓜/西瓜中后期才有 */
  function cropStockCap(c) {
    return c.price >= 40 ? 3 : (c.price >= 16 ? 4 : 7);
  }

  function rollCropStock(day) {
    const d = day || 1;
    const stock = {};
    CROP_LIST.forEach(function (c) {
      if (d < (CROP_UNLOCK[c.id] || 1)) { stock[c.id] = 0; return; }
      const cap = cropStockCap(c);
      const low = c.price >= 40 ? 1 : (c.price >= 16 ? 2 : 3);
      stock[c.id] = randInt(low, cap);
    });
    return stock;
  }
  function makeCropShop(day) {
    return { day: day || 1, stock: rollCropStock(day || 1) };
  }

      workUsed: false,
      bait: { worm: 0, dough: 0, premium: 0 },
      lure: { owned: false, dur: 0 },
      lure2: { owned: false, dur: 0 },
      teas: { green: 0, black: 0, milk: 0, coffee: 0 },
      keys: { iron: 0, gold: 0 },
      teaUsed: false,
      /* 厨房：做好的料理（每份带品质 / 体力 / 保质期） */
      food: [],
      lunchDay: 0,
      cookedDay: 0,
      cookedToday: 0,
      ledger: [{ day: 1, label: '开局金币', income: 50, expense: 0, balance: 50 }],
      log: [{ day: 1, text: '🌾 欢迎来到我的小农场，第 1 天开始了。', kind: 'sys' }],
      orders: makeOrders({ day: 1 }),
      longOrder: null,
      longOrderReadyDay: 0,
      shop: makeShop(1),
      cropShop: makeCropShop(1),
      levels: { farm: 1, fish: 1, farmXp: 0, fishXp: 0, dig: 1, digXp: 0, forage: 1, forageXp: 0,
                trade: 1, tradeXp: 0, cook: 1, cookXp: 0 },
      ach: {},
      fishBook: { count: 0, entries: [], best: null, priciest: null },
      stats: { harvests: 0, casts: 0, dug: 0, planted: 0, orders: 0, cropsSold: 0, works: 0,
               longOrders: 0, boxItems: 0, boxIncome: 0, teas: 0, chests: 0, forages: 0,
               cooks: 0, meals: 0,
               incomeTotal: 0, expenseTotal: 0,
               wild: {}, forageBest: 0, orchardFruit: 0, orchardPlanted: 0, fruitSold: 0 }
    };
    TREE_LIST.forEach(function (t) {
      s.treeStock[t.id] = { seed: 0, sapling: 0 };
    });
    s.orchard.slots = new Array(BALANCE.orchard.free).fill(null);
    snapshotMarket(s);
    return s;
  }

  /* ---------------- 工具 ---------------- */

  function log(s, text, kind) {
    s.log.unshift({ day: s.day, text: text, kind: kind || 'info' });
    if (s.log.length > 400) s.log.length = 400;
  }

  function ledger(s, label, income, expense) {
    const balance = Math.round((s.coins) * 100) / 100;
    s.ledger.unshift({ day: s.day, label: label, income: income || 0, expense: expense || 0, balance: balance });
    if (s.ledger.length > 200) s.ledger.length = 200;
  }

  function addCoins(s, amount, label) {
    s.coins += amount;
    s.stats = s.stats || {};
    if (amount >= 0) {
      s.stats.incomeTotal = (s.stats.incomeTotal || 0) + amount;
      ledger(s, label, amount, 0);
    } else {
      s.stats.expenseTotal = (s.stats.expenseTotal || 0) - amount;
      ledger(s, label, 0, -amount);
    }
  }

  /* ---------------- 经营档案 ---------------- */

  /* 设备 / 果树的账面价值（按买入价折算，不折旧） */
  function deviceValue(s) {
    return (s.sprinklers || 0) * BALANCE.device.sprinkler +
           (s.harvester ? BALANCE.device.harvester : 0) +
           (s.seeder || 0) * BALANCE.device.seeder +
           (s.nets || 0) * BALANCE.device.net;
  }
  function orchardValue(s) {
    let v = 0;
    ((s.orchard && s.orchard.slots) || []).forEach(function (t) {
      if (t && TREES[t.id]) v += TREES[t.id].sapling;
    });
    return v;
  }
  /* 净资产 = 现金 + 仓库（收购箱到手口径）+ 收购箱 + 设备 + 果园 */
  function netWorth(s) {
    const coins = Math.max(0, Math.round(s.coins || 0));
    const store = storeTotal(s);
    const box = boxValue(s);
    const device = deviceValue(s);
    const orchard = orchardValue(s);
    return { coins: coins, store: store, box: box, device: device, orchard: orchard,
             total: coins + store + box + device + orchard };
  }
  /* 称号：按净资产取最高一档，并给出下一档目标 */
  function profileRank(s) {
    const R = BALANCE.profile.ranks;
    const worth = netWorth(s).total;
    let cur = R[0];
    R.forEach(function (x) { if (worth >= x.need) cur = x; });
    const next = R.filter(function (x) { return x.need > worth; })[0] || null;
    return { cur: cur, next: next, worth: worth };
  }

  /* 零工单价：体力 1 点 = 2 金（全天）/ 1.2 金（半天） */
  const WORK_RATE_FULL = BALANCE.work.full;
  const WORK_RATE_HALF = BALANCE.work.half;

  function mealFee(s) {
    const M = BALANCE.meal;
    return Math.max(M.min, M.base + (s.maxEnergy - M.from) / M.perEnergy);
  }

  /* 土地维护：超过 5 块开始收费，20 块以上 6 金/周、30 块以上 10 金/周 */
  function plotUpkeep(plots) {
    const U = BALANCE.upkeep;
    let fee = 0;
    for (let i = U.free; i < plots; i++) {
      fee += i < U.midAt ? U.plotPerWeek : (i < U.highAt ? U.plotMid : U.plotHigh);
    }
    return fee;
  }

  /* 设备每周维护费：洒水器 3、自动收获器 5、自动播种器 6/台（渔网免费） */
  function deviceUpkeep(s) {
    return (s.sprinklers || 0) * BALANCE.upkeep.sprinkle +
           (s.harvester ? BALANCE.upkeep.harvester : 0) +
           (s.seeder || 0) * BALANCE.upkeep.seeder;
  }

  function expandCost(s) {
    const n = s.plots.length;
    const B = BALANCE.expand;
    if (n < B.steepFrom) return Math.max(B.base, B.base + B.step * (n - B.from));
    // 25 块之后每块价格逐级上涨
    let c = B.base + B.step * (B.steepFrom - 1 - B.from);
    for (let k = B.steepFrom; k < n; k++) c = Math.round(c * B.steepMul);
    return c;
  }
  /* 强化体力：成本超线性增长（每级 ×1.2），避免「无脑升级」把上限堆到几百 */
  function upgradeCost(s) {
    const U = BALANCE.upgrade;
    const tier = Math.max(0, (s.maxEnergy - U.from) / U.step);
    return Math.round(U.baseCost * Math.pow(U.costMul, tier));
  }
  function workCost(s, mode) { return Math.round(mode === 'half' ? s.maxEnergy / 2 : s.maxEnergy); }
  function workPay(s, mode) {
    const c = workCost(s, mode);
    return Math.round(c * (mode === 'half' ? WORK_RATE_HALF : WORK_RATE_FULL));
  }

  function needOf(p) {
    const c = CROPS[p.crop];
    if (!c) return 0;
    let n = p.phase === 'regrow' ? c.regrowDays : c.days;
    // 反季：普通作物第一茬多花 2 天，大作物直接翻倍（收成本来就慢）
    if (p.off && p.hits === 0) n = c.big ? n * 2 : n + BALANCE.seed.offSeasonDays;
    return n;
  }

  /* 大作物：固定 1 个，不吃肥料产量加成，也不吃等级加成。 */
  function fertBonus(p) {
    const c = CROPS[p.crop];
    if (!c || c.big || c.multi) return 0;
    return p.fert || 0;
  }

  function expectedYield(s, p) {
    const c = CROPS[p.crop];
    if (!c) return 0;
    const offPen = p.off ? BALANCE.seed.offSeasonYield : 0;
    if (c.multi) return Math.max(1, (p.hits === 0 ? c.firstQty : c.regrowQty) - offPen);
    if (c.big) return Math.max(1, c.base - p.missed);
    return Math.max(1, c.base + farmYieldBonus(s) + fertBonus(p) - p.missed - offPen);
  }

  function canHarvest(s, p) {
    return p.phase === 'ripe' && s.day > p.ripeDay;
  }

  function stageEmoji(p) {
    const c = CROPS[p.crop];
    if (!c) return '🟫';
    if (p.phase === 'ripe') return c.emoji;
    const need = needOf(p) || 1;
    const r = p.growth / need;
    if (r <= 0) return '🌱';
    if (r < 0.5) return '🌿';
    return '🌾';
  }

/* ==================== src/05-farm.js ==================== */
/* 农田操作：播种、浇水、收获、肥料、扩张、睡觉、钓鱼主流程 */
  /* ---------------- 操作 ---------------- */

  function grow(p, s) {
    const need = needOf(p);
    if (p.growth < need) p.growth++;
    if (p.growth >= need) {
      p.phase = 'ripe';
      p.ripeDay = s.day;
      return true;
    }
    return false;
  }

  function plant(s, idx, cropId, opts) {
    const free = !!(opts && opts.free);          // 自动播种器：不花体力
    const p = s.plots[idx];
    const c = CROPS[cropId];
    if (!p) return { ok: false, msg: '没有这块地' };
    if (!c) return { ok: false, msg: '没有这种作物' };
    if (isWinter(s.day)) return { ok: false, msg: '冬天土地封冻了，开春再种吧' };
    if (p.crop) return { ok: false, msg: '这块地不是空地' };
    if (!free && s.energy < BALANCE.energy.plant) return { ok: false, msg: '体力不够了，先睡觉吧' };

    // 种子只能从种子店买，播种时只消耗背包里的种子
    const owned = s.seeds[cropId] || 0;
    if (owned <= 0) return { ok: false, msg: '没有 ' + c.name + ' 种子了，先去种子店买' };
    s.seeds[cropId] = owned - 1;
    if (s.seeds[cropId] === 0) delete s.seeds[cropId];

    const off = !cropSeasonOk(cropId, s.day);
    if (!free) s.energy -= BALANCE.energy.plant;
    p.crop = cropId;
    p.off = off ? 1 : 0;
    p.growth = 0;
    p.watered = false;
    p.missed = 0;
    p.fert = 0;
    p.ripeDay = null;
    p.hits = 0;
    p.phase = 'growing';
    p.planted = s.day;
    p.auto = free ? 1 : 0;      // 机器补种的地当晚不算「漏浇」
    s.stats.planted++;
    if (!(opts && opts.quiet)) {
      log(s, '🌱 ' + (idx + 1) + ' 号地种下 ' + c.name + (off ? '（反季，长得慢、结果少）' : ''), 'good');
    }
    return { ok: true, msg: c.name + ' 种下了' + (off ? '（反季）' : ''), off: off };
  }

  /* ---------------- 自动播种器（按片负责） ----------------
   * 第 k 台只管第 [5(k-1)+1, 5k] 块地；收完这块地它立刻补种，睡觉时再把空着的补上。
   */
  function seederPlateOf(s, idx) {
    const per = BALANCE.device.seederPlots;
    const k = Math.floor(idx / per) + 1;
    return k <= Math.max(0, Math.round(s.seeder || 0)) ? k : 0;
  }

  /* 这块地能不能被播种器补种：有对应的机器、那台选了种子、开着、不是冬天、还有种子 */
  function canAutoSeed(s, idx) {
    const k = seederPlateOf(s, idx);
    if (!k) return false;
    const seed = autoSeedOf(s, k);
    if (!seed || !s.seederOn || isWinter(s.day)) return false;
    return (s.seeds[seed] || 0) > 0;
  }

  /* 收完立刻补种，返回种下的作物 id；不满足条件返回 null */
  function autoReplant(s, idx) {
    const k = seederPlateOf(s, idx);
    if (!k || !canAutoSeed(s, idx)) return null;
    const seed = autoSeedOf(s, k);
    const r = plant(s, idx, seed, { free: true, quiet: true });
    return r.ok ? seed : null;
  }

  /* 季节特性：夏天浇水更费体力（2 点），其他季节 1 点 */
  function waterCost(s) {
    return seasonIdx(s.day) === 1 ? BALANCE.energy.waterSummer : BALANCE.energy.water;
  }

  function water(s, idx) {
    const p = s.plots[idx];
    if (!p || !p.crop) return { ok: false, msg: '这块地还没种东西' };
    if (p.phase === 'ripe') return { ok: false, msg: '已经成熟，快点收获吧' };
    if (p.watered) return { ok: false, msg: '今天已经浇过水了' };
    const cost = waterCost(s);
    if (s.energy < cost) return { ok: false, msg: '体力不够（浇水要 ' + cost + ' 点），先睡觉吧' };
    s.energy -= cost;
    p.watered = true;
    const ripe = grow(p, s);
    log(s, '💧 ' + (idx + 1) + ' 号地浇水 ' + CROPS[p.crop].name +
            (ripe ? ' → 成熟！明天可收' : '（' + p.growth + '/' + needOf(p) + '）'),
        ripe ? 'good' : 'info');
    return { ok: true, msg: ripe ? '成熟了！' : '浇水 +1 天', ripe: ripe };
  }

  function waterAll(s) {
    let done = 0, ripened = 0, lack = 0;
    s.plots.forEach(function (p, i) {
      if (!p.crop || p.phase === 'ripe' || p.watered) return;
      const r = water(s, i);
      if (r.ok) { done++; if (r.ripe) ripened++; } else lack++;
    });
    if (!done) return { ok: false, msg: '没有需要浇水的地块' };
    return { ok: true, msg: '浇了 ' + done + ' 块地' + (ripened ? '，' + ripened + ' 块成熟' : ''), done: done };
  }

  function harvest(s, idx, free) {
    const p = s.plots[idx];
    if (!p || !p.crop) return { ok: false, msg: '这块地还没种东西' };
    if (p.phase !== 'ripe') return { ok: false, msg: '还没成熟（' + p.growth + '/' + needOf(p) + ' 天）' };
    if (s.day <= p.ripeDay) return { ok: false, msg: '刚浇成熟，明天才能收获' };
    if (!free && s.energy < BALANCE.energy.harvest) return { ok: false, msg: '体力不够了，先睡觉吧' };

    const c = CROPS[p.crop];
    if (!free) s.energy -= BALANCE.energy.harvest;

    let qty;
    if (c.multi) qty = p.hits === 0 ? c.firstQty : c.regrowQty;
    else if (c.big) qty = clamp(c.base - p.missed, 1, 9);
    else qty = clamp(c.base + farmYieldBonus(s) + randInt(-1, 1) - p.missed + fertBonus(p), 1, 99);
    // 季节特性：秋天大丰收，普通作物（含多次收）每收一次 +1
    if (seasonIdx(s.day) === 2 && !c.big) qty += 1;

    // 作物也有品质：施肥会多滚一次取最好的（普通肥 / 特效肥都是取 2 次最好）
    const q = rollQuality(p.fert > 0 ? 2 : 1);
    const unit = unitValue(p.crop, q.id);
    addStore(s, p.crop, q.id, qty);

    // 图鉴：作物次数 / 首次 / 累计价值 / 最好品质
    const cc = s.codex.crops[p.crop] ||
      (s.codex.crops[p.crop] = { n: 0, best: null, first: s.day, value: 0 });
    cc.n += qty;
    cc.value = (cc.value || 0) + qty * unit;
    if (!cc.first) cc.first = s.day;
    if (!cc.best || QUALITY.indexOf(q) > QUALITY.indexOf(qualityById(cc.best))) cc.best = q.id;

    // 多次收获作物：只有最后一次收获才判定留种
    const willRegrow = !!c.multi && p.hits + 1 < 1 + c.regrowTimes;
    let extraSeed = false;
    if (!willRegrow && rand() < 0.3) {
      s.seeds[p.crop] = (s.seeds[p.crop] || 0) + 1;
      extraSeed = true;
    }
    s.stats.harvests++;
    const levelUp = addLevelXp(s, 'farm', BALANCE.level.farmXpHarvest);

    let regrown = false;
    if (willRegrow) {
      p.hits++;
      p.growth = 0;
      p.phase = 'regrow';
      p.watered = false;
      p.ripeDay = null;
      p.fert = 0;
      p.missed = 0;          // 再生期重新计数，不然会一直挂着「缺水 ×N」
      regrown = true;
    } else {
      s.plots[idx] = makePlot();
    }

    const msg = '收获 ' + c.name + ' ×' + qty + ' · ' + q.emoji + q.name + '（值 ' + qty * unit + ' 金）' +
                (extraSeed ? ' · 留种 +1' : '') +
                (regrown ? ' · 进入再生期' : '');
    // 这块地有自动播种器 → 收完立刻补种，不用等睡觉
    let replanted = null;
    if (!regrown) replanted = autoReplant(s, idx);
    const fullMsg = msg + (replanted ? ' · 🌱 已补种 ' + CROPS[replanted].name : '');
    log(s, '🧺 ' + fullMsg, 'good');
    return { ok: true, msg: fullMsg, qty: qty, crop: p.crop || c.id, unit: unit, quality: q,
             seed: extraSeed, regrown: regrown, levelUp: levelUp, replanted: replanted };
  }

  function harvestAll(s) {
    let total = 0, plots = 0, last = null;
    s.plots.forEach(function (p, i) {
      if (!p.crop || p.phase !== 'ripe') return;
      const r = harvest(s, i);
      if (r.ok) { total += r.qty; plots++; last = r; }
    });
    if (!plots) return { ok: false, msg: '没有可收获的作物' };
    return { ok: true, msg: '收了 ' + plots + ' 块地，共 ' + total + ' 个' };
  }

  /* 农产品收购：作物只能在这里卖（仓库不出售任何东西） */
  function sellAll(s) {
    const ids = Object.keys(s.store).filter(function (k) { return storeCount(s, k) > 0; });
    if (!ids.length) return { ok: false, msg: '仓库里没有作物可卖' };

    let income = 0, count = 0;
    const parts = [];
    ids.forEach(function (id) {
      const n = storeCount(s, id);
      const gain = shopSellValue(s, id, n);
      income += gain; count += n;
      parts.push(CROPS[id].name + '×' + n + ' = ' + gain + ' 金');
      addSupply(s, id, n);
      delete s.store[id];
    });
    s.stats.cropsSold = (s.stats.cropsSold || 0) + count;
    addCoins(s, income, '农产品店 · 卖作物');
    tradeXp(s, income);
    log(s, '💰 农产品店收购 ' + parts.join('、') + '，收入 ' + income + ' 金（8 折）', 'good');
    return { ok: true, msg: '卖出全部，+' + income + ' 金', income: income, count: count };
  }

  /* 铲除：直接清掉这块地，不返还种子/金币 */
  function clearPlot(s, idx) {
    const p = s.plots[idx];
    if (!p || !p.crop) return { ok: false, msg: '这块地本来就是空的' };
    const name = CROPS[p.crop].name;
    s.plots[idx] = makePlot();
    log(s, '🗑️ ' + (idx + 1) + ' 号地铲除了 ' + name, 'warn');
    return { ok: true, msg: '铲除了 ' + name };
  }

  /* 自定义卖出 n 个（从品质差的开始卖） */
  function sellCropN(s, id, n) {
    const have = storeCount(s, id);
    if (!have) return { ok: false, msg: '没有可卖的' };
    const qty = Math.max(1, Math.min(have, Math.floor(n || have)));
    const t = takeStoreN(s, id, qty);
    const raw = t.parts.reduce(function (a, p) { return a + p.n * p.unit; }, 0);
    const gain = Math.max(1, Math.round(shopValue(raw) * sellBonus(s) * marketMul(s, id, qty)));
    addSupply(s, id, qty);
    s.stats.cropsSold = (s.stats.cropsSold || 0) + qty;
    addCoins(s, gain, '农产品店 · 卖 ' + CROPS[id].name + '×' + qty);
    tradeXp(s, gain);
    log(s, '💰 农产品店收购 ' + CROPS[id].name + '×' + qty + '，+' + gain + ' 金（8 折）', 'good');
    return { ok: true, msg: '+' + gain + ' 金', income: gain, count: qty };
  }

  function sellOne(s, id) {
    const n = storeCount(s, id);
    if (!n) return { ok: false, msg: '没有可卖的' };
    const gain = shopSellValue(s, id, n);
    addSupply(s, id, n);
    delete s.store[id];
    s.stats.cropsSold = (s.stats.cropsSold || 0) + n;
    addCoins(s, gain, '农产品店 · 卖 ' + CROPS[id].name);
    tradeXp(s, gain);
    log(s, '💰 农产品店收购 ' + CROPS[id].name + '×' + n + '，+' + gain + ' 金（8 折）', 'good');
    return { ok: true, msg: '+' + gain + ' 金', income: gain, count: n };
  }

  /* 施肥 = 消耗仓库里的肥料（肥料在种子店买，半价卖回） */
  function useFert(s, idx, kind) {
    const p = s.plots[idx];
    const f = FERT[kind];
    if (!p || !p.crop) return { ok: false, msg: '这块地还没种东西' };
    if (!f) return { ok: false, msg: '没有这种肥料' };
    if (p.fert) return { ok: false, msg: '这块地已经施过肥了' };
    if (p.phase === 'ripe') return { ok: false, msg: '都熟了，别浪费肥料' };
    if ((s.ferts[kind] || 0) < 1) return { ok: false, msg: '肥料用完了，去种子店买' };
    if (s.energy < BALANCE.energy.fert) return { ok: false, msg: '体力不够了' };
    s.ferts[kind]--;
    s.energy -= BALANCE.energy.fert;
    p.fert = f.add;
    const big = !!CROPS[p.crop].big;
    log(s, '🧪 ' + (idx + 1) + ' 号地施了' + f.name +
      (big ? '（大作物只提品质）' : '（产量 +' + f.add + '、品质取更优）'), 'good');
    return { ok: true, msg: f.name + ' 施用成功' };
  }

  function fertSellPrice(kind) {
    const f = FERT[kind];
    return f ? Math.max(1, Math.floor(f.cost * FERT_SELL_RATE)) : 0;
  }

  function buyFertItem(s, kind, n) {
    const f = FERT[kind];
    if (!f) return { ok: false, msg: '没有这种肥料' };
    if (!fertUnlocked(s, kind)) {
      return { ok: false, msg: f.name + '要种田 Lv' + f.lv + ' 才解锁（现在 Lv' + farmLv(s) + '）' };
    }
    const qty = Math.max(1, Math.floor(n || 1));
    const unit = Math.round(f.cost * tradeCut(s));
    const cost = unit * qty;
    if (s.coins < cost) return { ok: false, msg: '金币不够（需要 ' + cost + ' 金）' };
    s.coins -= cost;
    ledger(s, '买肥料 ' + f.name + '×' + qty, 0, cost);
    s.ferts[kind] = (s.ferts[kind] || 0) + qty;
    log(s, '🧪 买了' + f.name + ' ×' + qty + '（-' + cost + ' 金）', 'info');
    return { ok: true, qty: qty, cost: cost, msg: '买到 ' + f.name + ' ×' + qty };
  }

  function sellFert(s, kind, n) {
    const f = FERT[kind];
    if (!f) return { ok: false, msg: '没有这种肥料' };
    const have = s.ferts[kind] || 0;
    if (!have) return { ok: false, msg: '没有' + f.name };
    const qty = n ? Math.min(n, have) : have;
    const gain = qty * fertSellPrice(kind);
    s.ferts[kind] = have - qty;
    addCoins(s, gain, '卖肥料 ' + f.name);
    log(s, '💰 卖出' + f.name + ' ×' + qty + '，+' + gain + ' 金', 'good');
    return { ok: true, qty: qty, income: gain, msg: '卖出 ' + f.name + ' ×' + qty + '，+' + gain + ' 金' };
  }

  /* 洒水器：每个每天自动浇 1 块地 */
  function buySprinkler(s) {
    if (!sprinklerUnlocked(s)) {
      return { ok: false, msg: '洒水器要种田 Lv' + BALANCE.gate.sprinkler + ' 才解锁（现在 Lv' + farmLv(s) + '）' };
    }
    if (s.coins < SPRINKLER_COST) return { ok: false, msg: '金币不够（' + SPRINKLER_COST + ' 金）' };
    if (s.sprinklers >= s.plots.length) return { ok: false, msg: '每块地一个就够了（现有 ' + s.plots.length + ' 块地）' };
    s.coins -= SPRINKLER_COST;
    ledger(s, '买洒水器', 0, SPRINKLER_COST);
    s.sprinklers++;
    log(s, '🚿 买了第 ' + s.sprinklers + ' 个洒水器（每天自动浇 1 块地）', 'good');
    return { ok: true, msg: '洒水器 ×' + s.sprinklers, sprinklers: s.sprinklers };
  }

  /* 这块地能不能施肥（大作物、已施肥、已成熟都不行） */
  function canFert(s, idx) {
    const p = s.plots[idx];
    if (!p || !p.crop) return false;
    if (p.fert) return false;
    if (p.phase === 'ripe') return false;
    return true;
  }

  function fertTargets(s) {
    const list = [];
    s.plots.forEach(function (p, i) { if (canFert(s, i)) list.push(i); });
    return list;
  }

  /* 全部施肥：给所有可施肥的地块灌同一种肥，钱/体力不够就停 */
  function fertilizeAll(s, kind) {
    const f = FERT[kind];
    if (!f) return { ok: false, msg: '没有这种肥料' };
    const targets = fertTargets(s);
    if (!targets.length) return { ok: false, msg: '没有可施肥的地块（已施肥、已成熟都不行）' };

    let n = 0, stop = null;
    for (let k = 0; k < targets.length; k++) {
      if (s.energy < BALANCE.energy.fert) { stop = '体力不够了'; break; }
      if ((s.ferts[kind] || 0) < 1) { stop = '肥料不够了'; break; }
      const p = s.plots[targets[k]];
      s.ferts[kind]--;
      s.energy -= BALANCE.energy.fert;
      p.fert = f.add;
      n++;
    }
    if (!n) return { ok: false, msg: stop || '施肥失败' };

    log(s, '🧪 ' + f.name + ' × ' + n + ' 块地（每块 +' + f.add + ' 产量、品质更优）' +
            (stop ? '，' + stop : ''), 'good');
    return {
      ok: true, n: n, stop: stop,
      msg: '施了 ' + n + ' 块地' + (stop ? '（' + stop + '）' : '')
    };
  }

  function sleep(s) {
    const skipLunch = kitchenUnlocked(s) && !lunchEaten(s);
    const fee = mealFeeDue(s);
    const notes = [];
    const coinsBefore = s.coins || 0;
    const cash = [];        // 当日现金收支（正负号）
    const goods = [];       // 入库产出（折算成金，不算现金）
    let missedNow = 0;
    if (s.coins >= fee) {
      addCoins(s, -fee, '伙食费');
      cash.push({ label: '🍖 伙食', value: -fee });
      notes.push({ kind: 'meal', text: '🍖 伙食 -' + fee + (skipLunch ? '（没吃午饭 ×1.5）' : '') });
