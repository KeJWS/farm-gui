<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的小农场 · GUI 版</title>
<meta name="description" content="文字种田游戏《我的小农场》的网页 GUI 版：种菜、浇水、钓鱼、卖鱼、扩张农场。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<style>
/* ================= 我的小农场 · 样式 ================= */
:root{
  --bg:#f6ecd8;
  --bg2:#efe0c3;
  --ink:#3d3122;
  --ink-2:#6d5b45;
  --ink-3:#9a866c;
  --panel:rgba(255,253,247,.86);
  --panel-2:rgba(255,253,247,.6);
  --line:rgba(122,96,60,.16);
  --line-2:rgba(122,96,60,.28);
  --green:#4f9c5f;
  --green-d:#37794a;
  --soil:#8b5c3d;
  --soil-d:#6d462e;
  --gold:#d9a32c;
  --gold-l:#f0c65a;
  --red:#c9554a;
  --blue:#3f7fc4;
  --r:18px;
  --shadow:0 8px 24px rgba(102,78,44,.10), 0 1px 0 rgba(255,255,255,.7) inset;
  --shadow-hover:0 14px 30px rgba(102,78,44,.16);
}

*{ box-sizing:border-box; }

html,body{ height:100%; }

body{
  margin:0;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, #fff8e8 0%, transparent 60%),
    radial-gradient(900px 500px at 95% 0%, #eaf6e6 0%, transparent 55%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}

button{ font-family:inherit; }

/* ---------------- 顶栏 ---------------- */

.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:18px;
  padding:12px 20px;
  background:rgba(255,251,242,.82);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 20px rgba(120,95,60,.07);
}

.brand{ display:flex; align-items:center; gap:11px; }
.logo{
  width:42px; height:42px; display:grid; place-items:center;
  font-size:23px; border-radius:13px;
  background:linear-gradient(160deg,#ffeab5,#f7d179);
  box-shadow:0 4px 10px rgba(190,140,50,.28), 0 0 0 1px rgba(255,255,255,.6) inset;
}
.brand-txt h1{ margin:0; font-size:17px; letter-spacing:.5px; }
.brand-txt p{ margin:1px 0 0; font-size:12px; color:var(--ink-2); }

.hud{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

.chip{
  display:inline-flex; align-items:center; gap:7px;
  height:34px; padding:0 13px;
  border-radius:999px;
  background:#fffdf7;
  border:1px solid var(--line);
  box-shadow:0 2px 6px rgba(120,95,60,.07);
  font-weight:600; font-size:13px; color:var(--ink);
  white-space:nowrap;
}
.chip.coins b{ color:var(--gold); font-size:14px; font-variant-numeric:tabular-nums; }
.chip.energy{ padding-right:14px; }
.chip .ebar{
  width:74px; height:9px; border-radius:99px; overflow:hidden;
  background:#ece1cb; box-shadow:0 0 0 1px rgba(120,95,60,.08) inset;
}
.chip .ebar i{
  display:block; height:100%; width:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#7fd08a,#4f9c5f);
  transition:width .35s cubic-bezier(.2,.8,.3,1), background .3s;
}
.chip.energy.low .ebar i{ background:linear-gradient(90deg,#f0b25a,#e08a3c); }
.chip.energy.empty .ebar i{ background:linear-gradient(90deg,#e08a7a,#c9554a); }
.chip b#hud-etxt{ font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-2); }

.chip.weather{ background:linear-gradient(160deg,#fff8e2,#ffeebf); border-color:rgba(200,160,60,.35); }
.chip.weather[data-w="cloudy"]{ background:linear-gradient(160deg,#f2f4f7,#e3e8ef); }
.chip.weather[data-w="rain"]{ background:linear-gradient(160deg,#e9f1fb,#d6e4f7); }
.chip.weather[data-w="storm"]{ background:linear-gradient(160deg,#e8e3f2,#d5cde8); }

.top-actions{ margin-left:auto; display:flex; gap:8px; }
.icon-btn{
  width:36px; height:36px; border-radius:11px; font-size:16px; cursor:pointer;
  background:#fffdf7; border:1px solid var(--line); color:var(--ink-2);
  box-shadow:0 2px 6px rgba(120,95,60,.07);
  transition:transform .15s, box-shadow .15s, background .15s;
}
.icon-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 14px rgba(120,95,60,.14); background:#fff; }
.icon-btn.off{ opacity:.45; }

/* ---------------- 布局 ---------------- */

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 372px;
  gap:16px;
  padding:16px 20px 40px;
  max-width:1560px; margin:0 auto;
  align-items:start;
}
.col-main,.col-side{ display:flex; flex-direction:column; gap:16px; min-width:0; }

.panel{
  background:rgba(255,253,248,.94);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:15px 16px 16px;
}
.panel-head{
  display:flex; align-items:center; gap:10px;
  margin:0 0 12px;
}
.panel-head h2{
  margin:0; font-size:14.5px; font-weight:800; letter-spacing:.4px;
  display:flex; align-items:center; gap:6px;
}
.panel-head .muted{ margin-left:auto; font-size:12px; color:var(--ink-3); font-weight:600; }
.legend{
  margin-left:auto; display:flex; gap:12px; flex-wrap:wrap;
  font-size:11.5px; color:var(--ink-3); font-weight:600;
}
.legend .ripe-hint{ color:var(--green-d); }

/* ---------------- 农田 ---------------- */

.farm{
  background:
    radial-gradient(700px 220px at 50% -40%, rgba(255,255,255,.85), transparent 70%),
    rgba(255,253,248,.94);
}

.plot-grid{
  display:grid;
  grid-template-columns:repeat(5, minmax(0, 1fr));
  gap:11px;
  max-height:min(478px, 56vh);
  overflow-y:auto;
  padding-right:4px;
  border-radius:12px;
}
.plot-grid:focus{ outline:none; }
.plot-grid:focus-visible{ outline:2px solid rgba(79,156,95,.45); outline-offset:3px; }
@media (max-width:1180px){
  .plot-grid{ grid-template-columns:repeat(4, minmax(0, 1fr)); }
}
@media (max-width:820px){
  .plot-grid{ grid-template-columns:repeat(3, minmax(0, 1fr)); }
}
@media (max-width:560px){
  .plot-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
}

.plot{  position:relative;
  border-radius:15px;
  padding:10px 11px 11px;
  background:linear-gradient(180deg,#fdf8ec 0%, #f7efdd 55%, #efe4cd 100%);
  border:1px solid var(--line);
  box-shadow:0 3px 10px rgba(120,95,60,.08), 0 1px 0 rgba(255,255,255,.8) inset;
  cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s;
  overflow:hidden;
  min-height:150px;
  display:flex; flex-direction:column;
}
.plot::after{ /* 土垄 */
  content:""; position:absolute; left:0; right:0; bottom:0; height:34px;
  background:repeating-linear-gradient(90deg, rgba(160,120,80,.13) 0 9px, rgba(160,120,80,0) 9px 20px);
  opacity:.7; pointer-events:none;
}
.plot:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hover); border-color:var(--line-2); }
.plot:active{ transform:translateY(0) scale(.995); }

.plot.empty{ background:linear-gradient(180deg,#faf4e6,#f1e6d1); }

/* 空地：CSS 画的土堆 */
.plot-art.soil{
  width:66px; height:34px; margin:8px auto 6px;
  border-radius:50% 50% 42% 42% / 62% 62% 38% 38%;
  background:
    radial-gradient(circle at 22% 42%, rgba(255,255,255,.14) 0 2px, transparent 3px),
    radial-gradient(circle at 68% 62%, rgba(0,0,0,.14) 0 2px, transparent 3px),
    radial-gradient(circle at 45% 25%, #b0835b 0%, #96613f 48%, #7a4c31 100%);
  box-shadow:
    inset 0 3px 5px rgba(255,255,255,.22),
    inset 0 -6px 10px rgba(0,0,0,.22),
    0 3px 6px rgba(90,65,35,.22);
  position:relative;
  display:grid; place-items:center;
  transition:transform .2s;
}
.plot-art.soil .seed-dot{
  font-size:13px; font-weight:900; color:rgba(255,255,255,.55);
  text-shadow:0 1px 2px rgba(0,0,0,.25);
  transform:translateY(-1px);
}
.plot:hover .plot-art.soil{ transform:scale(1.06); }

.plot.ripe{
  border-color:rgba(79,156,95,.55);
  box-shadow:0 0 0 2px rgba(79,156,95,.16), 0 8px 22px rgba(79,156,95,.18);
  animation:ripePulse 2.2s ease-in-out infinite;
}
@keyframes ripePulse{
  0%,100%{ box-shadow:0 0 0 2px rgba(79,156,95,.14), 0 6px 18px rgba(79,156,95,.14); }
  50%{ box-shadow:0 0 0 4px rgba(79,156,95,.22), 0 10px 26px rgba(79,156,95,.26); }
}
.plot.waited{ border-color:rgba(240,180,80,.5); }

.plot-top{ display:flex; align-items:center; gap:5px; height:16px; }
.plot-no{
  font-size:10.5px; font-weight:800; color:var(--ink-3);
  background:rgba(255,255,255,.75); border-radius:6px; padding:1px 6px;
  border:1px solid var(--line);
}
.plot-badges{ margin-left:auto; display:flex; gap:3px; font-size:11px; }

.plot-art{
  font-size:41px; line-height:1.1; text-align:center; margin:5px 0 3px;
  filter:drop-shadow(0 3px 4px rgba(90,65,35,.18));
  transition:transform .2s;
}
.plot:hover .plot-art{ transform:scale(1.07) rotate(-2deg); }
.plot.ripe .plot-art{ animation:bob 1.8s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

.plot-name{
  font-size:12px; font-weight:800; text-align:center; color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.plot-name small{ font-weight:600; color:var(--ink-3); font-size:10.5px; }

.bar{
  height:6px; border-radius:99px; margin:7px 0 6px;
  background:rgba(120,95,60,.13); overflow:hidden;
}
.bar i{
  display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg,#8ed29a,#4f9c5f);
  transition:width .4s cubic-bezier(.2,.8,.3,1);
}
.plot.ripe .bar i{ background:linear-gradient(90deg,var(--gold-l),var(--gold)); }

.plot-foot{
  margin-top:auto; font-size:11px; text-align:center; font-weight:700;
  color:var(--ink-2); position:relative; z-index:1;
}
.plot-foot.can{ color:var(--green-d); }
.plot-foot .warn{ color:#b4771f; }

/* 农田底部按钮 */
.farm-foot{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:9px; margin-top:13px;
}
@media (max-width:820px){
  .farm-foot{ grid-template-columns:repeat(2, 1fr); }
}

/* ---------------- 按钮 ---------------- */

.btn{
  position:relative;
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  min-height:40px; padding:7px 13px;
  border-radius:12px; cursor:pointer;
  background:linear-gradient(180deg,#fffdf8,#f8f1e2);
  border:1px solid var(--line-2);
  color:var(--ink); font-size:13px; font-weight:700; letter-spacing:.2px;
  box-shadow:0 2px 0 rgba(160,130,90,.14), 0 4px 10px rgba(120,95,60,.06);
  transition:transform .12s, box-shadow .12s, background .12s, opacity .12s;
}
.btn small{ font-size:10.5px; font-weight:600; color:var(--ink-3); }
.btn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 4px 0 rgba(160,130,90,.14), 0 10px 18px rgba(120,95,60,.12); background:linear-gradient(180deg,#fff,#fdf7ea); }
.btn:active:not(:disabled){ transform:translateY(1px); box-shadow:0 1px 0 rgba(160,130,90,.14); }
.btn:disabled{ opacity:.45; cursor:not-allowed; filter:grayscale(.4); }
.btn.wide{ width:100%; }
.btn.mini{ min-height:26px; padding:3px 9px; font-size:11.5px; border-radius:8px; box-shadow:none; background:#fffdf7; }
.btn.primary{
  background:linear-gradient(180deg,#6cbf7b,#4f9c5f);
  border-color:#3f8350; color:#fff;
  box-shadow:0 3px 0 #3a7748, 0 8px 16px rgba(60,120,70,.22);
  text-shadow:0 1px 1px rgba(0,0,0,.15);
}
.btn.primary small{ color:rgba(255,255,255,.85); }
.btn.primary:hover:not(:disabled){ background:linear-gradient(180deg,#78cb87,#57a768); }
.btn.big{ min-height:48px; font-size:14.5px; border-radius:14px; }
.btn.gold{
  background:linear-gradient(180deg,#f6ce6b,#dfa52e); border-color:#c08c1f; color:#4a3310;
  box-shadow:0 3px 0 #b8871c, 0 8px 16px rgba(200,150,50,.24);
}
.btn.danger{ color:var(--red); border-color:rgba(201,85,74,.35); }

.action-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:9px; }

/* ---------------- 钓鱼 ---------------- */

.fish-meta{ margin-left:auto; font-size:11.5px; color:var(--ink-3); font-weight:600; }

.bait-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.bait{
  display:flex; align-items:center; gap:7px;
  padding:6px 11px; border-radius:11px; cursor:pointer;
  background:#fffdf7; border:1px solid var(--line);
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  transition:.14s;
}
.bait .bn{ color:var(--ink); }
.bait .bc{ font-size:11px; color:var(--ink-3); font-weight:700; }
.bait:hover{ border-color:var(--line-2); transform:translateY(-1px); }
.bait.sel{
  background:linear-gradient(180deg,#eaf7ec,#d7efdb);
  border-color:rgba(79,156,95,.5); color:var(--green-d);
  box-shadow:0 0 0 2px rgba(79,156,95,.12);
}
.bait.off{ opacity:.4; cursor:not-allowed; }

.fish-row{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }

.catch-area{ margin-top:12px; min-height:94px; }
.catch-empty{
  display:grid; place-items:center; min-height:94px;
  border:1.5px dashed var(--line-2); border-radius:14px;
  color:var(--ink-3); font-size:12.5px; font-weight:600;
  background:rgba(255,255,255,.4);
}
.catch-card{
  display:flex; align-items:center; gap:13px;
  padding:11px 14px; border-radius:14px;
  background:linear-gradient(180deg,#fffdf7,#fdf6e6);
  border:1px solid var(--line);
  box-shadow:0 4px 14px rgba(120,95,60,.1);
  animation:popIn .3s cubic-bezier(.2,1.2,.4,1);
}
@keyframes popIn{ from{ transform:scale(.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
.catch-card .ce{ font-size:34px; filter:drop-shadow(0 3px 5px rgba(90,65,35,.2)); }
.catch-card .cname{ font-size:14.5px; font-weight:800; }
.catch-card .cq{ font-size:12px; font-weight:800; margin-top:2px; }
.catch-card .cprice{ margin-left:auto; font-size:19px; font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums; }

/* 最近渔获（单杆 / 连甩都列出来） */
.catch-sum{ font-size:11px; font-weight:700; color:var(--ink-3); margin:0 2px 6px; }
.catch-list{ display:flex; flex-direction:column; gap:5px; }
.catch-item{
  display:flex; align-items:center; gap:9px;
  padding:6px 11px; border-radius:11px;
  background:#fffdf7; border:1px solid var(--line);
  border-left:3px solid var(--line-2);
  font-size:12.5px;
  animation:popIn .22s ease;
}
.catch-item .ce{ font-size:18px; }
.catch-item .cn2{ font-weight:800; }
.catch-item .cq2{ font-size:10.5px; font-weight:800; }
.catch-item .cp2{ margin-left:auto; font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums; }

/* 商店两连 */
.shop-two{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }

/* ---------------- 仓库 ---------------- */

.store-list{ display:flex; flex-direction:column; gap:7px; max-height:330px; overflow-y:auto; padding-right:4px; }
.store-sub{
  margin:4px 0 0; padding-top:8px; font-size:11px; font-weight:800; color:var(--ink-3);
  border-top:1px dashed var(--line-2);
}
.store-row{
  display:flex; align-items:center; gap:9px;
  padding:7px 9px; border-radius:11px;
  background:#fffdf7; border:1px solid var(--line);
}
.store-row .se{ font-size:20px; }
.store-row .sn{ font-size:12.5px; font-weight:800; }
.store-row .sv{ font-size:11px; color:var(--ink-3); font-weight:700; }
.store-row .sp{ margin-left:auto; font-size:12.5px; font-weight:800; color:var(--gold); }
.store-empty{ font-size:12px; color:var(--ink-3); font-weight:600; padding:8px 2px; }

.seed-box{
  margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-2);
  font-size:11.5px; color:var(--ink-2); font-weight:600;
  display:flex; gap:6px; flex-wrap:wrap; align-items:center;
}
.seed-box .tag{
  background:#eef7ec; color:var(--green-d); border:1px solid rgba(79,156,95,.28);
  padding:2px 8px; border-radius:7px; font-weight:800; font-size:11px;
}
.seed-box .tag-sell{
  display:inline-flex; align-items:center; gap:5px;
  font-family:inherit; cursor:pointer;
  transition:transform .12s, background .12s, border-color .12s;
}
.seed-box .tag-sell:hover{
  background:#e0f2dd; border-color:rgba(79,156,95,.52); transform:translateY(-1px);
}
.seed-box .tag-sell b{ font-size:10px; font-weight:800; color:#b4771f; }
.seed-box .btn.mini{ margin-left:auto; }

/* ---------------- 账本 ---------------- */

.ledger{
  max-height:230px; overflow-y:auto;
  display:flex; flex-direction:column; gap:3px;
  font-size:11.5px;
  padding-right:4px;
}
.led-row{ display:flex; align-items:center; gap:6px; padding:3px 2px; border-bottom:1px dotted rgba(122,96,60,.13); }
.led-row.day{ cursor:pointer; border-radius:7px; transition:background .12s; }
.led-row.day:hover{ background:rgba(255,249,232,.95); }
.led-row.day.open{ background:rgba(246,239,221,.95); }
.led-day{ color:var(--ink-3); font-weight:800; min-width:40px; font-size:10.5px; }
.led-label{ flex:1; color:var(--ink-2); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.led-val{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.led-val.up{ color:var(--green-d); }
.led-val.down{ color:var(--red); }
.led-inc{ color:var(--green-d); font-weight:800; }
.led-exp{ color:var(--red); font-weight:800; }
.led-bal{ color:var(--ink-3); font-weight:700; min-width:38px; text-align:right; font-variant-numeric:tabular-nums; }
.led-detail{
  display:flex; flex-direction:column; gap:1px;
  padding:2px 8px 6px 46px; font-size:10.8px; color:var(--ink-3); font-weight:600;
  animation:slideIn .16s ease;
}
.led-detail .dline{ display:flex; justify-content:space-between; gap:10px; padding:1px 0; border-bottom:1px dotted rgba(122,96,60,.1); }
.led-detail .dline b{ font-weight:800; }

/* ---------------- 钓鱼记录 ---------------- */

.book-stats{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:9px; }
.bstat{
  flex:1 1 auto; min-width:96px;
  background:#fffdf7; border:1px solid var(--line); border-radius:11px;
  padding:7px 9px;
}
.bstat .bl{ font-size:10.5px; color:var(--ink-3); font-weight:700; }
.bstat .bv{ font-size:12.5px; font-weight:800; margin-top:2px; }

.book-list{ max-height:190px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; padding-right:4px; }
.book-row{ display:flex; align-items:center; gap:7px; font-size:11.5px; padding:3px 2px; border-bottom:1px dotted rgba(122,96,60,.13); }
.book-row .be{ font-size:14px; }
.book-row .bn2{ font-weight:700; color:var(--ink-2); }
.book-row .bq{ font-size:10.5px; font-weight:800; margin-left:auto; }
.book-row .bp{ font-weight:800; color:var(--gold); min-width:36px; text-align:right; font-variant-numeric:tabular-nums; }

/* ---------------- 日志 ---------------- */

.log{ max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; padding-right:4px; }

/* 按天折叠 */
.log-day{
  display:flex; align-items:center; gap:8px; cursor:pointer;
  padding:6px 9px; border-radius:9px;
  background:rgba(255,255,255,.6);
  border:1px solid var(--line);
  font-size:11.8px;
  transition:background .12s, border-color .12s;
}
.log-day:hover{ background:rgba(255,249,232,.95); border-color:var(--line-2); }

/* ---------------- 弹窗 ---------------- */

.modal-root{ position:fixed; inset:0; z-index:200; display:none; }
.modal-root.on{ display:block; }
.modal-mask{

}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.modal{

  display:flex; flex-direction:column;
  background:#fffdf8; border-radius:20px;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 30px 70px rgba(60,40,15,.3);

.modal-body{ padding:14px 18px 18px; overflow-y:auto; }
.modal-foot{ padding:12px 18px 16px; border-top:1px solid var(--line); display:flex; gap:9px; }

  transition:.14s;
}

.crop-card .ce{ font-size:27px; }
.crop-card .cn{ font-weight:800; font-size:12.5px; margin-top:3px; }
.crop-card .cs{ font-size:10.5px; color:var(--ink-3); font-weight:700; margin-top:2px; }
.crop-card .cm{ font-size:10.5px; color:var(--ink-2); font-weight:600; margin-top:3px; line-height:1.35; }
.crop-card .cp{ font-size:10.5px; font-weight:800; color:var(--green-d); margin-top:3px; }

.kv{ display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12.5px; margin-bottom:12px; }
.kv dt{ color:var(--ink-3); font-weight:700; }
.kv dd{ margin:0; font-weight:700; color:var(--ink); }

.rule-table{ width:100%; border-collapse:collapse; font-size:11.8px; margin:6px 0 14px; }
.rule-table th,.rule-table td{ padding:5px 8px; text-align:left; border-bottom:1px solid var(--line); }

/* ---------------- 种子店 ---------------- */

.shop-head{

}
.shop-head b{ color:var(--gold); font-size:15px; font-variant-numeric:tabular-nums; }

.shop-list{

}
.shop-row{

}
.shop-row:hover{ border-color:rgba(79,156,95,.35); background:#fffef9; }
.shop-row .se{ font-size:21px; flex:none; }
.shop-row .sinfo{ flex:1; min-width:0; }
.shop-row .sn{ font-size:12.5px; font-weight:800; display:flex; align-items:center; gap:6px; }
.shop-row .own{

.shop-row .sv{ font-size:11px; color:var(--ink-3); font-weight:700; margin-top:1px; }
.shop-row .btn.mini{ min-width:42px; flex:none; }
.shop-tip{ margin-top:11px; font-size:11.5px; color:var(--ink-3); font-weight:600; }

/* ---------------- 顶栏的睡觉按钮 ---------------- */

.sleep-btn{
  flex-direction:row; gap:6px; min-height:36px; height:36px;
  padding:0 16px; font-size:13.5px; border-radius:11px;
}

/* ---------------- Toast ---------------- */

.toast-root{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);

  pointer-events:none;
}
.toast{
  padding:9px 18px; border-radius:999px; font-size:13px; font-weight:700;
  background:rgba(48,37,20,.9); color:#fff;
  box-shadow:0 10px 26px rgba(50,35,10,.3);

}
.toast.good{ background:linear-gradient(180deg,#5cb06d,#3f8b4f); }
.toast.warn{ background:linear-gradient(180deg,#e2b04a,#c48e26); color:#3a2800; }
.toast.bad{ background:linear-gradient(180deg,#d76a5e,#b8443a); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(12px) scale(.96); } to{ opacity:1; transform:none; } }
.toast.out{ animation:toastOut .3s ease forwards; }
@keyframes toastOut{ to{ opacity:0; transform:translateY(-8px); } }

/* ---------------- 飘字 ---------------- */

.fx{ position:fixed; inset:0; pointer-events:none; z-index:250; overflow:hidden; }
.float{
  position:absolute; font-size:15px; font-weight:900;
  color:var(--gold); text-shadow:0 2px 6px rgba(0,0,0,.18);
  animation:floatUp 1.05s ease-out forwards;
  white-space:nowrap;
}
.float.green{ color:#2f8c4a; }
.float.red{ color:#c9554a; }
.float.water{ color:#3f7fc4; }
@keyframes floatUp{
  0%{ opacity:0; transform:translate(-50%,6px) scale(.85); }
  22%{ opacity:1; transform:translate(-50%,-6px) scale(1.06); }
  100%{ opacity:0; transform:translate(-50%,-50px) scale(1); }
}

/* ---------------- 滚动条 ---------------- */

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(150,120,85,.28); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover{ background:rgba(150,120,85,.45); background-clip:padding-box; }

/* ---------------- 响应式 ---------------- */

@media (max-width:1180px){
  .layout{ grid-template-columns:minmax(0,1fr) 330px; }
}
@media (max-width:980px){
  .layout{ grid-template-columns:1fr; }
  .hud{ order:3; width:100%; }
  .topbar{ flex-wrap:wrap; }
  .top-actions{ margin-left:auto; }
}
@media (max-width:560px){

  .plot{ min-height:118px; }
  .plot-art{ font-size:30px; }
  .brand-txt h1{ font-size:15px; }
  .chip{ height:30px; font-size:12px; padding:0 10px; }
}

/* ---------- 键盘可达性（可点的 div） ---------- */
.plot:focus-visible,
.bait:focus-visible,
.led-row:focus-visible,
.log-day:focus-visible{

  outline-offset:2px;
  border-radius:10px;
}
.plot{ cursor:pointer; }

/* ---------- 今日委托 ---------- */
.order-list{ display:flex; flex-direction:column; gap:6px; }
.order-row{
  display:flex; align-items:center; gap:9px;

}
.order-row.done{ opacity:.6; background:var(--panel-2); }
.order-row .oe{ font-size:17px; line-height:1; }
.order-row .oi{ flex:1; min-width:0; }
.order-row .on{ font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.order-row .os{ font-size:10.5px; font-weight:600; color:var(--ink-3); margin-top:1px; }

/* ---------- 规则页分区 ---------- */
.rule-sec{ margin-bottom:14px; }
.rule-sec h4{ margin:0 0 6px; font-size:13px; font-weight:800; }
.rule-sec p{ margin:6px 0 0; font-size:11.5px; line-height:1.75; color:var(--ink-2); font-weight:600; }

    worm:  { id: 'worm',  name: '蚯蚓',   emoji: '🪱', desc: '品质取两次较好的 · 好鱼上钩 ×1.3' },
    dough: { id: 'dough', name: '面团饵', emoji: '🍞', desc: '标准收获' },
    lure:  { id: 'lure',  name: '假饵',   emoji: '🎣', desc: '耐用 20 次，容易空军' }
  };

  /* ---------------- 随机 ---------------- */

  let RNG = Math.random;
  function setRng(fn) { RNG = fn || Math.random; }
  function rand() { return RNG(); }
  function randInt(a, b) { return a + Math.floor(rand() * (b - a + 1)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function weighted(list, key) {
    let total = 0;
    for (let i = 0; i < list.length; i++) total += list[i][key] || 0;
    let r = rand() * total;
    for (let i = 0; i < list.length; i++) {
      r -= (list[i][key] || 0);
      if (r <= 0) return list[i];
    }
    return list[list.length - 1];
  }

  /* 季节目前只影响顶栏文案：每 30 天换一季（后续可挂作物限制） */
  const SEASONS = ['春', '夏', '秋', '冬'];
  function seasonOf(day) {
    return SEASONS[Math.floor((Math.max(1, day) - 1) / 30) % 4];
  }

  function rollWeather() { return weighted(WEATHER_LIST, 'w').id; }

  /* 多次取最好：boost = true 滚 2 次（蚯蚓），数字则滚 N 次（施肥） */
  function rollQuality(boost) {
    let n = 1;
    if (boost === true) n = 2;
    else if (typeof boost === 'number') n = Math.max(1, Math.round(boost));
    let best = null, bestIdx = -1;
    for (let i = 0; i < n; i++) {
      const q = weighted(QUALITY, 'w');
      const idx = QUALITY.indexOf(q);
      if (idx > bestIdx) { best = q; bestIdx = idx; }
    }
    return best;
  }

  /* ---------------- 状态 ---------------- */

  const SAVE_VERSION = 1;

  function makePlot() {
    return { crop: null, growth: 0, watered: false, missed: 0, fert: 0,
             ripeDay: null, hits: 0, phase: 'idle' };
  }

  function createState() {
    const s = {
      v: SAVE_VERSION,
      day: 1,
      weather: 'sunny',
      coins: 50,
      energy: 10,
      maxEnergy: 10,
      plots: [makePlot(), makePlot(), makePlot(), makePlot(), makePlot()],
      seeds: {},
      store: {},
      fishBag: [],
      ferts: { normal: 0, special: 0 },
      sprinklers: 0,
      workUsed: false,
      bait: { worm: 0, dough: 0 },
      lure: { owned: false, dur: 0 },
      teaUsed: false,
      ledger: [{ day: 1, label: '开局金币', income: 50, expense: 0, balance: 50 }],
      log: [{ day: 1, text: '🌾 欢迎来到我的小农场，第 1 天开始了。', kind: 'sys' }],
      orders: makeOrders({ day: 1 }),
      fishBook: { count: 0, entries: [], best: null, priciest: null },
      stats: { harvests: 0, casts: 0, dug: 0, planted: 0, orders: 0 }
    };
    return s;
  }

  /* ---------------- 工具 ---------------- */

  function log(s, text, kind) {
    s.log.unshift({ day: s.day, text: text, kind: kind || 'info' });
    if (s.log.length > 400) s.log.length = 400;
  }

  function ledger(s, label, income, expense) {
    const balance = Math.round((s.coins) * 100) / 100;
    s.ledger.unshift({ day: s.day, label: label, income: income || 0, expense: expense || 0, balance: balance });
    if (s.ledger.length > 200) s.ledger.length = 200;
  }

  function addCoins(s, amount, label) {
    s.coins += amount;
    if (amount >= 0) ledger(s, label, amount, 0);
    else ledger(s, label, 0, -amount);
  }

  /* 零工单价：体力 1 点 = 2 金（全天）/ 1.2 金（半天） */
  const WORK_RATE_FULL = 2.0;
  const WORK_RATE_HALF = 1.2;

  function mealFee(s) { return Math.max(1, 3 + (s.maxEnergy - 10) / 5); }

  function expandCost(s) { return Math.max(25, 25 + 15 * (s.plots.length - 4)); }
  /* 强化体力：成本超线性增长（每级 ×1.2），避免「无脑升级」把上限堆到几百 */
  function upgradeCost(s) {
    const tier = Math.max(0, (s.maxEnergy - 10) / 5);
    return Math.round(30 * Math.pow(1.2, tier));
  }
  function workCost(s, mode) { return Math.round(mode === 'half' ? s.maxEnergy / 2 : s.maxEnergy); }
  function workPay(s, mode) {
    const c = workCost(s, mode);
    return Math.round(c * (mode === 'half' ? WORK_RATE_HALF : WORK_RATE_FULL));
  }

  function needOf(p) {
    const c = CROPS[p.crop];
    if (!c) return 0;
    return p.phase === 'regrow' ? c.regrowDays : c.days;
  }

  function fertBonus(p) {
    const c = CROPS[p.crop];
    if (!c || c.big) return 0;
    return p.fert || 0;
  }

  function expectedYield(s, p) {
    const c = CROPS[p.crop];
    if (!c) return 0;
    if (c.multi) return p.hits === 0 ? c.firstQty : c.regrowQty;
    if (c.big) return 1;
    return Math.max(1, c.base + fertBonus(p) - p.missed);
  }

  function canHarvest(s, p) {
    return p.phase === 'ripe' && s.day > p.ripeDay;
  }

  function stageEmoji(p) {
    const c = CROPS[p.crop];
    if (!c) return '🟫';
    if (p.phase === 'ripe') return c.emoji;
    const need = needOf(p) || 1;
    const r = p.growth / need;
    if (r <= 0) return '🌱';
    if (r < 0.5) return '🌿';
    return '🌾';
  }

  /* ---------------- 操作 ---------------- */

  function grow(p, s) {
    const need = needOf(p);
    if (p.growth < need) p.growth++;
    if (p.growth >= need) {
      p.phase = 'ripe';
      p.ripeDay = s.day;
      return true;
    }
    return false;
  }

  function plant(s, idx, cropId) {
    const p = s.plots[idx];
    const c = CROPS[cropId];
    if (!p) return { ok: false, msg: '没有这块地' };
    if (!c) return { ok: false, msg: '没有这种作物' };
    if (p.crop) return { ok: false, msg: '这块地不是空地' };
    if (s.energy < 1) return { ok: false, msg: '体力不够了，先睡觉吧' };

    // 种子只能从种子店买，播种时只消耗背包里的种子
    const owned = s.seeds[cropId] || 0;
    if (owned <= 0) return { ok: false, msg: '没有 ' + c.name + ' 种子了，先去种子店买' };
    s.seeds[cropId] = owned - 1;
    if (s.seeds[cropId] === 0) delete s.seeds[cropId];

    s.energy -= 1;
    p.crop = cropId;
    p.growth = 0;
    p.watered = false;
    p.missed = 0;
    p.fert = 0;
    p.ripeDay = null;
    p.hits = 0;
    p.phase = 'growing';
    s.stats.planted++;
    log(s, '🌱 ' + (idx + 1) + ' 号地种下 ' + c.name, 'good');
    return { ok: true, msg: c.name + ' 种下了' };
  }

  function water(s, idx) {
    const p = s.plots[idx];
    if (!p || !p.crop) return { ok: false, msg: '这块地还没种东西' };
    if (p.phase === 'ripe') return { ok: false, msg: '已经成熟，快点收获吧' };
    if (p.watered) return { ok: false, msg: '今天已经浇过水了' };
    if (s.energy < 1) return { ok: false, msg: '体力不够了，先睡觉吧' };
    s.energy -= 1;
    p.watered = true;
    const ripe = grow(p, s);
    log(s, '💧 ' + (idx + 1) + ' 号地浇水 ' + CROPS[p.crop].name +
            (ripe ? ' → 成熟！明天可收' : '（' + p.growth + '/' + needOf(p) + '）'),
        ripe ? 'good' : 'info');
    return { ok: true, msg: ripe ? '成熟了！' : '浇水 +1 天', ripe: ripe };
  }

  function waterAll(s) {
    let done = 0, ripened = 0, lack = 0;
    s.plots.forEach(function (p, i) {
      if (!p.crop || p.phase === 'ripe' || p.watered) return;
      const r = water(s, i);
      if (r.ok) { done++; if (r.ripe) ripened++; } else lack++;
    });
    if (!done) return { ok: false, msg: '没有需要浇水的地块' };
    return { ok: true, msg: '浇了 ' + done + ' 块地' + (ripened ? '，' + ripened + ' 块成熟' : ''), done: done };
  }

  function harvest(s, idx) {
    const p = s.plots[idx];
    if (!p || !p.crop) return { ok: false, msg: '这块地还没种东西' };
    if (p.phase !== 'ripe') return { ok: false, msg: '还没成熟（' + p.growth + '/' + needOf(p) + ' 天）' };
    if (s.day <= p.ripeDay) return { ok: false, msg: '刚浇成熟，明天才能收获' };
    if (s.energy < 1) return { ok: false, msg: '体力不够了，先睡觉吧' };

    const c = CROPS[p.crop];
    s.energy -= 1;

    let qty;
    if (c.multi) qty = p.hits === 0 ? c.firstQty : c.regrowQty;
    else qty = c.big ? 1 : clamp(c.base + randInt(-1, 1) - p.missed + fertBonus(p), 1, 99);

    // 作物也有品质：施肥会多滚几次取最好的（普通肥 2 次、特效肥 3 次）
    const q = rollQuality(1 + p.fert);
    const unit = unitValue(p.crop, q.id);
    addStore(s, p.crop, q.id, qty);

    // 多次收获作物：只有最后一次收获才判定留种
    const willRegrow = !!c.multi && p.hits + 1 < 1 + c.regrowTimes;
    let extraSeed = false;
    if (!willRegrow && rand() < 0.3) {
      s.seeds[p.crop] = (s.seeds[p.crop] || 0) + 1;
      extraSeed = true;
    }
    s.stats.harvests++;

    let regrown = false;
    if (willRegrow) {
      p.hits++;
      p.growth = 0;
      p.phase = 'regrow';
      p.watered = false;
      p.ripeDay = null;
      p.fert = 0;
      p.missed = 0;          // 再生期重新计数，不然会一直挂着「缺水 ×N」
      regrown = true;
    } else {
      s.plots[idx] = makePlot();
    }

    const msg = '收获 ' + c.name + ' ×' + qty + ' · ' + q.emoji + q.name + '（值 ' + qty * unit + ' 金）' +
                (extraSeed ? ' · 留种 +1' : '') +
                (regrown ? ' · 进入再生期' : '');
    log(s, '🧺 ' + msg, 'good');
    return { ok: true, msg: msg, qty: qty, crop: p.crop || c.id, unit: unit, quality: q, seed: extraSeed, regrown: regrown };
  }

  function harvestAll(s) {
    let total = 0, plots = 0, last = null;
    s.plots.forEach(function (p, i) {
      if (!p.crop || p.phase !== 'ripe') return;
      const r = harvest(s, i);
      if (r.ok) { total += r.qty; plots++; last = r; }
    });
    if (!plots) return { ok: false, msg: '没有可收获的作物' };
    return { ok: true, msg: '收了 ' + plots + ' 块地，共 ' + total + ' 个' };
  }

  function sellAll(s) {
    const ids = Object.keys(s.store).filter(function (k) { return storeCount(s, k) > 0; });
    const fishTotal = (s.fishBag || []).reduce(function (n, e) { return n + e.v; }, 0);
    const fishCount = (s.fishBag || []).length;
    if (!ids.length && !fishCount) return { ok: false, msg: '仓库里没东西可卖' };

    let income = 0;
    const parts = [];
    ids.forEach(function (id) {
      const n = storeCount(s, id);
      const gain = storeValue(s, id);
      income += gain;
      parts.push(CROPS[id].name + '×' + n + ' = ' + gain + ' 金');
      delete s.store[id];
    });
    if (fishCount) {
      income += fishTotal;
      parts.push('渔获×' + fishCount + ' = ' + fishTotal + ' 金');
      s.fishBag = [];
    }
    addCoins(s, income, '卖仓库');
    log(s, '💰 卖出 ' + parts.join('、') + '，收入 ' + income + ' 金', 'good');
    return { ok: true, msg: '卖出全部，+' + income + ' 金', income: income };
  }

  /* 铲除：直接清掉这块地，不返还种子/金币 */
  function clearPlot(s, idx) {
    const p = s.plots[idx];
    if (!p || !p.crop) return { ok: false, msg: '这块地本来就是空的' };
    const name = CROPS[p.crop].name;
    s.plots[idx] = makePlot();
    log(s, '🗑️ ' + (idx + 1) + ' 号地铲除了 ' + name, 'warn');
    return { ok: true, msg: '铲除了 ' + name };
  }

  function sellOne(s, id) {
    const n = storeCount(s, id);
    if (!n) return { ok: false, msg: '没有可卖的' };
    const gain = storeValue(s, id);
    delete s.store[id];
    addCoins(s, gain, '卖 ' + CROPS[id].name);
    log(s, '💰 卖出 ' + CROPS[id].name + '×' + n + '，+' + gain + ' 金', 'good');
    return { ok: true, msg: '+' + gain + ' 金', income: gain };
  }

  /* 施肥 = 消耗仓库里的肥料（肥料在种子店买，半价卖回） */
  function useFert(s, idx, kind) {
    const p = s.plots[idx];
    const f = FERT[kind];
    if (!p || !p.crop) return { ok: false, msg: '这块地还没种东西' };
    if (!f) return { ok: false, msg: '没有这种肥料' };
    if (CROPS[p.crop].big) return { ok: false, msg: '南瓜、西瓜不吃肥料' };
    if (p.fert) return { ok: false, msg: '这块地已经施过肥了' };
    if (p.phase === 'ripe') return { ok: false, msg: '都熟了，别浪费肥料' };
    if ((s.ferts[kind] || 0) < 1) return { ok: false, msg: '肥料用完了，去种子店买' };
    if (s.energy < 1) return { ok: false, msg: '体力不够了' };
    s.ferts[kind]--;
    s.energy -= 1;
    p.fert = f.add;
    log(s, '🧪 ' + (idx + 1) + ' 号地施了' + f.name + '（产量 +' + f.add + '、品质取更优）', 'good');
    return { ok: true, msg: f.name + ' 施用成功' };
  }

  function fertSellPrice(kind) {
    const f = FERT[kind];
    return f ? Math.max(1, Math.floor(f.cost * FERT_SELL_RATE)) : 0;
  }

  function buyFertItem(s, kind, n) {
    const f = FERT[kind];
    if (!f) return { ok: false, msg: '没有这种肥料' };
    const qty = Math.max(1, Math.floor(n || 1));
    const cost = f.cost * qty;
    if (s.coins < cost) return { ok: false, msg: '金币不够（需要 ' + cost + ' 金）' };
    s.coins -= cost;
    ledger(s, '买肥料 ' + f.name + '×' + qty, 0, cost);
    s.ferts[kind] = (s.ferts[kind] || 0) + qty;
    log(s, '🧪 买了' + f.name + ' ×' + qty + '（-' + cost + ' 金）', 'info');
    return { ok: true, qty: qty, cost: cost, msg: '买到 ' + f.name + ' ×' + qty };
  }

  function sellFert(s, kind, n) {
    const f = FERT[kind];
    if (!f) return { ok: false, msg: '没有这种肥料' };
    const have = s.ferts[kind] || 0;
    if (!have) return { ok: false, msg: '没有' + f.name };
    const qty = n ? Math.min(n, have) : have;
    const gain = qty * fertSellPrice(kind);
    s.ferts[kind] = have - qty;
    addCoins(s, gain, '卖肥料 ' + f.name);
    log(s, '💰 卖出' + f.name + ' ×' + qty + '，+' + gain + ' 金', 'good');
    return { ok: true, qty: qty, income: gain, msg: '卖出 ' + f.name + ' ×' + qty + '，+' + gain + ' 金' };
  }

  /* 洒水器：每个每天自动浇 1 块地 */
  function buySprinkler(s) {
    if (s.coins < SPRINKLER_COST) return { ok: false, msg: '金币不够（' + SPRINKLER_COST + ' 金）' };
    if (s.sprinklers >= s.plots.length) return { ok: false, msg: '每块地一个就够了（现有 ' + s.plots.length + ' 块地）' };
    s.coins -= SPRINKLER_COST;
    ledger(s, '买洒水器', 0, SPRINKLER_COST);
    s.sprinklers++;
    log(s, '🚿 买了第 ' + s.sprinklers + ' 个洒水器（每天自动浇 1 块地）', 'good');
    return { ok: true, msg: '洒水器 ×' + s.sprinklers, sprinklers: s.sprinklers };
  }

  /* 这块地能不能施肥（大作物、已施肥、已成熟都不行） */
  function canFert(s, idx) {
    const p = s.plots[idx];
    if (!p || !p.crop) return false;
    if (CROPS[p.crop].big) return false;
    if (p.fert) return false;
    if (p.phase === 'ripe') return false;
    return true;
  }

  function fertTargets(s) {
    const list = [];
    s.plots.forEach(function (p, i) { if (canFert(s, i)) list.push(i); });
    return list;
  }

  /* 全部施肥：给所有可施肥的地块灌同一种肥，钱/体力不够就停 */
  function fertilizeAll(s, kind) {
    const f = FERT[kind];
    if (!f) return { ok: false, msg: '没有这种肥料' };
    const targets = fertTargets(s);
    if (!targets.length) return { ok: false, msg: '没有可施肥的地块（大作物、已施肥、已成熟都不行）' };

    let n = 0, stop = null;
    for (let k = 0; k < targets.length; k++) {
      if (s.energy < 1) { stop = '体力不够了'; break; }
      if ((s.ferts[kind] || 0) < 1) { stop = '肥料不够了'; break; }
      const p = s.plots[targets[k]];
      s.ferts[kind]--;
      s.energy -= 1;
      p.fert = f.add;
      n++;
    }
    if (!n) return { ok: false, msg: stop || '施肥失败' };

    log(s, '🧪 ' + f.name + ' × ' + n + ' 块地（每块 +' + f.add + ' 产量、品质更优）' +
            (stop ? '，' + stop : ''), 'good');
    return {
      ok: true, n: n, stop: stop,
      msg: '施了 ' + n + ' 块地' + (stop ? '（' + stop + '）' : '')
    };
  }

  function sleep(s) {
    const fee = mealFee(s);
    const notes = [];
    if (s.coins >= fee) {
      addCoins(s, -fee, '伙食费');
      notes.push('🍖 伙食费 -' + fee + ' 金');
      s.energy = s.maxEnergy;
    } else {
      // 没饭吃只回 5 点，但别把本来更高的体力扣掉
      s.energy = Math.max(s.energy, Math.min(5, s.maxEnergy));
      notes.push('😵 没钱吃饭，饿着睡了（只恢复 5 体力）');
    }

    s.plots.forEach(function (p) {
      if (p.crop && (p.phase === 'growing' || p.phase === 'regrow') && !p.watered) p.missed++;
    });
    s.plots.forEach(function (p) { p.watered = false; });

    s.day++;
    s.teaUsed = false;
    s.workUsed = false;
    s.weather = rollWeather();
    const w = WEATHER[s.weather];
    notes.push(w.emoji + ' 第 ' + s.day + ' 天 · ' + w.name);

    if (w.autoWater) {
      let n = 0, ripe = 0;
      s.plots.forEach(function (p) {
        if (!p.crop || p.phase === 'ripe') return;
        if (!p.watered) { if (grow(p, s)) ripe++; p.watered = true; n++; }
      });
      if (n) notes.push('🌧️ 自动浇水 ' + n + ' 块地' + (ripe ? '，' + ripe + ' 块成熟' : ''));
    } else if (s.sprinklers > 0) {
      // 洒水器：每天自动浇前 N 块没浇的地，不耗体力
      let n = 0, ripe = 0;
      s.plots.forEach(function (p) {
        if (n >= s.sprinklers) return;
        if (!p.crop || p.phase === 'ripe' || p.watered) return;
        if (grow(p, s)) ripe++;
        p.watered = true;
        n++;
      });
      if (n) notes.push('🚿 洒水器浇了 ' + n + ' 块地' + (ripe ? '，' + ripe + ' 块成熟' : ''));
    }

    log(s, '🌙 睡觉 → 第 ' + s.day + ' 天 · ' + w.name, 'sys');
    s.orders = makeOrders(s);
    notes.push('📋 今日委托已刷新：' + s.orders.length + ' 单');
    return { ok: true, msg: '新的一天', day: s.day, notes: notes, weather: s.weather };
  }

  function pickBait(s, prefer) {
    if (prefer === 'worm' && s.bait.worm > 0) return 'worm';
    if (prefer === 'dough' && s.bait.dough > 0) return 'dough';
    if (prefer === 'lure' && s.lure.owned && s.lure.dur > 0) return 'lure';
    if (s.bait.worm > 0) return 'worm';
    if (s.bait.dough > 0) return 'dough';
    if (s.lure.owned && s.lure.dur > 0) return 'lure';
    return null;
  }

  function baitCount(s, kind) {
    if (kind === 'worm') return s.bait.worm;
    if (kind === 'dough') return s.bait.dough;
    if (kind === 'lure') return s.lure.owned ? s.lure.dur : 0;
    return 0;
  }

  function fish(s, preferBait) {
    const w = WEATHER[s.weather];
    if (s.energy < 2) return { ok: false, msg: '体力不够（钓鱼要 2 点）' };
    const kind = pickBait(s, preferBait);
    if (!kind) return { ok: false, msg: '没有饵料了，先去挖蚯蚓或买面团饵' };

    s.energy -= 2;
    if (kind === 'worm') {
      s.bait.worm--;
    } else if (kind === 'dough') {
      s.bait.dough--;
    } else {
      s.lure.dur--;
      if (s.lure.dur <= 0) { s.lure.owned = false; s.lure.dur = 0; }
    }

    // 天气与蚯蚓都只影响「上钩概率」，不影响售价
    const bite = (w.biteMul || 1) * (kind === 'worm' ? 1.3 : 1);
    const trashMul = w.trashMul || 1;
    const table = FISH.map(function (f) {
      let mul = f.trash ? trashMul : bite;
      if (kind === 'lure') mul *= (f.trash ? 5 : 0.7);
      return Object.assign({}, f, { w: f.w * mul });
    });
    const f = weighted(table, 'w');
    const q = f.trash ? null : rollQuality(kind === 'worm');
    const value = f.trash ? 1 : Math.max(1, Math.round(f.base * q.mul));

    let name = f.name, emoji = f.emoji;
    if (f.trash) {
      const junk = TRASH[Math.floor(rand() * TRASH.length)] || TRASH[0];
      name = junk.name;
      emoji = junk.emoji;
    }

    s.stats.casts++;

    // 渔获进仓库，卖掉才换钱
    s.fishBag = s.fishBag || [];
    const noOrder = !!f.noOrder || !!f.trash;      // 杂物、宝箱不算委托
    s.fishBag.push({ name: name, emoji: emoji, q: q ? q.id : null, v: value, d: s.day, no: noOrder || undefined });

    const entry = { day: s.day, fish: name, emoji: emoji, quality: q, price: value,
                    base: f.base, bait: kind, trash: !!f.trash, noOrder: noOrder };
    s.fishBook.count++;
    s.fishBook.entries.unshift(entry);
    if (s.fishBook.entries.length > 40) s.fishBook.entries.length = 40;
    if (!f.trash) {
      if (!s.fishBook.best || QUALITY.indexOf(q) > QUALITY.indexOf(s.fishBook.best.quality)) {
        s.fishBook.best = { fish: f.name, quality: q, price: value, day: s.day };
      }
      if (!s.fishBook.priciest || value > s.fishBook.priciest.price) {
        s.fishBook.priciest = { fish: f.name, quality: q, price: value, day: s.day };
      }
    }
    log(s, f.trash
      ? '🎣 钓上来 ' + emoji + ' ' + name + '（不值钱，已入仓库）'
      : '🎣 钓到 ' + emoji + ' ' + name + ' · ' + q.emoji + q.name + ' · 值 ' + value + ' 金（已入仓库）',
      f.trash ? 'warn' : 'good');
    return { ok: true, entry: entry, msg: name + ' 值 ' + value + ' 金' };
  }

  function fishMany(s, times, preferBait) {
    const results = [];
    let value = 0;
    for (let i = 0; i < times; i++) {
      const r = fish(s, preferBait);
      if (!r.ok) { results.push(r); break; }
      value += r.entry.price;
      results.push(r);
    }
    const okCount = results.filter(function (r) { return r.ok; }).length;
    if (!okCount) return results[0] || { ok: false, msg: '钓不了' };
    return { ok: true, count: okCount, income: value, results: results,
             msg: '甩了 ' + okCount + ' 杆，渔获值 ' + value + ' 金' };
  }

  /* ---------------- 卖鱼 ---------------- */

  function fishKey(e) { return e.name + '|' + (e.q || '-') + '|' + e.v; }

  function fishGroups(s) {
    const map = new Map();
    (s.fishBag || []).forEach(function (e) {
      const key = fishKey(e);
      let g = map.get(key);
      if (!g) {
        g = { key: key, name: e.name, emoji: e.emoji, q: e.q, v: e.v, count: 0 };
        map.set(key, g);
      }
      g.count++;
    });
    return Array.from(map.values()).sort(function (a, b) { return b.v * b.count - a.v * a.count; });
  }

  const qualityById = function (id) {
    if (!id) return null;
    for (let i = 0; i < QUALITY.length; i++) if (QUALITY[i].id === id) return QUALITY[i];
    return null;
  };

  /* ---------------- 仓库：作物按品质分桶 ---------------- */

  function emptyBuckets() {
    const b = {};
    Q_IDS.forEach(function (id) { b[id] = 0; });
    return b;
  }

  function addStore(s, id, qid, n) {
    if (!CROPS[id] || !n) return;
    const b = s.store[id] || (s.store[id] = emptyBuckets());
    b[qid] = (b[qid] || 0) + n;
  }

  function storeCount(s, id) {
    const b = s.store[id];
    if (!b) return 0;
    let n = 0;
    Q_IDS.forEach(function (q) { n += b[q] || 0; });
    return n;
  }

  /* 单个作物按品质算钱：单价 = 基础价 × 品质倍率（最低 1 金） */
  function unitValue(id, qid) {
    const c = CROPS[id];
    const q = qualityById(qid);
    if (!c || !q) return 0;
    return Math.max(1, Math.round(c.price * q.mul));
  }

  function storeValue(s, id) {
    const b = s.store[id];
    if (!b) return 0;
    let v = 0;
    Q_IDS.forEach(function (q) { if (b[q]) v += b[q] * unitValue(id, q); });
    return v;
  }

  /* 品质构成（好的在前），给界面显示用 */
  function storeMix(s, id) {
    const b = s.store[id];
    if (!b) return [];
    const out = [];
    QUALITY.slice().reverse().forEach(function (q) {
      if (b[q.id]) out.push({ id: q.id, name: q.name, emoji: q.emoji, color: q.color, n: b[q.id] });
    });
    return out;
  }

  /* 交委托时按品质从低到高扣，好东西留给玩家 */
  function takeStore(s, id, n) {
    const b = s.store[id];
    if (!b) return 0;
    let left = n;
    for (let i = 0; i < QUALITY.length && left > 0; i++) {
      const q = QUALITY[i].id;
      const take = Math.min(left, b[q] || 0);
      if (take) { b[q] -= take; left -= take; }
    }
    if (storeCount(s, id) <= 0) delete s.store[id];
    return n - left;
  }

  function sellFishGroup(s, key) {
    const g = fishGroups(s).filter(function (x) { return x.key === key; })[0];
    if (!g) return { ok: false, msg: '仓库里没有这种鱼' };
    const gain = g.v * g.count;
    s.fishBag = s.fishBag.filter(function (e) { return fishKey(e) !== key; });
    addCoins(s, gain, '卖鱼 ' + g.name);
    log(s, '💰 卖出 ' + g.emoji + ' ' + g.name + ' ×' + g.count + '，+' + gain + ' 金', 'good');
    return { ok: true, msg: '卖出 ' + g.name + '×' + g.count + '，+' + gain + ' 金', income: gain };
  }

  function sellAllFish(s) {
    const bag = s.fishBag || [];
    if (!bag.length) return { ok: false, msg: '仓库里没有鱼' };
    const gain = bag.reduce(function (n, e) { return n + e.v; }, 0);
    const n = bag.length;
    s.fishBag = [];
    addCoins(s, gain, '卖鱼');
    log(s, '💰 卖出全部渔获 ' + n + ' 条，+' + gain + ' 金', 'good');
    return { ok: true, msg: '卖出 ' + n + ' 条鱼，+' + gain + ' 金', income: gain };
  }

  /* 蚯蚓也能卖：3 金/条（只在渔具店卖） */
  const WORM_VALUE = 3;

  function sellWorms(s, n) {
    const have = s.bait.worm || 0;
    if (!have) return { ok: false, msg: '没有蚯蚓可卖' };
    const qty = n ? Math.min(n, have) : have;
    const gain = qty * WORM_VALUE;
    s.bait.worm = have - qty;
    addCoins(s, gain, '卖蚯蚓');
    log(s, '💰 卖出蚯蚓 ×' + qty + '，+' + gain + ' 金', 'good');
    return { ok: true, qty: qty, income: gain, msg: '卖出蚯蚓 ×' + qty + '，+' + gain + ' 金' };
  }

  function digWorms(s) {
    if (s.energy < 3) return { ok: false, msg: '体力不够（挖蚯蚓要 3 点）' };
    const w = WEATHER[s.weather];
    const n = clamp(randInt(1, 3) + w.wormMod, 1, 5);
    s.energy -= 3;
    s.bait.worm += n;
    s.stats.dug++;
    log(s, '🪱 挖到蚯蚓 ×' + n + '（现有 ' + s.bait.worm + '）', 'good');
    return { ok: true, msg: '挖到蚯蚓 ×' + n, n: n };
  }

  function buyBait(s, kind, n) {
    n = n || 1;
    if (kind === 'dough') {
      const cost = 1 * n;
      if (s.coins < cost) return { ok: false, msg: '金币不够' };
      s.coins -= cost; ledger(s, '买面团饵 ×' + n, 0, cost);
      s.bait.dough += n;
      log(s, '🍞 买了面团饵 ×' + n + '（-' + cost + ' 金）', 'info');
      return { ok: true, msg: '面团饵 ×' + n };
    }
    if (kind === 'lure') {
      if (s.lure.owned) return { ok: false, msg: '假饵一次只能持 1 个' };
      if (s.coins < 5) return { ok: false, msg: '金币不够（5 金）' };
      s.coins -= 5; ledger(s, '买假饵', 0, 5);
      s.lure.owned = true; s.lure.dur = 20;
      log(s, '🎣 买了一个假饵（耐用 20 次）', 'info');
      return { ok: true, msg: '假饵到手' };
    }
    return { ok: false, msg: '这种饵料买不到' };
  }

  function tea(s) {
    if (s.teaUsed) return { ok: false, msg: '今天下午茶已经喝过了' };
    if (s.coins < 3) return { ok: false, msg: '金币不够（3 金）' };
    if (s.energy >= s.maxEnergy) return { ok: false, msg: '体力是满的，别浪费' };
    s.coins -= 3; ledger(s, '下午茶', 0, 3);
    s.teaUsed = true;
    s.energy = Math.min(s.maxEnergy, s.energy + 5);
    log(s, '🍵 喝了下午茶，体力 +5（' + s.energy + '/' + s.maxEnergy + '）', 'good');
    return { ok: true, msg: '体力 +5' };
  }

  /* 打零工：每天只能打一次；体力够就干全天（×2.0），否则半天（×1.2，体力不足就用光） */
  function workAuto(s) {
    const full = workCost(s, 'full');
    return work(s, s.energy >= full ? 'full' : 'half');
  }

  function work(s, mode) {
    if (s.workUsed) return { ok: false, msg: '今天已经打过零工了，明天再来' };
    const cost = workCost(s, mode);

    // 半天零工体力不足时：把剩下的体力全用上，收益仍按 ×1.2 结算
    if (mode === 'half' && s.energy < cost) {
      const spent = s.energy;
      if (spent <= 0) return { ok: false, msg: '体力已经见底了，先睡觉吧' };
      const pay = Math.round(spent * WORK_RATE_HALF);
      s.energy = 0;
      s.workUsed = true;
      addCoins(s, pay, '半天零工');
      log(s, '🕐 半天零工（体力不足，全用上）：-' + spent + ' 体力，+' + pay + ' 金', 'good');
      return { ok: true, msg: '+' + pay + ' 金（用掉全部 ' + spent + ' 体力）', pay: pay, spent: spent, partial: true };
    }

    if (s.energy < cost) return { ok: false, msg: '体力不足（需要 ' + cost + ' 点）' };
    const pay = workPay(s, mode);
    s.energy -= cost;
    s.workUsed = true;
    addCoins(s, pay, mode === 'half' ? '半天零工' : '全天零工');
    log(s, (mode === 'half' ? '🕐' : '🕑') + (mode === 'half' ? '半天' : '全天') +
            '零工：-' + cost + ' 体力，+' + pay + ' 金', 'good');
    return { ok: true, msg: '+' + pay + ' 金', pay: pay, spent: cost };
  }

  /* ---------------- 种子店 ---------------- */

  const SEED_SELL_RATE = 0.5;          // 回收价 = 售价的一半

  function seedBuyPrice(c) { return c.seed; }
  function seedSellPrice(c) { return Math.max(1, Math.floor(c.seed * SEED_SELL_RATE)); }

  function buySeed(s, id, n) {
    const c = CROPS[id];
    if (!c) return { ok: false, msg: '没有这种种子' };
    const qty = Math.max(1, Math.floor(n || 1));
    const cost = seedBuyPrice(c) * qty;
    if (s.coins < cost) return { ok: false, msg: '金币不够（需要 ' + cost + ' 金）' };
    s.coins -= cost;
    ledger(s, '买种子 ' + c.name + '×' + qty, 0, cost);
    s.seeds[id] = (s.seeds[id] || 0) + qty;
    log(s, '🌰 买了 ' + c.name + '种子 ×' + qty + '（-' + cost + ' 金）', 'info');
    return { ok: true, msg: '买到 ' + c.name + ' 种子 ×' + qty, qty: qty, cost: cost };
  }

  function sellSeed(s, id, n) {
    const c = CROPS[id];
    if (!c) return { ok: false, msg: '没有这种种子' };
    const have = s.seeds[id] || 0;
    if (!have) return { ok: false, msg: '没有 ' + c.name + ' 种子' };
    const qty = n ? Math.min(n, have) : have;
    const gain = qty * seedSellPrice(c);
    const left = have - qty;
    if (left > 0) s.seeds[id] = left; else delete s.seeds[id];
    addCoins(s, gain, '卖种子 ' + c.name);
    log(s, '💰 卖出 ' + c.name + '种子 ×' + qty + '，+' + gain + ' 金', 'good');
    return { ok: true, msg: '卖出 ' + qty + ' 颗种子，+' + gain + ' 金', qty: qty, income: gain };
  }

  function sellAllSeeds(s) {
    const ids = Object.keys(s.seeds).filter(function (k) { return s.seeds[k] > 0; });
    if (!ids.length) return { ok: false, msg: '没有种子可卖' };
    let total = 0;
    ids.forEach(function (id) { total += (s.seeds[id] || 0) * seedSellPrice(CROPS[id]); });
    s.seeds = {};
    addCoins(s, total, '卖种子');
    log(s, '💰 清空种子，+' + total + ' 金', 'good');
    return { ok: true, msg: '卖出全部种子，+' + total + ' 金', income: total };
  }

  /* 全部播种：把所有空地都种上同一种作物 */
  function plantAll(s, cropId) {
    const c = CROPS[cropId];
    if (!c) return { ok: false, msg: '没有这种作物' };
    const targets = [];
    s.plots.forEach(function (p, i) { if (!p.crop) targets.push(i); });
    if (!targets.length) return { ok: false, msg: '没有空地了' };
    if ((s.seeds[cropId] || 0) <= 0) return { ok: false, msg: '没有 ' + c.name + ' 种子了' };

    let n = 0, stop = null;
    for (let k = 0; k < targets.length; k++) {
      const r = plant(s, targets[k], cropId);
      if (!r.ok) { stop = r.msg; break; }
      n++;
    }
    if (!n) return { ok: false, msg: stop || '播种失败' };
    return {
      ok: true, planted: n, stop: stop,
      msg: '种下 ' + c.name + ' ×' + n + (stop ? '（' + stop + '）' : '')
    };
  }

  function expand(s) {
    const cost = expandCost(s);
    if (s.coins < cost) return { ok: false, msg: '金币不够（' + cost + ' 金）' };
    s.coins -= cost; ledger(s, '开垦第 ' + (s.plots.length + 1) + ' 块地', 0, cost);
    s.plots.push(makePlot());
    log(s, '🏞️ 开垦了第 ' + s.plots.length + ' 块地（-' + cost + ' 金）', 'good');
    return { ok: true, msg: '现在有 ' + s.plots.length + ' 块地', plots: s.plots.length };
  }

  function upgrade(s) {
    const cost = upgradeCost(s);
    if (s.coins < cost) return { ok: false, msg: '金币不够（' + cost + ' 金）' };
    s.coins -= cost; ledger(s, '体力上限强化', 0, cost);
    s.maxEnergy += 5;
    log(s, '💪 体力上限 → ' + s.maxEnergy + '（伙食费 ' + mealFee(s) + ' 金/天）', 'good');
    return { ok: true, msg: '体力上限 ' + s.maxEnergy, maxEnergy: s.maxEnergy };
  }

  /* ---------------- 每日委托 ---------------- */

  /* 委托池随天数解锁：头几天只出便宜作物，后期才要贵货 */
  function orderPool(day) {
    const sorted = CROP_LIST.slice().sort(function (a, b) { return a.seed - b.seed; });
    const n = day <= 4 ? 4 : (day <= 9 ? 7 : sorted.length);
    return sorted.slice(0, n);
  }

  function makeOrders(s) {
    const day = (s && s.day) || 1;
    const pool = orderPool(day);
    const used = [];
    const orders = [];

    for (let i = 0; i < 2 && pool.length; i++) {
      let c = null;
      for (let t = 0; t < 12; t++) {
        const cand = pool[Math.floor(rand() * pool.length)];
        if (used.indexOf(cand.id) < 0) { c = cand; break; }
      }
      if (!c) c = pool[i % pool.length];
      used.push(c.id);
      const qty = c.price >= 20 ? randInt(1, 2) : randInt(3, 6);
      const reward = Math.max(6, Math.round(qty * c.price * 1.25) + 3);
      orders.push({
        id: 'd' + day + '-c' + i, kind: 'crop', crop: c.id, name: c.name, emoji: c.emoji,
        qty: qty, reward: reward, done: false
      });
    }

    const fq = randInt(2, 3);
    orders.push({
      id: 'd' + day + '-f', kind: 'fish', crop: null, name: '任意鱼', emoji: '🐟',
      qty: fq, reward: Math.max(12, fq * 10 + 4), done: false
    });
    return orders;
  }

  /* 委托进度：作物看仓库，鱼看渔获袋 */
  /* 杂物、宝箱不算委托的鱼 */
  function orderFish(s) {
    return (s.fishBag || []).filter(function (e) { return e && e.q && !e.no; });
  }

  function orderHave(s, o) {
    if (!o) return 0;
    if (o.kind === 'fish') return orderFish(s).length;
    return storeCount(s, o.crop);
  }

  function deliverOrder(s, id) {
    const o = (s.orders || []).filter(function (x) { return x.id === id; })[0];
    if (!o) return { ok: false, msg: '没有这个委托' };
    if (o.done) return { ok: false, msg: '这单已经交过了' };
    const have = orderHave(s, o);
    if (have < o.qty) return { ok: false, msg: '还差 ' + (o.qty - have) + ' 个' };

    if (o.kind === 'fish') {
      // 交最便宜的可交鱼，好鱼和杂物都留着
      const drop = orderFish(s).sort(function (a, b) { return a.v - b.v; }).slice(0, o.qty);
      s.fishBag = s.fishBag.filter(function (e) { return drop.indexOf(e) < 0; });
    } else {
      takeStore(s, o.crop, o.qty);
    }
    o.done = true;
    s.stats.orders = (s.stats.orders || 0) + 1;
    addCoins(s, o.reward, '委托 · ' + o.name + '×' + o.qty);
    log(s, '📋 完成委托：' + o.emoji + ' ' + o.name + ' ×' + o.qty + '，+' + o.reward + ' 金', 'good');
    return { ok: true, reward: o.reward, msg: '委托完成，+' + o.reward + ' 金' };
  }

  function normalizeOrders(list, s) {
    if (!Array.isArray(list)) return makeOrders(s);
    const out = [];
    list.slice(0, 6).forEach(function (o, i) {
      if (!o || (o.kind !== 'crop' && o.kind !== 'fish')) return;
      if (o.kind === 'crop' && !CROPS[o.crop]) return;
      out.push({
        id: String(o.id || ('x' + i)),
        kind: o.kind,
        crop: o.kind === 'crop' ? o.crop : null,
        name: o.kind === 'crop' ? CROPS[o.crop].name : '任意鱼',
        emoji: o.kind === 'crop' ? CROPS[o.crop].emoji : '🐟',
        qty: Math.round(num(o.qty, 1, 1, 99)),
        reward: Math.round(num(o.reward, 10, 1, 9999)),
        done: !!o.done
      });
    });
    return out.length ? out : makeOrders(s);
  }

  /* ---------------- 存读档 ---------------- */

  function serialize(s) { return JSON.stringify(s); }

  /* 账本按天汇总：每天一条，balance 取当天最后一笔的余额 */
  function ledgerByDay(s) {
    const days = [];
    const map = new Map();
    (s.ledger || []).forEach(function (r) {
      let d = map.get(r.day);
      if (!d) {
        d = { day: r.day, income: 0, expense: 0, balance: r.balance, items: [] };
        map.set(r.day, d);
        days.push(d);
      }
      d.income += r.income || 0;
      d.expense += r.expense || 0;
      d.items.push(r);
    });
    return days;
  }

  /* 日志按天汇总：每天一条，items 里是当天的记录（新→旧） */
  function logByDay(s) {
    const days = [];
    const map = new Map();
    (s.log || []).forEach(function (r) {
      let d = map.get(r.day);
      if (!d) { d = { day: r.day, items: [] }; map.set(r.day, d); days.push(d); }
      d.items.push(r);
    });
    return days;
  }

  function num(v, def, min, max) {
    const n = Number(v);
    if (!isFinite(n)) return def;
    return Math.min(max == null ? Infinity : max,
                    Math.max(min == null ? -Infinity : min, n));
  }

  function deserialize(json) {
    const s = typeof json === 'string' ? JSON.parse(json) : json;
    if (!s || typeof s !== 'object') throw new Error('bad save');
    const base = createState();
    const merged = Object.assign(base, s);

    // 数值清洗：导入的存档不能带 NaN / 负数 / 离谱的地块数
    merged.maxEnergy = Math.round(num(s.maxEnergy, 10, 5, 100) / 5) * 5;
    merged.day = Math.round(num(s.day, 1, 1, 100000));
    merged.coins = Math.round(num(s.coins, 50, 0, 1e9));
    merged.energy = num(s.energy, merged.maxEnergy, 0, merged.maxEnergy);

    const plots = Array.isArray(s.plots) ? s.plots.slice(0, 40) : [];
    merged.plots = (plots.length ? plots : [{}]).map(function (p) {
      const plot = Object.assign(makePlot(), p || {});
      if (!CROPS[plot.crop]) plot.crop = null;
      plot.growth = num(plot.growth, 0, 0, 99);
      plot.missed = num(plot.missed, 0, 0, 99);
      plot.fert = num(plot.fert, 0, 0, 2);
      plot.hits = num(plot.hits, 0, 0, 9);
      if (!plot.crop) return makePlot();
      if (['growing', 'regrow', 'ripe'].indexOf(plot.phase) < 0) plot.phase = 'growing';
      return plot;
    });

    merged.bait = Object.assign({ worm: 0, dough: 0 }, s.bait || {});
    merged.bait.worm = Math.round(num(merged.bait.worm, 0, 0, 9999));
    merged.bait.dough = Math.round(num(merged.bait.dough, 0, 0, 9999));
    merged.lure = Object.assign({ owned: false, dur: 0 }, s.lure || {});
    merged.lure.dur = Math.round(num(merged.lure.dur, 0, 0, 20));
    merged.lure.owned = !!merged.lure.owned && merged.lure.dur > 0;
    merged.fishBook = Object.assign({ count: 0, entries: [], best: null, priciest: null }, s.fishBook || {});
    merged.stats = Object.assign({ harvests: 0, casts: 0, dug: 0, planted: 0, orders: 0 }, s.stats || {});
    merged.orders = normalizeOrders(s.orders, merged);
    merged.seeds = s.seeds && typeof s.seeds === 'object' ? s.seeds : {};
    // 老存档的仓库是「作物: 数量」，这里迁移成「作物: {品质: 数量}」
    merged.store = {};
    const rawStore = s.store && typeof s.store === 'object' ? s.store : {};
    Object.keys(rawStore).forEach(function (id) {
      if (!CROPS[id]) return;
      const v = rawStore[id];
      if (typeof v === 'number') {
        const n = Math.round(num(v, 0, 0, 9999));
        if (n > 0) addStore(merged, id, 'std', n);
      } else if (v && typeof v === 'object') {
        Q_IDS.forEach(function (q) {
          const n = Math.round(num(v[q], 0, 0, 9999));
          if (n > 0) addStore(merged, id, q, n);
        });
      }
    });
    merged.fishBag = Array.isArray(s.fishBag) ? s.fishBag.slice(0, 5000) : [];
    merged.ferts = Object.assign({ normal: 0, special: 0 }, s.ferts || {});
    merged.ferts.normal = Math.round(num(merged.ferts.normal, 0, 0, 999));
    merged.ferts.special = Math.round(num(merged.ferts.special, 0, 0, 999));
    merged.sprinklers = Math.round(num(s.sprinklers, 0, 0, 40));
    merged.workUsed = !!s.workUsed;
    merged.ledger = Array.isArray(s.ledger) ? s.ledger : base.ledger;
    merged.log = Array.isArray(s.log) ? s.log.slice(0, 400) : base.log;
    // 旧存档迁移：垃圾不参与品质判定（早期版本会给出「优质垃圾」）
    if (merged.fishBook.entries) {
      merged.fishBook.entries.forEach(function (e) { if (e && e.trash) e.quality = null; });
    }
    return merged;
  }

  /* ---------------- 导出 ---------------- */

  const API = {
    CROPS: CROPS, CROP_LIST: CROP_LIST, FERT: FERT, QUALITY: QUALITY, FISH: FISH,
    WEATHER: WEATHER, WEATHER_LIST: WEATHER_LIST, BAIT: BAIT, SAVE_VERSION: SAVE_VERSION,
    setRng: setRng, seasonOf: seasonOf, SEASONS: SEASONS,
    createState: createState, serialize: serialize, deserialize: deserialize,
    ledgerByDay: ledgerByDay, logByDay: logByDay,
    makeOrders: makeOrders, deliverOrder: deliverOrder, orderHave: orderHave, orderPool: orderPool,
    mealFee: mealFee, expandCost: expandCost, upgradeCost: upgradeCost,
    WORK_RATE_FULL: WORK_RATE_FULL, WORK_RATE_HALF: WORK_RATE_HALF,
    workCost: workCost, workPay: workPay, needOf: needOf, expectedYield: expectedYield,
    canHarvest: canHarvest, stageEmoji: stageEmoji, fertBonus: fertBonus, baitCount: baitCount,
    plant: plant, plantAll: plantAll, water: water, waterAll: waterAll,
    harvest: harvest, harvestAll: harvestAll, clearPlot: clearPlot,
    sellAll: sellAll, sellOne: sellOne, sellSeed: sellSeed, sellAllSeeds: sellAllSeeds,
    addStore: addStore, storeCount: storeCount, storeValue: storeValue, storeMix: storeMix,
    takeStore: takeStore, unitValue: unitValue,
    fishGroups: fishGroups, fishKey: fishKey, sellFishGroup: sellFishGroup, sellAllFish: sellAllFish,
    sellWorms: sellWorms, WORM_VALUE: WORM_VALUE,
    qualityById: qualityById,
    buySeed: buySeed, seedBuyPrice: seedBuyPrice, seedSellPrice: seedSellPrice,
    SEED_SELL_RATE: SEED_SELL_RATE,
    useFert: useFert, buyFertItem: buyFertItem, sellFert: sellFert, fertSellPrice: fertSellPrice,
    FERT_SELL_RATE: FERT_SELL_RATE, buySprinkler: buySprinkler, SPRINKLER_COST: SPRINKLER_COST,
    fertilizeAll: fertilizeAll, canFert: canFert, fertTargets: fertTargets, sleep: sleep, fish: fish,
    fishMany: fishMany, digWorms: digWorms, buyBait: buyBait, tea: tea, work: work, workAuto: workAuto,
    expand: expand, upgrade: upgrade, rollWeather: rollWeather
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  root.FarmGame = API;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================
 * 我的小农场 · 界面层
 * ============================================================ */
(function () {
  'use strict';

  const G = window.FarmGame;
  const SAVE_KEY = 'farm-gui-save-v1';

  let state = null;
  let baitSel = 'worm';
  let soundOn = true;

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.prototype.slice.call(document.querySelectorAll(sel));

  /* ---------------- 存档 ---------------- */

  function save() {
    try { localStorage.setItem(SAVE_KEY, G.serialize(state)); } catch (e) { /* 忽略 */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return G.deserialize(raw);
    } catch (e) { /* 忽略 */ }
    return null;
  }

  /* ---------------- 导入 / 导出 ---------------- */

  function stamp() {
    const d = new Date();
    const p2 = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' +
           p2(d.getHours()) + p2(d.getMinutes());
  }

  function download(name, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 80);
  }

  function exportSave() {
    download('小农场存档-' + stamp() + '.json', G.serialize(state), 'application/json;charset=utf-8');
    toast('存档已导出 ⬇️', 'good');
  }

  function exportLedger() {
    const days = G.ledgerByDay(state);
    const lines = ['# 我的小农场 · 账本', '',
      '> 导出时间：' + new Date().toLocaleString('zh-CN'),
      '> 当前进度：第 ' + state.day + ' 天 · ' + state.coins + ' 金 · ' + state.plots.length + ' 块地', '',
      '| 天数 | 收入 | 支出 | 净 | 余额 |', '|---|---|---|---|---|'];
    days.forEach(function (d) {
      const net = d.income - d.expense;
      lines.push('| D' + d.day + ' | +' + d.income + ' | -' + d.expense + ' | ' +
        (net >= 0 ? '+' : '') + net + ' | ' + d.balance + ' |');
    });
    lines.push('', '## 明细');
    days.forEach(function (d) {
      lines.push('', '### D' + d.day);
      d.items.slice().reverse().forEach(function (it) {
        lines.push('- ' + it.label + '：' +
          (it.income ? '+' + it.income : (it.expense ? '-' + it.expense : '—')) + ' 金');
      });
    });
    const total = days.reduce(function (a, d) { return a + d.income - d.expense; }, 0);
    lines.push('', '**累计净收益：' + (total >= 0 ? '+' : '') + total + ' 金**');
    download('小农场账本-' + stamp() + '.md', lines.join('\n') + '\n', 'text/markdown;charset=utf-8');
    toast('账本已导出 ⬇️', 'good');
  }

  function exportLog() {
    const dayWater = '第 ' + state.day + ' 天 · ' + state.coins + ' 金 · 体力 ' +
      state.energy + '/' + state.maxEnergy + ' · ' + state.plots.length + ' 块地';
    const lines = state.log.slice().reverse().map(function (r) {
      return '- **D' + r.day + '** ' + r.text;
    });
    const text = '# 我的小农场 · 游戏日志\n\n' +
      '> 导出时间：' + new Date().toLocaleString('zh-CN') + '\n' +
      '> 当前进度：' + dayWater + '\n' +
      '> 累计渔获：' + state.fishBook.count + ' 条\n\n' +
      lines.join('\n') + '\n';
    download('小农场日志-' + stamp() + '.md', text, 'text/markdown;charset=utf-8');
    toast('日志已导出 ⬇️', 'good');
  }

  function importSave(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const raw = JSON.parse(String(reader.result));
        if (!raw || !Array.isArray(raw.plots) || typeof raw.coins !== 'number') {
          throw new Error('bad save');
        }
        state = G.deserialize(raw);
        catchLog = (state.fishBook.entries || []).slice(0, 5);
        save();
        renderAll();
        toast('存档已导入：第 ' + state.day + ' 天 · ' + state.coins + ' 金', 'good');
      } catch (e) {
        toast('导入失败：不是有效的小农场存档', 'bad');
      }
    };
    reader.readAsText(file);
  }

  /* ---------------- 音效 ---------------- */

  let actx = null;
  function beep(freq, dur, type, gain) {
    if (!soundOn) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, actx.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.12));
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + (dur || 0.12) + 0.02);
    } catch (e) { /* 忽略 */ }
  }
  const SFX = {
    plant: () => beep(330, 0.1, 'triangle', 0.05),
    water: () => beep(520, 0.08, 'sine', 0.04),
    coin:  () => { beep(880, 0.09, 'triangle', 0.06); setTimeout(() => beep(1180, 0.1, 'triangle', 0.05), 70); },
    catch: () => { beep(660, 0.09, 'sine', 0.06); setTimeout(() => beep(990, 0.14, 'sine', 0.05), 80); },
    good:  () => beep(740, 0.13, 'sine', 0.05),
    bad:   () => beep(200, 0.16, 'sawtooth', 0.05),
    sleep: () => { beep(420, 0.14, 'sine', 0.05); setTimeout(() => beep(300, 0.18, 'sine', 0.04), 120); }
  };

  /* ---------------- Toast / 飘字 ---------------- */

  function toast(msg, kind) {
    if (!msg) return;
    const root = $('#toast-root');
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () {
      el.classList.add('out');
      setTimeout(function () { el.remove(); }, 320);
    }, 1900);
  }

  function floatText(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = 'float ' + (cls || '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    $('#fx').appendChild(el);
    setTimeout(function () { el.remove(); }, 1100);
  }

  /* ---------------- 弹窗 ---------------- */

  function openModal(title, body, foot, opts) {
    const root = $('#modal-root');
    root.innerHTML =
      '<div class="modal-mask" data-close></div>' +
      '<div class="modal">' +
        '<div class="modal-head"><h3>' + title + '</h3>' +
          '<button class="x" data-close>✕</button></div>' +
        '<div class="modal-body">' + body + '</div>' +
        (foot ? '<div class="modal-foot">' + foot + '</div>' : '') +
      '</div>';
    root.classList.add('on');
    if (opts && opts.onMount) opts.onMount(root);
  }

  function closeModal() {
    const root = $('#modal-root');
    root.classList.remove('on');
    root.innerHTML = '';
  }

  const modalOpen = () => $('#modal-root').classList.contains('on');

  /* ---------------- HUD ---------------- */

  function renderHud() {
    const w = G.WEATHER[state.weather];
    $('#hud-coins').innerHTML = '💰 <b>' + state.coins + '</b>';
    $('#hud-ebar').style.width = (state.energy / state.maxEnergy * 100) + '%';
    $('#hud-etxt').textContent = state.energy + '/' + state.maxEnergy;
    const ec = $('.chip.energy');
    ec.classList.toggle('low', state.energy / state.maxEnergy <= 0.45 && state.energy > 0);
    ec.classList.toggle('empty', state.energy <= 0);

    const wc = $('#hud-weather');
    wc.textContent = w.emoji + ' ' + w.name;
    wc.dataset.w = w.id;
    wc.title = w.note;

    $('#hud-fee').textContent = '🍖 ' + G.mealFee(state) + ' 金/天';
    $('#hud-plots').textContent = '🏞️ ' + state.plots.length + ' 块';
    $('#season').textContent = G.seasonOf(state.day) + ' · 第 ' + state.day + ' 天';
  }

  /* ---------------- 农田 ---------------- */

  const PLOT_CLASS = { growing: 'growing', regrow: 'growing', ripe: 'ripe' };

  function renderPlots() {
    const grid = $('#plot-grid');
    const keepScroll = grid.scrollTop;          // 重绘会重置滚动条，先存下来
    grid.innerHTML = state.plots.map(function (p, i) {
      if (!p.crop) {
        return '<div class="plot empty" data-i="' + i + '" role="button" tabindex="0"' +
          ' aria-label="第 ' + (i + 1) + ' 块地，空地，点击播种">' +
          '<div class="plot-top"><span class="plot-no">' + (i + 1) + '</span></div>' +
          '<div class="plot-art soil"><span class="seed-dot">＋</span></div>' +
          '<div class="plot-name">空地</div>' +
          '<div class="bar"><i style="width:0%"></i></div>' +
          '<div class="plot-foot">点击播种</div>' +
        '</div>';
      }
      const c = G.CROPS[p.crop];
      const need = G.needOf(p);
      const pct = Math.round(p.growth / need * 100);
      const can = G.canHarvest(state, p);
      const cls = PLOT_CLASS[p.phase] || '';

      let badges = '';
      if (p.watered) badges += '<span title="今日已浇水">💧</span>';
      if (p.fert) badges += '<span title="已施肥 +' + p.fert + '">🧪</span>';

      let foot;
      if (p.phase === 'ripe') {
        foot = can ? '<span style="color:var(--green-d)">✨ 点击收获</span>'
                   : '明天可收';
      } else if (p.watered) {
        foot = '<span style="color:var(--blue)">今日已浇</span>';
      } else {
        foot = p.missed > 0 ? '<span class="warn">缺水 ×' + p.missed + '</span>' : '待浇水';
      }

      const nameExtra = p.phase === 'regrow' ? '再生' : '';
      const aria = '第 ' + (i + 1) + ' 块地，' + c.name + '，' + p.growth + '/' + need + ' 天，' +
        (can ? '可以收获' : (p.phase === 'ripe' ? '明天可收' : (p.watered ? '今天已浇水' : '待浇水')));

      return '<div class="plot ' + cls + '" data-i="' + i + '" role="button" tabindex="0"' +
        ' aria-label="' + aria + '">' +
        '<div class="plot-top"><span class="plot-no">' + (i + 1) + '</span>' +
          '<div class="plot-badges">' + badges + '</div></div>' +
        '<div class="plot-art">' + G.stageEmoji(p) + '</div>' +
        '<div class="plot-name">' + c.name +
          '<small>' + (nameExtra ? nameExtra + ' ' : '') + p.growth + '/' + need + '天</small></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="plot-foot">' + foot + '</div>' +
      '</div>';
    }).join('');
    grid.scrollTop = keepScroll;

    const anyGrow = state.plots.some(function (p) {
      return p.crop && p.phase !== 'ripe' && !p.watered;
    });
    const anyRipe = state.plots.some(function (p) { return p.crop && G.canHarvest(state, p); });
    const anyEmpty = state.plots.some(function (p) { return !p.crop; });
    const seedTotal = Object.keys(state.seeds).reduce(function (n, k) { return n + (state.seeds[k] || 0); }, 0);
    const fertList = G.fertTargets(state);

    $('[data-act="waterAll"]').disabled = !anyGrow;
    $('[data-act="harvestAll"]').disabled = !anyRipe;
    $('[data-act="plantAll"]').disabled = !anyEmpty;
    $('[data-act="fertilizeAll"]').disabled = !fertList.length || state.energy < 1 || state.coins < 5;
    $('#plantall-txt').textContent = anyEmpty
      ? (seedTotal ? '库存 ' + seedTotal + ' 颗 · 空地 ' + state.plots.filter(function (p) { return !p.crop; }).length + ' 块'
                   : '没种子 · 点这里去种子店')
      : '没有空地';
    $('#fertall-txt').textContent = fertList.length
      ? '可施 ' + fertList.length + ' 块 · 5 金起'
      : (anyGrow ? '都施过肥了' : '没有进行中的作物');
  }

  /* ---------------- 操作按钮 ---------------- */

  function renderActions() {
    const fullNeed = G.workCost(state, 'full');
    const halfNeed = G.workCost(state, 'half');
    if (state.workUsed) {
      $('#work-txt').textContent = '今天已经打过了 · 明天再来';
    } else if (state.energy >= fullNeed) {
      $('#work-txt').textContent = '全天 · -' + fullNeed + ' 体力 · +' + G.workPay(state, 'full') + ' 金';
    } else if (state.energy >= halfNeed) {
      $('#work-txt').textContent = '半天 · -' + halfNeed + ' 体力 · +' + G.workPay(state, 'half') + ' 金';
    } else if (state.energy > 0) {
      $('#work-txt').textContent = '半天 · 用光 ' + state.energy + ' 点 · +' + Math.round(state.energy * G.WORK_RATE_HALF) + ' 金';
    } else {
      $('#work-txt').textContent = '体力不足 · 先睡觉';
    }
    $('#expand-txt').textContent = '第 ' + (state.plots.length + 1) + ' 块 · ' + G.expandCost(state) + ' 金';
    $('#upgrade-txt').textContent = '上限 ' + state.maxEnergy + '→' + (state.maxEnergy + 5) + ' · ' + G.upgradeCost(state) + ' 金';
    $('#sprinkler-txt').textContent = '已有 ' + state.sprinklers + ' 个 · ' + G.SPRINKLER_COST + ' 金/个';

    const teaBtn = $('[data-act="tea"]');
    teaBtn.disabled = state.teaUsed || state.energy >= state.maxEnergy;
    $('#tea-txt').textContent = state.teaUsed
      ? '今天喝过了'
      : (state.energy >= state.maxEnergy ? '体力已满' : '3 金 · +5 体力');

    $('[data-act="dig"]').disabled = state.energy < 3;
    $('[data-act="work"]').disabled = state.workUsed || state.energy <= 0;
    $('[data-act="expand"]').disabled = state.coins < G.expandCost(state);
    $('[data-act="upgrade"]').disabled = state.coins < G.upgradeCost(state);
    $('[data-act="sprinkler"]').disabled = state.coins < G.SPRINKLER_COST || state.sprinklers >= state.plots.length;
  }

  /* ---------------- 钓鱼 ---------------- */

  function renderBait() {
    const list = [
      { id: 'worm', n: state.bait.worm },
      { id: 'dough', n: state.bait.dough },
      { id: 'lure', n: state.lure.owned ? state.lure.dur : 0 }
    ];
    if (!list.some(function (b) { return b.id === baitSel && b.n > 0; })) {
      const first = list.filter(function (b) { return b.n > 0; })[0];
      baitSel = first ? first.id : 'worm';
    }
    $('#bait-row').innerHTML = list.map(function (b) {
      const bd = G.BAIT[b.id];
      const cnt = b.id === 'lure' ? (b.n ? b.n + '/20' : '无') : '×' + b.n;
      return '<div class="bait ' + (b.id === baitSel ? 'sel ' : '') + (b.n ? '' : 'off') +
        '" data-bait="' + b.id + '" title="' + bd.desc + '"' +
        ' role="button" tabindex="0" aria-label="' + bd.name + '，' + (b.n ? b.n + ' 个' : '没有') + '"' +
        ' aria-pressed="' + (b.id === baitSel) + '">' +
        '<span>' + bd.emoji + '</span><span class="bn">' + bd.name + '</span>' +
        '<span class="bc">' + cnt + '</span></div>';
    }).join('');

    $('[data-act="cast"]').disabled = state.energy < 2;
    $('[data-act="cast5"]').disabled = state.energy < 10;   // 5 杆要 10 体力，不够就别假装能连甩
  }

  /* 最近渔获：单杆/连甩都按条列出来，保留最近 5 条 */
  let catchLog = [];

  function renderCatch() {
    const box = $('#catch-area');
    if (!catchLog.length) {
      box.innerHTML = '<div class="catch-empty">今天还没开张，甩一杆试试 🌊</div>';
      return;
    }
    const sum = catchLog.reduce(function (n, e) { return n + e.price; }, 0);
    box.innerHTML =
      '<div class="catch-sum">最近 ' + catchLog.length + ' 条 · 共值 ' + sum + ' 金（在仓库里卖）</div>' +
      '<div class="catch-list">' + catchLog.map(function (e) {
        const col = e.quality ? e.quality.color : '#9a866c';
        return '<div class="catch-item" style="border-left-color:' + col + '">' +
          '<span class="ce">' + e.emoji + '</span>' +
          '<span class="cn2">' + e.fish + '</span>' +
          '<span class="cq2" style="color:' + col + '">' +
            (e.quality ? e.quality.emoji + ' ' + e.quality.name : '杂物') + '</span>' +
          '<span class="cp2">值 ' + e.price + '</span>' +
        '</div>';
      }).join('') + '</div>';
  }

  function pushCatch(entry) {
    catchLog.unshift(entry);
    if (catchLog.length > 5) catchLog.length = 5;
    renderCatch();
  }

  function setCatchBatch(entries) {
    catchLog = entries.slice().reverse().slice(0, 5);
    renderCatch();
  }

  /* ---------------- 仓库 ---------------- */

  function renderStore() {
    const ids = Object.keys(state.store).filter(function (k) { return G.storeCount(state, k) > 0; });
    const fish = G.fishGroups(state);
    const fishCount = fish.reduce(function (n, g) { return n + g.count; }, 0);
    const box = $('#store-list');

    const cropHtml = ids.length
      ? ids.map(function (id) {
          const c = G.CROPS[id];
          const n = G.storeCount(state, id);
          const val = G.storeValue(state, id);
          const mix = G.storeMix(state, id);
          const mixTxt = mix.map(function (m) {
            return '<span style="color:' + m.color + '">' + m.name + ' ' + m.n + '</span>';
          }).join(' · ');
          return '<div class="store-row">' +
            '<span class="se">' + c.emoji + '</span>' +
            '<div><div class="sn">' + c.name + ' ×' + n + '</div>' +
            '<div class="sv">' + mixTxt + ' · 均 ' + (val / n).toFixed(1) + ' 金</div></div>' +
            '<span class="sp">' + val + ' 金</span>' +
            '<button class="btn mini" data-sell="' + id + '">卖出</button>' +
          '</div>';
        }).join('')
      : '';

    const fishHtml = fishCount
      ? '<div class="store-sub">🐟 渔获 · ' + fishCount + ' 条</div>' +
        fish.map(function (g) {
          const q = G.qualityById(g.q);
          const col = q ? q.color : 'var(--ink-3)';
          return '<div class="store-row">' +
