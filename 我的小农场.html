  }

  /* 百货店买果树种子 / 树苗：买回来存在 stock 里，果园那边再种 */
  function buyTreeStock(s, id, mode, n) {
    const t = TREES[id];
    if (!t) return { ok: false, msg: '没有这种果树' };
    const m = mode === 'sapling' ? 'sapling' : 'seed';
    const qty = Math.max(1, Math.min(9, Math.floor(n || 1)));
    const unit = treeBuyPrice(s, id, m);
    const cost = unit * qty;
    if ((s.coins || 0) < cost) return { ok: false, msg: '金币不够（' + cost + ' 金）' };
    s.coins -= cost;
    ledger(s, '买' + t.name + (m === 'sapling' ? '树苗' : '种子') + ' ×' + qty, 0, cost);
    tradeXp(s, cost);
    s.treeStock = s.treeStock || {};
    s.treeStock[id] = s.treeStock[id] || { seed: 0, sapling: 0 };
    s.treeStock[id][m] += qty;
    log(s, t.emoji + ' 买了' + t.name + (m === 'sapling' ? '树苗' : '种子') + ' ×' + qty + '（-' + cost + ' 金）', 'info');
    return { ok: true, qty: qty, cost: cost,
             msg: t.name + (m === 'sapling' ? '树苗' : '种子') + ' ×' + qty + '（-' + cost + ' 金）' };
  }

  /* ---------------- 树坑 ---------------- */

  function treeSlot(s, i) {
    const slots = (s.orchard && s.orchard.slots) || [];
    return slots[i] || null;
  }

  /* 成树条件：浇够水数 且 长够天数（两项都要满足） */
  function treeNeed(t) {
    const g = BALANCE.orchard.grow[t && t.mode === 'sapling' ? 'sapling' : 'seed'];
    return { days: g.days, water: g.water };
  }

  function treeAge(s, t) { return t ? Math.max(0, (s.day || 1) - (t.planted || 1)) : 0; }

  function treeMature(s, i) {
    const t = treeSlot(s, i);
    if (!t) return false;
    const need = treeNeed(t);
    return treeAge(s, t) >= need.days && (t.water || 0) >= need.water;
  }

  function treeNeedsWater(s, i) {
    const t = treeSlot(s, i);
    return !!t && (t.water || 0) < treeNeed(t).water;
  }

  function treeStage(s, i) {
    const t = treeSlot(s, i);
    if (!t) return 'empty';
    return treeMature(s, i) ? 'mature' : 'growing';
  }

  function treeInSeason(s, i) {
    const t = treeSlot(s, i);
    if (!t || !TREES[t.id]) return false;
    return seasonIdx(s.day || 1) === TREES[t.id].season;
  }

  /* ---------------- 成树等级 ----------------
   * 成树以后靠「收获」攒经验：每次收获 +1，升到下一级要 2 / 4 / 6 / 8 次（满级 5）。
   * 每高一级，「当天多挂 1 个果」的概率 +10%，挂果上限不变。 */
  function treeLevel(t) {
    return clamp(t && t.lv ? t.lv : 1, 1, BALANCE.orchard.treeLvMax);
  }
  function treeXpNeed(lv) {
    return BALANCE.orchard.treeXpBase + BALANCE.orchard.treeXpStep * (lv - 1);
  }
  function treeXp(t) { return (t && t.xp) || 0; }
  function treeYieldBonus(lv) {
    return Math.max(0, (lv - 1) * BALANCE.orchard.treeLvYield);
  }
  function treeLevelText(t) {
    const lv = treeLevel(t);
    if (lv >= BALANCE.orchard.treeLvMax) return 'Lv' + lv + '（满级 +' +
      Math.round(treeYieldBonus(lv) * 100) + '%）';
    return 'Lv' + lv + ' · ' + treeXp(t) + '/' + treeXpNeed(lv);
  }
  /* 收获后加经验，返回升了几级 */
  function treeGainXp(t) {
    const max = BALANCE.orchard.treeLvMax;
    t.lv = treeLevel(t);
    t.xp = treeXp(t) + 1;
    let up = 0;
    while (t.lv < max && t.xp >= treeXpNeed(t.lv)) {
      t.xp -= treeXpNeed(t.lv);
      t.lv++;
      up++;
    }
    if (t.lv >= max) t.xp = 0;
    return up;
  }

  /* 育苗进度：给界面显示已浇水天数与自然生长天数 */
  function treeProgress(s, i) {
    const t = treeSlot(s, i);
    if (!t) return null;
    const need = treeNeed(t);
    return { age: treeAge(s, t), needDays: need.days,
             water: t.water || 0, needWater: need.water,
             done: treeMature(s, i), ripe: t.ripe || 0, mode: t.mode || 'seed',
             lv: treeLevel(t), xp: treeXp(t), xpNeed: treeXpNeed(treeLevel(t)),
             lvMax: BALANCE.orchard.treeLvMax, yieldBonus: treeYieldBonus(treeLevel(t)) };
  }

  /* 种树：种子要浇水 30 天 + 满 90 天；树苗浇水 15 天 + 满 30 天 */
  function plantTree(s, i, id, mode) {
    if (!orchardUnlocked(s)) return { ok: false, msg: '先去农场开垦果园' };
    const t = TREES[id];
    if (!t) return { ok: false, msg: '没有这种果树' };
    const slots = s.orchard.slots || [];
    if (!(i >= 0 && i < slots.length)) return { ok: false, msg: '这个树坑还没开垦' };
    if (slots[i]) return { ok: false, msg: '这个树坑已经种了 ' + TREES[slots[i].id].name };
    const m = mode === 'sapling' ? 'sapling' : 'seed';
    if (treeStockCount(s, id, m) <= 0) {
      return { ok: false, msg: '没有' + t.name + (m === 'sapling' ? '树苗' : '种子') + '了，先去百货店买' };
    }
    s.treeStock[id][m]--;
    slots[i] = { id: id, mode: m, planted: s.day || 1, water: 0, lastWater: 0, ripe: 0, lv: 1, xp: 0 };
    s.orchard.slots = slots;
    s.stats.orchardPlanted = (s.stats.orchardPlanted || 0) + 1;
    const need = treeNeed(slots[i]);
    log(s, t.emoji + ' 在 ' + (i + 1) + ' 号树坑种下' + t.name +
      '（浇水 ' + need.water + ' 天 + 生长 ' + need.days + ' 天）', 'info');
    return { ok: true, slot: i, msg: t.name + ' 种下了（浇水 ' + need.water + ' 天 · 生长 ' + need.days + ' 天）' };
  }

  /* 单棵浇水；完成该树苗所需浇水天数后，无需再浇 */
  function waterTree(s, i) {
    if (!orchardUnlocked(s)) return { ok: false, msg: '还没有果园' };
    const t = treeSlot(s, i);
    if (!t) return { ok: false, msg: '这个树坑还是空的' };
    if (!treeNeedsWater(s, i)) return { ok: false, msg: '这棵树苗已经浇足水了' };
    if (t.lastWater === s.day) return { ok: false, msg: '这棵树今天已经浇过了' };
    const E = BALANCE.orchard.waterEnergy;
    if ((s.energy || 0) < E) return { ok: false, msg: '体力不够，浇水要 ' + E + ' 点' };
    t.lastWater = s.day;
    t.water = Math.min(treeNeed(t).water, (t.water || 0) + 1);
    s.energy -= E;
    log(s, '💧 给第 ' + (i + 1) + ' 棵育苗树浇水（-' + E + ' 体力）', 'info');
    return { ok: true, n: 1, cost: E, msg: '给第 ' + (i + 1) + ' 棵育苗树浇水（-' + E + ' 体力）' };
  }

  /* 批量浇水：依序浇所有今天还需浇水的育苗树，每棵 1 体力 */
  function waterOrchard(s) {
    if (!orchardUnlocked(s)) return { ok: false, msg: '还没有果园' };
    const E = BALANCE.orchard.waterEnergy;
    const slots = s.orchard.slots || [];
    const todo = [];
    slots.forEach(function (t, i) {
      if (!t || !treeNeedsWater(s, i)) return;
      if (t.lastWater === s.day) return;
      todo.push({ tree: t, index: i });
    });
    if (!todo.length) return { ok: false, msg: '今天没有要浇水的果树' };
    const canPay = Math.floor((s.energy || 0) / E);
    if (canPay <= 0) return { ok: false, msg: '体力不够，浇水要 ' + E + ' 点/棵' };
    const n = Math.min(canPay, todo.length);
    for (let k = 0; k < n; k++) {
      const t = todo[k].tree;
      t.lastWater = s.day;
      t.water = Math.min(treeNeed(t).water, (t.water || 0) + 1);
    }
    s.energy -= n * E;
    log(s, '💧 给 ' + n + ' 棵果树浇水（-' + (n * E) + ' 体力）', 'info');
    return { ok: true, n: n, cost: n * E,
             msg: '给 ' + n + ' 棵果树浇水（-' + (n * E) + ' 体力）' +
               (n < todo.length ? '，体力不够还有 ' + (todo.length - n) + ' 棵没浇' : '') };
  }

  /* 收获：每棵 1 体力，果实直接进仓库 */
  function harvestTree(s, i) {
    const t = treeSlot(s, i);
    if (!t) return { ok: false, msg: '这个树坑还是空的' };
    if (!t.ripe) return { ok: false, msg: '还没有可收的果实' };
    const E = BALANCE.orchard.harvestEnergy;
    if ((s.energy || 0) < E) return { ok: false, msg: '体力不够，收获要 ' + E + ' 点' };
    const tr = TREES[t.id];
    const n = t.ripe;
    t.ripe = 0;
    s.energy -= E;
    addStore(s, tr.fruitId, 'std', n);
    s.stats.orchardFruit = (s.stats.orchardFruit || 0) + n;
    const lvUp = treeGainXp(t);
    // 水果也进图鉴（和作物共用 codex.crops，果实固定标准品质）
    s.codex = s.codex || { fish: {}, crops: {} };
    s.codex.crops = s.codex.crops || {};
    const fr = CROPS[tr.fruitId];
    const cx = s.codex.crops[tr.fruitId] ||
      (s.codex.crops[tr.fruitId] = { n: 0, best: null, first: s.day, value: 0 });
    cx.n += n;
    cx.value += n * (fr ? fr.price : 0);
    if (!cx.best) cx.best = 'std';   // 果树果实固定标准品质
    log(s, '🧺 收获 ' + tr.emoji + ' ' + tr.fruit + ' ×' + n + '（-' + E + ' 体力）' +
      (lvUp ? ' · 果树升到 Lv' + t.lv : ''), 'good');
    return { ok: true, n: n, cost: E, lv: t.lv, levelUp: lvUp,
             msg: '收获 ' + tr.fruit + ' ×' + n + ' 进仓库（-' + E + ' 体力）' +
               (lvUp ? ' · 果树 Lv' + t.lv : '') };
  }

  function harvestOrchard(s) {
    if (!orchardUnlocked(s)) return { ok: false, msg: '还没有果园' };
    const E = BALANCE.orchard.harvestEnergy;
    const slots = s.orchard.slots || [];
    let n = 0, fruit = 0;
    for (let i = 0; i < slots.length; i++) {
      const t = slots[i];
      if (!t || !t.ripe) continue;
      if ((s.energy || 0) < E) break;
      const r = harvestTree(s, i);
      if (r.ok) { n++; fruit += r.n; }
    }
    if (!n) return { ok: false, msg: '现在没有可收的果实' };
    return { ok: true, n: n, fruit: fruit, cost: n * E,
             msg: '收了 ' + n + ' 棵树共 ' + fruit + ' 个水果（-' + (n * E) + ' 体力）' };
  }

  /* 睡觉结算：成树在当季每天随机挂 1~3 个果实，等人来收（每棵最多挂 ripeCap 个，满了不再挂） */
  function orchardTick(s, prevDay) {
    if (!orchardUnlocked(s)) return { fruit: 0, mature: 0, growing: 0, thirsty: 0, ripe: 0, full: 0 };
    const slots = s.orchard.slots || [];
    let fruit = 0, mature = 0, growing = 0, thirsty = 0, ripe = 0, full = 0;
    const cap = BALANCE.orchard.ripeCap;
    const season = seasonIdx(s.day || 1);
    slots.forEach(function (t, i) {
      if (!t) return;
      if (treeMature(s, i)) {
        mature++;
        if (TREES[t.id].season === season) {
          const n = randInt(BALANCE.orchard.fruitMin, BALANCE.orchard.fruitMax);
          const bonus = treeYieldBonus(treeLevel(t));
          const extra = (bonus > 0 && rand() < bonus) ? 1 : 0;
          const had = t.ripe || 0;
          t.ripe = Math.min(cap, had + n + extra);
          fruit += t.ripe - had;
          if (t.ripe >= cap) full++;
        }
      } else {
        growing++;
        if (treeNeedsWater(s, i) && t.lastWater !== s.day) thirsty++;
      }
      ripe += t.ripe || 0;
    });
    return { fruit: fruit, mature: mature, growing: growing, thirsty: thirsty, ripe: ripe, full: full };
  }

  /* 果园概况：给界面 / 总结用 */
  function orchardSummary(s) {
    const slots = (s.orchard && s.orchard.slots) || [];
    let mature = 0, growing = 0, inSeason = 0, ripe = 0, thirsty = 0;
    slots.forEach(function (t, i) {
      if (!t) return;
      ripe += t.ripe || 0;
      if (treeMature(s, i)) {
        mature++;
        if (treeInSeason(s, i)) inSeason++;
      } else {
        growing++;
        if (treeNeedsWater(s, i) && t.lastWater !== s.day) thirsty++;
      }
    });
    return { total: slots.length, max: BALANCE.orchard.slots, mature: mature, growing: growing,
             inSeason: inSeason, ripe: ripe, thirsty: thirsty };
  }

/* ==================== src/13-orders.js ==================== */
/* 每日委托与长期订单 */
  /* ---------------- 每日委托 ---------------- */

  /* 委托池：按天数一档档解锁（前期慢一点，后期全开）；同档内按解锁等级 + 种子价排 */
  const ORDER_TIERS = [
    { day: 1, n: 4 }, { day: 3, n: 5 }, { day: 5, n: 6 }, { day: 7, n: 7 },
    { day: 9, n: 8 }, { day: 12, n: 10 }, { day: 15, n: 11 }, { day: 18, n: 13 }, { day: 21, n: 14 }
  ];

  function orderPool(day, farmLevel) {
    const lv = farmLevel || 10;                       // 不传等级时不做裁剪（给测试/兼容用）
    const sorted = CROP_LIST.slice()
      .filter(function (c) { return (c.lv || 1) <= lv + 1; })
      .sort(function (a, b) { return ((a.lv || 1) - (b.lv || 1)) || (a.seed - b.seed); });
    let n = ORDER_TIERS[0].n;
    ORDER_TIERS.forEach(function (t) { if (day >= t.day) n = t.n; });
    return sorted.slice(0, Math.min(n, sorted.length));
  }

  /* 委托权重：越贵的作物越容易被点单，便宜菜不再天天刷屏 */
  function orderWeight(c) {
    return 1 + Math.min(5, Math.floor(c.price / 12));
  }

  function pickOrderCrop(pool, used) {
    const cand = pool.filter(function (c) { return used.indexOf(c.id) < 0; });
    if (!cand.length) return null;
    let total = 0;
    cand.forEach(function (c) { total += orderWeight(c); });
    let r = rand() * total;
    for (let i = 0; i < cand.length; i++) {
      r -= orderWeight(cand[i]);
      if (r <= 0) return cand[i];
    }
    return cand[cand.length - 1];
  }

  /* 委托只收「普通」及以上：劣质不计数、也扣不走，只能自己卖 */
  const ORDER_MIN_RANK = Math.max(0, Q_IDS.indexOf(BALANCE.order.minQuality));
  function orderQOk(q) { return Q_IDS.indexOf(q) >= ORDER_MIN_RANK; }
  function orderStoreCount(s, id) {
    const b = s.store[id];
    if (!b) return 0;
    let n = 0;
    for (let i = ORDER_MIN_RANK; i < Q_IDS.length; i++) n += b[Q_IDS[i]] || 0;
    return n;
  }
  function takeStoreOrder(s, id, n) {
    const b = s.store[id];
    if (!b) return 0;
    let left = n;
    for (let i = ORDER_MIN_RANK; i < Q_IDS.length && left > 0; i++) {
      const q = Q_IDS[i], have = b[q] || 0, take = Math.min(have, left);
      if (take) { b[q] = have - take; left -= take; }
    }
    if (storeCount(s, id) <= 0) delete s.store[id];
    return n - left;
  }

  function makeOrders(s) {
    const day = (s && s.day) || 1;
    const farmLv = (s && s.levels && s.levels.farm) || 1;
    const pool = orderPool(day, farmLv);
    const used = [];
    const orders = [];
    const season = seasonIdx(day);                                              // 0 春 / 1 夏 / 2 秋 / 3 冬（跨年循环）
    const mult = 1 + season * BALANCE.order.seasonStep;                        // 1 / 1.6 / 2.2 / 2.8
    /* 平时点当季作物，偶尔点一批反季的（冬天全是反季，不特殊处理） */
    const inSeason = pool.filter(function (c) { return (c.seasons || []).indexOf(season) >= 0; });
    const offSeason = pool.filter(function (c) { return (c.seasons || []).indexOf(season) < 0; });
    const basePool = (season < 3 && inSeason.length >= 3) ? inSeason : pool;

    function pushCrop(c, isOff) {
      used.push(c.id);
      const qty = Math.max(1, Math.round((c.price >= 20 ? randInt(2, 3) : randInt(3, 6)) * mult));
      // 市价溢价：合同价跟着该作物当前市价走（反季 / 稀缺时更值钱），但有封顶
      const mk = Math.min(BALANCE.market.orderCap, marketMul(s, c.id));
      const reward = Math.max(40, Math.round(qty * c.price * BALANCE.order.mult * mk *
        (1 + townBonus(s, 'orderBonus'))));
      orders.push({
        id: 'd' + day + '-c' + orders.length, kind: 'crop', crop: c.id, name: c.name, emoji: c.emoji,
        qty: qty, reward: reward, mul: mk, offSeason: !!isOff, done: false, flagship: orders.length === 0
      });
    }

    // 保底：第一张单固定是「当季能买到的最贵作物」，避免一天全是白菜单
    if (basePool.length) {
      const buyable = basePool.filter(function (c) { return (c.lv || 1) <= farmLv; });
      const src = buyable.length ? buyable : basePool;
      const top = src.slice().sort(function (a, b) { return b.price - a.price; })[0];
      pushCrop(top, season < 3 && (top.seasons || []).indexOf(season) < 0);
    }
    for (let i = orders.length; i < 2 && basePool.length; i++) {
      let c = pickOrderCrop(basePool, used);
      if (!c) c = basePool[i % basePool.length];
      pushCrop(c, false);
    }
    // 非冬季：小概率把第二张作物单换成反季作物（市价溢价更高，凑不齐就不换）
    if (season < 3 && orders.length > 1 && offSeason.length &&
        rand() < BALANCE.order.offSeasonChance) {
      const cand = offSeason.filter(function (c) { return used.indexOf(c.id) < 0; });
      const off = cand.length ? pickOrderCrop(cand, used) : null;
      if (off) {
        orders.length = 1;      // 只留保底那单，第二单重抽
        used.length = 1;
        pushCrop(off, true);
      }
    }

    // 鱼单：单价随季节上涨（11 → 15 → 19 → 23），不再后期白送；小镇委托加成同样生效
    const fq = Math.max(2, Math.round(randInt(2, 3) * mult));
    const per = BALANCE.order.fishBase + BALANCE.order.fishStep * season;
    orders.push({
      id: 'd' + day + '-f', kind: 'fish', crop: null, name: '任意鱼', emoji: '🐟',
      qty: fq, reward: Math.max(12, Math.round(per * fq * (1 + townBonus(s, 'orderBonus')))),
      done: false
    });
    return orders;
  }

  /* ---------------- 长期订单（5 天期限，2 倍报酬） ---------------- */

  function makeLongOrder(s) {
    const day = (s && s.day) || 1;
    const season = seasonIdx(day);
    const pool = orderPool(day, (s && s.levels && s.levels.farm) || 1);
    if (rand() < 0.3) {
      const qty = Math.max(6, Math.round(randInt(8, 14) * (1 + season * 0.3)));
      return { id: 'L' + day, kind: 'fish', crop: null, name: '任意鱼', emoji: '🐟',
               qty: qty, reward: Math.round(qty * (BALANCE.order.longFishBase + BALANCE.order.fishStep * season) *
                 (1 + townBonus(s, 'orderBonus'))),
               deadline: day + 5, done: false };
    }
    const inSeason = pool.filter(function (c) { return (c.seasons || []).indexOf(season) >= 0; });
    const basePool = (season < 3 && inSeason.length >= 3) ? inSeason : pool;
    /* 按价值加权：贵作物更容易被长期单点中，避免一单萝卜白干 5 天 */
    let c = pickOrderCrop(basePool, []);
    let isOff = (c.seasons || []).indexOf(season) < 0;
    if (season < 3 && rand() < BALANCE.order.offSeasonChance) {
      const cand = pool.filter(function (x) { return (x.seasons || []).indexOf(season) < 0; });
      const off = cand.length ? pickOrderCrop(cand, []) : null;
      if (off) { c = off; isOff = true; }
    }
    const qty = Math.max(6, Math.round((c.price >= 40 ? randInt(6, 10) : randInt(12, 20)) * (1 + season * 0.3)));
    const mk = Math.min(BALANCE.market.orderCap, marketMul(s, c.id));
    return { id: 'L' + day, kind: 'crop', crop: c.id, name: c.name, emoji: c.emoji,
             qty: qty, reward: Math.round(qty * c.price * 2 * mk *
               (1 + townBonus(s, 'orderBonus'))), mul: mk, offSeason: isOff,
             deadline: day + 5, done: false };
  }

  function deliverLong(s) {
    const o = s.longOrder;
    if (!o) return { ok: false, msg: '现在没有长期订单' };
    const have = orderHave(s, o);
    if (have < o.qty) return { ok: false, msg: '还差 ' + (o.qty - have) + ' 个' };
    if (o.kind === 'fish') {
      const drop = orderFish(s).sort(function (a, b) { return a.v - b.v; }).slice(0, o.qty);
      s.fishBag = s.fishBag.filter(function (e) { return drop.indexOf(e) < 0; });
    } else {
      takeStoreOrder(s, o.crop, o.qty);
    }
    // 提前交货：每提前一天 +10%，最多 +50%
    const early = Math.max(0, (o.deadline || 0) - s.day);
    const bonus = Math.round(o.reward * Math.min(0.5, 0.1 * early));
    const total = o.reward + bonus;
    addCoins(s, total, '长期订单 · ' + o.name + '×' + o.qty);
    tradeXp(s, total);
    log(s, '📜 长期订单完成：' + o.emoji + ' ' + o.name + ' ×' + o.qty + '，+' + total + ' 金' +
      (bonus ? '（提前 ' + early + ' 天，额外 +' + bonus + '）' : ''), 'good');
    s.stats.longOrders = (s.stats.longOrders || 0) + 1;
    // 下一张长期委托在隔天睡醒后生成，期间保留该日期以便读档时不提前补单。
    s.longOrder = null;
    s.longOrderReadyDay = s.day + 1;
    return { ok: true, msg: '长期订单完成，+' + total + ' 金' + (bonus ? '（含提前奖励 +' + bonus + '）' : ''),
             reward: o.reward, bonus: bonus, early: early };
  }

  /* 委托进度：普通单什么品质都收；长期单只收普通及以上 */
  /* 杂物、宝箱不算委托的鱼 */
  function orderFishAll(s) {
    return (s.fishBag || []).filter(function (e) { return e && e.q && !e.no && !e.bought; });
  }
  function orderFish(s) {
    // 长期单：买来的水产不算，劣质也不收
    return orderFishAll(s).filter(function (e) { return orderQOk(e.q); });
  }
  /* 长期单带 deadline，普通单没有；据此决定品质门槛 */
  function isLongOrder(o) { return !!o && o.deadline != null; }

  function orderHave(s, o) {
    if (!o) return 0;
    if (o.kind === 'fish') return (isLongOrder(o) ? orderFish(s) : orderFishAll(s)).length;
    return isLongOrder(o) ? orderStoreCount(s, o.crop) : storeCount(s, o.crop);
  }

  function deliverOrder(s, id) {
    const o = (s.orders || []).filter(function (x) { return x.id === id; })[0];
    if (!o) return { ok: false, msg: '没有这个委托' };
    if (o.done) return { ok: false, msg: '这单已经交过了' };
    const have = orderHave(s, o);
    if (have < o.qty) return { ok: false, msg: '还差 ' + (o.qty - have) + ' 个' };

    if (o.kind === 'fish') {
      // 交最便宜的可交鱼，好鱼和杂物都留着
      const drop = orderFishAll(s).sort(function (a, b) { return a.v - b.v; }).slice(0, o.qty);
      s.fishBag = s.fishBag.filter(function (e) { return drop.indexOf(e) < 0; });
    } else {
      // 普通单不挑品质：劣质先被收走
      takeStore(s, o.crop, o.qty);
    }
    o.done = true;
    s.stats.orders = (s.stats.orders || 0) + 1;
    addCoins(s, o.reward, '委托 · ' + o.name + '×' + o.qty);
    tradeXp(s, o.reward);
    log(s, '📋 完成委托：' + o.emoji + ' ' + o.name + ' ×' + o.qty + '，+' + o.reward + ' 金', 'good');
    return { ok: true, reward: o.reward, msg: '委托完成，+' + o.reward + ' 金' };
  }

  function normalizeOrders(list, s) {
    if (!Array.isArray(list)) return makeOrders(s);
    const out = [];
    list.slice(0, 6).forEach(function (o, i) {
      if (!o || (o.kind !== 'crop' && o.kind !== 'fish')) return;
      if (o.kind === 'crop' && !CROPS[o.crop]) return;
      out.push({
        id: String(o.id || ('x' + i)),
        kind: o.kind,
        crop: o.kind === 'crop' ? o.crop : null,
        name: o.kind === 'crop' ? CROPS[o.crop].name : '任意鱼',
        emoji: o.kind === 'crop' ? CROPS[o.crop].emoji : '🐟',
        qty: Math.round(num(o.qty, 1, 1, 99)),
        reward: Math.round(num(o.reward, 10, 1, 9999)),
        mul: (o.kind === 'crop' && o.mul != null) ? num(o.mul, 1, 0.5, 3) : 0,
        offSeason: !!o.offSeason,
        done: !!o.done
      });
    });
    return out.length ? out : makeOrders(s);
  }

/* 存读档与对外导出（FarmGame API） */
  /* ---------------- 存读档 ---------------- */

  function serialize(s) { return JSON.stringify(s); }

  /* 账本按天汇总：每天一条，balance 取当天最后一笔的余额 */
  function ledgerByDay(s) {
    const days = [];
    const map = new Map();
    (s.ledger || []).forEach(function (r) {
      let d = map.get(r.day);
      if (!d) {
        d = { day: r.day, income: 0, expense: 0, balance: r.balance, items: [] };
        map.set(r.day, d);
        days.push(d);
      }
      d.income += r.income || 0;
      d.expense += r.expense || 0;
      d.items.push(r);
    });
    return days;
  }

  /* 账本按类别汇总：给状态页的「近 30 天收益构成」用。
   * 账本 label 是自由文本，这里按前缀归类；认不出的条目不进任何一类。 */
  const LEDGER_CATS = [
    { id: 'crop',   name: '🌾 卖作物',      kind: 'in',  test: /^农产品店/ },
    { id: 'box',    name: '📦 收购箱',      kind: 'in',  test: /^收购箱/ },
    { id: 'order',  name: '📋 委托',        kind: 'in',  test: /^(委托|长期订单)/ },
    { id: 'fish',   name: '🎣 卖鱼',        kind: 'in',  test: /^卖鱼/ },
    { id: 'dig',    name: '🪱 挖蚯蚓',      kind: 'in',  test: /^卖蚯蚓/ },
    { id: 'junk',   name: '🎁 开箱 / 回收', kind: 'in',  test: /^(回收|开.*宝箱|卖种子|卖肥料)/ },
    { id: 'work',   name: '🕐 打零工',      kind: 'in',  test: /零工/ },
    { id: 'reward', name: '🏆 奖励',        kind: 'in',  test: /奖励/ },
    { id: 'food',   name: '🍖 伙食',        kind: 'out', test: /^伙食/ },
    { id: 'upkeep', name: '🧾 维护 / 税',   kind: 'out', test: /^(维护|月度税金)/ },
    { id: 'buy',    name: '🛒 采购',        kind: 'out', test: /^买/ },
    { id: 'build',  name: '🏗️ 建设 / 升级', kind: 'out', test: /^(开垦|体力上限|雇佣|渔夫升)/ },
    { id: 'wage',   name: '🧑‍🌾 渔夫工资',  kind: 'out', test: /^渔夫工资/ },
    { id: 'donate', name: '🏘️ 捐赠',        kind: 'out', test: /^捐赠/ }
  ];

  function ledgerByCategory(s, days) {
    const span = days || 30;
    const from = Math.max(1, (s.day || 1) - span + 1);
    const map = {};
    LEDGER_CATS.forEach(function (c) {
      map[c.id] = { id: c.id, name: c.name, kind: c.kind, total: 0, n: 0 };
    });
    (s.ledger || []).forEach(function (r) {
      if ((r.day || 0) < from) return;
      const v = (r.income || 0) - (r.expense || 0);
      if (!v) return;
      const label = String(r.label || '');
      const cat = LEDGER_CATS.filter(function (c) { return c.test.test(label); })[0];
      if (!cat) return;
      map[cat.id].total += v;
      map[cat.id].n++;
    });
    const list = Object.keys(map).map(function (k) { return map[k]; })
      .filter(function (c) { return c.n > 0; })
      .sort(function (a, b) { return Math.abs(b.total) - Math.abs(a.total); });
    return {
      days: span,
      list: list,
      income: list.reduce(function (n, c) { return n + Math.max(0, c.total); }, 0),
      expense: list.reduce(function (n, c) { return n + Math.max(0, -c.total); }, 0)
    };
  }


  /* 日志按天汇总：每天一条，items 里是当天的记录（新→旧） */
  function logByDay(s) {
    const days = [];
    const map = new Map();
    (s.log || []).forEach(function (r) {
      let d = map.get(r.day);
      if (!d) { d = { day: r.day, items: [] }; map.set(r.day, d); days.push(d); }
      d.items.push(r);
    });
    return days;
  }

  function num(v, def, min, max) {
    const n = Number(v);
    if (!isFinite(n)) return def;
    return Math.min(max == null ? Infinity : max,
                    Math.max(min == null ? -Infinity : min, n));
  }

  /* 存档是唯一的外部输入：日志 / 账本 / 鱼名这些自由文本最终会拼进 innerHTML，
   * 导入时就把能组成标签或属性的字符去掉。正常游戏文本不含这些字符，显示不受影响。 */
  function plain(v, max) {
    return String(v == null ? '' : v).replace(/[<>&"']/g, '').slice(0, max || 40);
  }

  /* 品质只认 QUALITY 里的对象，防止存档塞进来的假品质被当成颜色 / 文本直接使用 */
  function safeQuality(q) {
    if (!q || typeof q !== 'object' || !q.id) return null;
    return qualityById(q.id) || null;
  }

  /* 钓鱼记录本的「最高品质 / 最贵一条」：只保留展示字段并清洗 */
  function safeBookTop(v, day) {
    if (!v || typeof v !== 'object') return null;
    const out = Object.assign({}, v);
    out.fish = plain(out.fish, 20);
    out.quality = safeQuality(out.quality);
    out.price = Math.round(num(out.price, 0, 0, 1e9));
    out.day = Math.round(num(out.day, day, 1, 100000));
    return out.fish ? out : null;
  }

    if (s.v && s.v > SAVE_VERSION) {

        mul: lo.kind === 'crop' && lo.mul != null ? num(lo.mul, 1, 0.5, 3) : 0,
        offSeason: !!lo.offSeason,
        deadline: Math.round(num(lo.deadline, merged.day + 5, 1, 100000)),
        done: false
      };
      merged.longOrderReadyDay = 0;
    } else {
      merged.longOrder = null;
    }
    // 老存档没有长期订单时补一张；新存档的隔日等待标记则保留。
    if (!merged.longOrder && (!merged.longOrderReadyDay || merged.longOrderReadyDay <= merged.day)) {
      merged.longOrder = makeLongOrder(merged);
      merged.longOrderReadyDay = 0;
    }
    // 种子只认认识的作物：存档里塞进来的杂键会让仓库的种子行直接崩
    merged.seeds = {};
    const rawSeeds = s.seeds && typeof s.seeds === 'object' ? s.seeds : {};
    Object.keys(rawSeeds).forEach(function (id) {
      if (!CROPS[id]) return;
      const n = Math.round(num(rawSeeds[id], 0, 0, 9999));
      if (n > 0) merged.seeds[id] = n;
    });
    // 老存档的仓库是「作物: 数量」，这里迁移成「作物: {品质: 数量}」
    merged.store = {};
    const rawStore = s.store && typeof s.store === 'object' ? s.store : {};
    Object.keys(rawStore).forEach(function (id) {
      if (!CROPS[id]) return;
      const v = rawStore[id];
      if (typeof v === 'number') {
        const n = Math.round(num(v, 0, 0, 9999));
        if (n > 0) addStore(merged, id, 'std', n);
      } else if (v && typeof v === 'object') {
        Q_IDS.forEach(function (q) {
          const n = Math.round(num(v[q], 0, 0, 9999));
          if (n > 0) addStore(merged, id, q, n);
        });
      }
    });
    merged.fishBag = Array.isArray(s.fishBag) ? s.fishBag.slice(0, 5000).map(function (e) {
      if (!e || typeof e !== 'object') return null;
      const out = Object.assign({}, e);
      // 鱼名 / 杂物名 / emoji 会拼进 innerHTML，先洗掉能组成标签的字符
      out.name = plain(out.name, 20);
      out.emoji = plain(out.emoji, 4);
      out.v = Math.round(num(out.v, 0, 0, 1e9));
      // v2.2 之前的「宝箱」不分级，统一当木制宝箱
      if (out.name === '宝箱') {
        out.name = '木制宝箱'; out.emoji = '🪵'; out.v = CHESTS.wood.value;
        out.q = null; out.no = true; out.chest = 'wood';
      }
      if (out.trash) out.q = null;
      if (out.chest && !CHESTS[out.chest]) delete out.chest;
      return out;
    }).filter(Boolean) : [];
    // 市场：只保留认识的作物，销量限个范围
    merged.market = {};
    const rawMarket = s.market && typeof s.market === 'object' ? s.market : {};
    Object.keys(rawMarket).forEach(function (id) {
      if (!CROPS[id]) return;
      const sold = num(rawMarket[id] && rawMarket[id].sold, 0, 0, 9999);
      if (sold > 0) merged.market[id] = { sold: Math.round(sold * 10) / 10 };
    });
    merged.marketF = {};
    const rawMarketF = s.marketF && typeof s.marketF === 'object' ? s.marketF : {};
    Object.keys(rawMarketF).forEach(function (name) {
      const sold = num(rawMarketF[name] && rawMarketF[name].sold, 0, 0, 9999);
      if (sold > 0 && String(name).length <= 12) merged.marketF[name] = { sold: Math.round(sold * 10) / 10 };
    });
    merged.ferts = Object.assign({ normal: 0, special: 0 }, s.ferts || {});
    merged.ferts.normal = Math.round(num(merged.ferts.normal, 0, 0, 999));
    merged.ferts.special = Math.round(num(merged.ferts.special, 0, 0, 999));
    merged.sprinklers = Math.round(num(s.sprinklers, 0, 0, 40));
    merged.harvester = !!s.harvester;
    merged.harvesterOn = s.harvesterOn !== false;
    merged.seeder = Math.round(num(s.seeder === true ? 1 : s.seeder, 0, 0, BALANCE.device.seederMax));
    merged.seederOn = s.seederOn !== false;
    // 每台播种器各选各的种子；老存档只有单个 autoSeed，就复制给全部机器
    merged.autoSeeds = [];
    const rawAuto = Array.isArray(s.autoSeeds) ? s.autoSeeds : [];
    const legacyAuto = (s.autoSeed && CROPS[s.autoSeed] && !CROPS[s.autoSeed].wild) ? s.autoSeed : null;
    for (let i = 0; i < merged.seeder; i++) {
      const id = rawAuto[i] || legacyAuto;
      merged.autoSeeds.push((id && CROPS[id] && !CROPS[id].wild) ? id : null);
    }
    merged.nets = Math.round(num(s.nets, 0, 0, NET_MAX));
    // 老存档没有 netSet：默认所有渔网都已布置好
    merged.netSet = Math.round(num(s.netSet == null ? merged.nets : s.netSet, merged.nets, 0, merged.nets));
    merged.townDonated = Math.round(num(s.townDonated, 0, 0, 1e9));
    // 价格历史：只保留 30 天 / 合法条目；老存档没有就从今天开始记
    merged.marketHist = {};
    const rawHist = s.marketHist && typeof s.marketHist === 'object' ? s.marketHist : {};
    Object.keys(rawHist).forEach(function (k) {
      if (String(k).length > 24) return;
      const arr = rawHist[k];
      if (!Array.isArray(arr)) return;
      const out = [];
      arr.slice(-HIST_DAYS).forEach(function (p) {
        if (!p || typeof p !== 'object') return;
        out.push({ d: Math.round(num(p.d, 1, 1, 1e6)), m: Math.round(num(p.m, 1, 0.1, 10) * 100) / 100 });
      });
      if (out.length) merged.marketHist[k] = out;
    });
    if (!Object.keys(merged.marketHist).length) snapshotMarket(merged);
    // 渔夫：老存档是 true（没有等级），补成 Lv1
    merged.fisher = s.fisher
      ? { lv: Math.round(num(s.fisher.lv, 1, 1, BALANCE.fisher.max)),
          xp: Math.round(num(s.fisher.xp, 0, 0, 9999)) }
      : null;
    if (merged.fisher && merged.fisher.lv >= BALANCE.fisher.max) merged.fisher.xp = 0;
    merged.codex = {
      fish: (s.codex && s.codex.fish && typeof s.codex.fish === 'object') ? s.codex.fish : {},
      crops: (s.codex && s.codex.crops && typeof s.codex.crops === 'object') ? s.codex.crops : {},
      food: (s.codex && s.codex.food && typeof s.codex.food === 'object') ? s.codex.food : {}
    };
    Object.keys(merged.codex.food).forEach(function (k) {
      if (!recipeById(k)) { delete merged.codex.food[k]; return; }
      const c = merged.codex.food[k] || {};
      merged.codex.food[k] = { n: c.n || 0, best: c.best || null, first: c.first || null, value: c.value || 0 };
    });
    Object.keys(merged.codex.fish).forEach(function (k) {
      const c = merged.codex.fish[k] || {};
      merged.codex.fish[k] = { n: c.n || 0, best: c.best || null, first: c.first || null,
                               perfect: c.perfect || 0, value: c.value || 0 };
    });
    Object.keys(merged.codex.crops).forEach(function (k) {
      const c = merged.codex.crops[k] || {};
      merged.codex.crops[k] = { n: c.n || 0, best: c.best || null, first: c.first || null, value: c.value || 0 };
    });
    // 图鉴奖励：只保留表里存在的档位 id（老存档没有这一项，首次检查时会补发）
    merged.codexClaim = {};
    const claimable = {};
    ['fish', 'crops'].forEach(function (kind) {
      (BALANCE.codex[kind] || []).forEach(function (m) { claimable[m.id] = 1; });
    });
    Object.keys(s.codexClaim || {}).forEach(function (id) {
      if (claimable[id]) merged.codexClaim[id] = Math.round(num(s.codexClaim[id], 1, 1, 100000));
    });
    // 老存档回填：从最近 40 条钓鱼记录里反推图鉴
    if (!Object.keys(merged.codex.fish).length) {
      ((merged.fishBook && merged.fishBook.entries) || []).forEach(function (e) {
        if (!e || e.trash || !e.quality) return;
        const f = FISH.filter(function (x) { return x.name === e.fish; })[0];
        if (!f) return;
        const c = merged.codex.fish[f.id] ||
          (merged.codex.fish[f.id] = { n: 0, best: null, first: e.day || 1, perfect: 0, value: 0 });
        c.n++;
        c.value += e.price || 0;
        if (!c.first) c.first = e.day || 1;
        if (e.quality.id === 'perfect') c.perfect++;
        if (!c.best || QUALITY.indexOf(e.quality) > QUALITY.indexOf(qualityById(c.best))) c.best = e.quality.id;
      });
    }
    merged.manualRefreshUsed = !!s.manualRefreshUsed;
    merged.workUsed = !!s.workUsed;

    // 成就：只保留仍然存在的成就 id
    merged.ach = {};
    if (s.ach && typeof s.ach === 'object') {
      ACH.forEach(function (a) {
        const d = s.ach[a.id];
        if (d) merged.ach[a.id] = Math.round(num(d, 1, 1, 100000));
      });
    }

    // 水产店：老存档没有进货记录，按当天重新进一次货
    const rawShop = s.shop && typeof s.shop === 'object' ? s.shop : null;
    if (rawShop && rawShop.stock && typeof rawShop.stock === 'object') {
      merged.shop = { day: merged.day, stock: {} };
      FISH.forEach(function (f) {
        if (f.trash || f.noOrder) return;
        const r = SHOP_STOCK[f.id] || [1, 2];
        merged.shop.stock[f.id] = Math.round(num(rawShop.stock[f.id], 0, 0, r[1]));
      });
    } else {
      merged.shop = makeShop(merged.day);
    }

    // 农产品店：同样按当天补一次货
    const rawCropShop = s.cropShop && typeof s.cropShop === 'object' ? s.cropShop : null;
    if (rawCropShop && rawCropShop.stock && typeof rawCropShop.stock === 'object') {
      merged.cropShop = { day: merged.day, stock: {} };
      CROP_LIST.forEach(function (c) {
        merged.cropShop.stock[c.id] = Math.round(num(rawCropShop.stock[c.id], 0, 0, cropStockCap(c)));
      });
    } else {
      merged.cropShop = makeCropShop(merged.day);
    }

    // 等级：老存档按已有收获 / 钓鱼 / 采集 / 挖蚯蚓次数补等级（新存档从 1 级开始）
    const rawLv = s.levels && typeof s.levels === 'object' ? s.levels : null;
    merged.levels = {
      farm: Math.round(num(rawLv && rawLv.farm, 1, 1, BALANCE.level.max)),
      fish: Math.round(num(rawLv && rawLv.fish, 1, 1, BALANCE.level.max)),
      dig: Math.round(num(rawLv && rawLv.dig, 1, 1, BALANCE.level.max)),
      forage: Math.round(num(rawLv && rawLv.forage, 1, 1, BALANCE.level.max)),
      trade: Math.round(num(rawLv && rawLv.trade, 1, 1, BALANCE.level.max)),
      cook: Math.round(num(rawLv && rawLv.cook, 1, 1, BALANCE.level.max)),
      farmXp: Math.round(num(rawLv && rawLv.farmXp, 0, 0, 999999)),
      fishXp: Math.round(num(rawLv && rawLv.fishXp, 0, 0, 999999)),
      digXp: Math.round(num(rawLv && rawLv.digXp, 0, 0, 999999)),
      forageXp: Math.round(num(rawLv && rawLv.forageXp, 0, 0, 999999)),
      tradeXp: Math.round(num(rawLv && rawLv.tradeXp, 0, 0, 999999)),
      cookXp: Math.round(num(rawLv && rawLv.cookXp, 0, 0, 999999))
    };
    if (!rawLv || (merged.levels.farm === 1 && merged.levels.farmXp === 0 &&
                   merged.levels.fish === 1 && merged.levels.fishXp === 0 &&
                   (merged.stats.harvests || 0) + (merged.stats.casts || 0) > 0)) {
      [['farm', merged.stats.harvests || 0], ['fish', merged.stats.casts || 0],
       ['dig', (merged.stats.dug || 0) * BALANCE.dig.xp],
       ['forage', (merged.stats.forages || 0) * BALANCE.forage.xp]].forEach(function (pair) {
        const key = pair[0];
        merged.levels[key + 'Xp'] = Math.min(1e6, pair[1]);
        while (merged.levels[key] < BALANCE.level.max &&
               merged.levels[key + 'Xp'] >= levelNeed(merged.levels[key])) {
          merged.levels[key + 'Xp'] -= levelNeed(merged.levels[key]);
          merged.levels[key]++;
        }
        if (merged.levels[key] >= BALANCE.level.max) {
          merged.levels[key + 'Xp'] = Math.min(merged.levels[key + 'Xp'], levelNeed(BALANCE.level.max) - 1);
        }
      });
    }
    // 账本 / 日志：导入的文本会直接拼进 innerHTML，数量和文本都要过一遍
    const rawLedger = Array.isArray(s.ledger) ? s.ledger : base.ledger;
    merged.ledger = rawLedger.slice(0, 200).filter(function (r) {
      return r && typeof r === 'object';
    }).map(function (r) {
      return {
        day: Math.round(num(r.day, merged.day, 1, 100000)),
        label: plain(r.label, 60),
        income: Math.round(num(r.income, 0, 0, 1e9)),
        expense: Math.round(num(r.expense, 0, 0, 1e9)),
        balance: Math.round(num(r.balance, 0, 0, 1e12))
      };
    });
    const rawLog = Array.isArray(s.log) ? s.log : base.log;
    merged.log = rawLog.slice(0, 400).filter(function (r) {
      return r && typeof r === 'object';
    }).map(function (r) {
      return {
        day: Math.round(num(r.day, merged.day, 1, 100000)),
        text: plain(r.text, 240),
        kind: plain(r.kind, 12) || 'info'
      };
    }).filter(function (r) { return r.text; });
    // 旧存档迁移：垃圾不参与品质判定（早期版本会给出「优质垃圾」）
    if (merged.fishBook.entries) {
      merged.fishBook.entries.forEach(function (e) { if (e && e.trash) e.quality = null; });
    }
    return merged;

 * 由 build-modules.cjs 按文件名顺序拼进 game.js（共享同一个 IIFE 作用域），不要单独加载。
 */

  /* 食谱：lv = 烹饪等级门槛；energy = 做这道菜要花的体力；days = 保质期；restore = 基础回复
   * price = 固定卖价；fishPriced + priceMul = 按实际食材价折算（鱼类食谱）
   * cost.crops 里的 id 可以是作物 / 野货 / 水果（都在 CROPS 表和仓库里） */
  const RECIPES = [
    { id: 'soup', name: '蔬菜汤', emoji: '🥣', lv: 1, energy: 1, restore: 8, days: 3, price: 46,
      cost: { crops: { carrot: 2, cabbage: 1 } }, desc: '萝卜炖白菜，暖胃' },
    { id: 'grill', name: '香烤鱼', emoji: '🍢', lv: 1, energy: 1, restore: 10, days: 2,
      fishPriced: true, priceMul: 5,
      cost: { fish: 1 }, desc: '现钓现烤，鱼越贵菜越值钱' },
    { id: 'jam', name: '野莓酱', emoji: '🍯', lv: 2, energy: 1, restore: 9, days: 4, price: 66,
      cost: { crops: { berry: 2 } }, desc: '抹面包能吃一星期' },
    { id: 'stew', name: '蘑菇炖菜', emoji: '🍲', lv: 3, energy: 2, restore: 16, days: 3, price: 96,
      cost: { crops: { mushroom: 1, potato: 2 } }, desc: '松茸配土豆，鲜掉眉毛' },
    { id: 'salad', name: '水果沙拉', emoji: '🥗', lv: 4, energy: 2, restore: 14, days: 2, price: 108,
      cost: { crops: { fruit_peach: 1, berry: 2 } }, desc: '桃子野莓拌一拌' },
    { id: 'pie', name: '南瓜派', emoji: '🥧', lv: 6, energy: 2, restore: 24, days: 4, price: 188,
      cost: { crops: { pumpkin: 1, corn: 2 } }, desc: '烤得金黄，切八块' },
    { id: 'sashimi', name: '鱼生拼盘', emoji: '🍣', lv: 7, energy: 2, restore: 28, days: 1,
      fishPriced: true, priceMul: 5,
      cost: { fish: 2, crops: { carrot: 1 } }, desc: '刀工比食材更值钱' },
    { id: 'feast', name: '农家盛宴', emoji: '🍱', lv: 9, energy: 3, restore: 45, days: 3, price: 520,
      cost: { fish: 2, crops: { watermelon: 1, pumpkin: 1, mushroom: 1 } }, desc: '一桌硬菜' }
  ];

  function recipeById(id) {
    return RECIPES.filter(function (r) { return r.id === id; })[0] || null;
  }

  /* 食材只收「标准」及以上；成品品质下限 = 食材最好品质 − 1 档 */
  const COOK_MIN_RANK = Math.max(0, Q_IDS.indexOf(BALANCE.cook.minQuality));
  function cookQRank(q) { return Q_IDS.indexOf(q); }
  function cookQOk(q) { return cookQRank(q) >= COOK_MIN_RANK; }

  /* 能下锅的鱼：标准及以上、不是杂物/宝箱（买来的也行） */
  function cookFishBag(s) {
    return (s.fishBag || []).filter(function (e) {
      return e && e.q && !e.no && !e.chest && cookQOk(e.q);
    });
  }

  function cookHave(s, r) {
    if (!r) return false;
    const crops = r.cost.crops || {};
    for (const id in crops) {
      const b = s.store[id] || {};
      let n = 0;
      for (let i = COOK_MIN_RANK; i < Q_IDS.length; i++) n += b[Q_IDS[i]] || 0;
      if (n < crops[id]) return false;
    }
    if (r.cost.fish && cookFishBag(s).length < r.cost.fish) return false;
    return true;
  }

  function ingredientText(r) {
    const parts = [];
    const crops = (r && r.cost && r.cost.crops) || {};
    Object.keys(crops).forEach(function (id) {
      const c = CROPS[id];
      parts.push((c ? c.emoji + ' ' + c.name : id) + '×' + crops[id]);
    });
    if (r && r.cost && r.cost.fish) parts.push('🐟 任意鱼×' + r.cost.fish);
    return parts.join(' · ');
  }

  /* 从仓库按「标准→更好」取作物，返回用掉的品质（含最好一档） */
  function takeCookCrops(s, crops) {
    let best = -1;
    Object.keys(crops).forEach(function (id) {
      let left = crops[id];
      const b = s.store[id];
      if (!b) return;
      for (let i = COOK_MIN_RANK; i < Q_IDS.length && left > 0; i++) {
        const q = Q_IDS[i], have = b[q] || 0, take = Math.min(have, left);
        if (!take) continue;
        b[q] = have - take; left -= take;
        best = Math.max(best, i);
      }
      if (storeCount(s, id) <= 0) delete s.store[id];
    });
    return best;
  }

  /* 从渔获袋取最便宜的合规鱼，返回 { best, fish } */
  function takeCookFish(s, n) {
    const picked = cookFishBag(s).sort(function (a, b) { return a.v - b.v; }).slice(0, n);
    s.fishBag = (s.fishBag || []).filter(function (e) { return picked.indexOf(e) < 0; });
    let best = -1;
    picked.forEach(function (e) { best = Math.max(best, cookQRank(e.q)); });
    return { best: best, fish: picked };
  }

  /* 鱼类食谱按实际食材价折算基础卖价（鱼用 base 价，不含品质） */
  function cookFishBase(e) {
    const f = FISH.filter(function (x) { return x.name === e.name; })[0];
    return f ? f.base : (e.v || 1);
  }
  function cookBasePrice(s, r, fish) {
    if (!r.fishPriced) return r.price;
    let v = 0;
    const crops = r.cost.crops || {};
    Object.keys(crops).forEach(function (id) { v += (CROPS[id] ? CROPS[id].price : 0) * crops[id]; });
    fish.forEach(function (e) { v += cookFishBase(e); });
    return Math.max(6, Math.round(v * r.priceMul));
  }

  /* 做一道菜 */
  function cookMeal(s, rid) {
    const r = recipeById(rid);
    if (!r) return { ok: false, msg: '没有这个食谱' };
    if (!kitchenUnlocked(s)) return { ok: false, msg: '厨房还没解锁（种田 Lv' +
      BALANCE.cook.unlockFarm + ' + 钓鱼 Lv' + BALANCE.cook.unlockFish + '）' };
    if (cookLv(s) < r.lv) return { ok: false, msg: '烹饪 Lv' + r.lv + ' 才解锁' };
    if (cookLeft(s) <= 0) {
      return { ok: false, msg: '今天的烹饪次数用完了（' + cookDailyLimit(s) + ' 份/天）' };
    }
    const cost = r.energy;
    if (s.energy < cost) {
      return { ok: false, msg: '体力不够（做这道菜要 ' + cost + ' 点）' };
    }
    if (!cookHave(s, r)) {
      return { ok: false, msg: '食材不够（要' + qualityById(BALANCE.cook.minQuality).name + '及以上品质）：' +
        ingredientText(r) };
    }

    const crops = r.cost.crops || {};
    const cropBest = takeCookCrops(s, crops);
    const fishRes = r.cost.fish ? takeCookFish(s, r.cost.fish) : { best: -1, fish: [] };
    const ingBest = Math.max(cropBest, fishRes.best);
    const basePrice = cookBasePrice(s, r, fishRes.fish);

    s.energy -= cost;
    s.stats.cooks = (s.stats.cooks || 0) + 1;
    const usedToday = (s.cookedDay === s.day ? (s.cookedToday || 0) : 0);
    s.cookedToday = usedToday + 1;
    s.cookedDay = s.day;
    if (!Array.isArray(s.food)) s.food = [];

    const fail = rand() < cookFail(s);
    const xp = BALANCE.cook.xp + (r.lv >= BALANCE.cook.advLv ? BALANCE.cook.advXp : 0);
    const up = addLevelXp(s, 'cook', xp);
    if (fail) {
      const f = { rid: 'fail', name: '焦糊料理', emoji: '🫕', q: null, energy: 0, price: 1,
                  day: s.day, expire: s.day + 1, n: 1 };
      addFoodEntry(s, f);
      log(s, '🔥 做菜失手：' + r.name + ' 变成了焦糊料理（-' + cost + ' 体力）', 'warn');
      return { ok: true, fail: true, food: f, levelUp: up, cost: cost };
    }
    let q = rollQuality(cookRolls(s));
    /* 食材品质托底：成品至少比食材最好品质低 1 档 */
    const floorRank = ingBest >= 0 ? Math.max(0, ingBest - BALANCE.cook.qualityFloorDrop) : 0;
    if (cookQRank(q.id) < floorRank) q = QUALITY[floorRank];
    const f = { rid: r.id, name: r.name, emoji: r.emoji, q: q.id,
                energy: Math.round(r.restore * q.mul), price: Math.round(basePrice * q.mul),
                day: s.day, expire: s.day + r.days, n: 1 };
    addFoodEntry(s, f);
    /* 图鉴：记录做过的菜（次数 / 最好品质 / 首次 / 累计价值） */
    s.codex = s.codex || {};
    s.codex.food = s.codex.food || {};
    const ce = s.codex.food[r.id] || (s.codex.food[r.id] = { n: 0, best: null, first: s.day, value: 0 });
    ce.n++;
    ce.value += f.price;
    if (!ce.best || cookQRank(q.id) > cookQRank(ce.best)) ce.best = q.id;
    log(s, '🍳 做好 ' + f.emoji + ' ' + f.name + '（' + q.name + ' · +' + f.energy + ' 体力 · 保质 ' +
      r.days + ' 天）' + (up ? ' · 烹饪 Lv' + cookLv(s) : ''), 'good');
    return { ok: true, fail: false, food: f, q: q.id, levelUp: up, cost: cost, xp: xp };
  }

  /* 同菜同品质、且同一天到期 → 叠在同一份里 */
  function addFoodEntry(s, f) {
    const same = s.food.filter(function (x) {
      return x.rid === f.rid && x.q === f.q && x.expire === f.expire && x.name === f.name;
    })[0];
    if (same && f.rid !== 'fail') {
      same.n = (same.n || 1) + 1;
      same.price = f.price;
      same.energy = f.energy;
    } else {
      s.food.push(f);
    }
  }

  function foodDaysLeft(f, day) { return Math.max(0, (f.expire || 0) - (day || 1)); }
  function foodSoon(f, day) { return foodDaysLeft(f, day) <= 1; }

  /* 仓库里的熟食按「菜 + 品质」合并显示 */
  function foodGroups(s) {
    const map = {}, out = [];
    (s.food || []).forEach(function (f, i) {
      const key = (f.rid || 'food') + '|' + (f.q || '-');
      if (!map[key]) {
        map[key] = { key: key, rid: f.rid, name: f.name, emoji: f.emoji, q: f.q,
                     n: 0, energy: f.energy, price: f.price, expire: f.expire, idx: [] };
        out.push(map[key]);
      }
      const g = map[key];
      g.n += f.n || 1;
      g.expire = Math.min(g.expire, f.expire);
      g.idx.push(i);
    });
    return out;
  }

  /* 吃午饭：吃一份（优先吃掉最快过期的那份） */
  function eatFood(s, idx) {
    if (!kitchenUnlocked(s)) return { ok: false, msg: '厨房还没解锁' };
    if (lunchEaten(s)) return { ok: false, msg: '今天已经吃过午饭了' };
    const list = s.food || [];
    const f = list[idx];
    if (!f) return { ok: false, msg: '没有这份料理' };
    return eatFoodEntry(s, f);
  }

  function eatFoodEntry(s, f) {
    if (f.rid === 'fail') return { ok: false, msg: '焦糊料理不能吃，扔收购箱吧' };
    if ((f.expire || 0) < (s.day || 1)) return { ok: false, msg: '这份已经过期了' };
    const room = Math.max(0, s.maxEnergy - s.energy);
    const gain = Math.min(room, f.energy || 0);
    s.energy += gain;
    s.lunchDay = s.day;
    s.stats.meals = (s.stats.meals || 0) + 1;
    if ((f.n || 1) > 1) f.n--;
    else (s.food || []).splice((s.food || []).indexOf(f), 1);
    log(s, '🍽️ 吃午饭：' + f.emoji + ' ' + f.name + '，+ ' + gain + ' 体力' +
      (f.energy > gain ? '（体力已接近上限）' : ''), 'good');
    return { ok: true, gain: gain, energy: f.energy, name: f.name, emoji: f.emoji };
  }

  /* 按合并后的组吃一份 */
  function eatFoodGroup(s, key) {
    if (!kitchenUnlocked(s)) return { ok: false, msg: '厨房还没解锁' };
    if (lunchEaten(s)) return { ok: false, msg: '今天已经吃过午饭了' };
    const g = foodGroups(s).filter(function (x) { return x.key === key; })[0];
    if (!g) return { ok: false, msg: '没有这种熟食' };
    const list = s.food || [];
    const f = g.idx.map(function (i) { return list[i]; })
      .filter(Boolean)
      .sort(function (a, b) { return (a.expire || 0) - (b.expire || 0); })[0];
    return eatFoodEntry(s, f);
  }

  /* 睡觉时清掉过期料理，返回坏掉的份数 */
  function foodTick(s) {
    const list = s.food || [];
    const keep = list.filter(function (f) { return (f.expire || 0) >= (s.day || 1); });
    s.food = keep;
    return list.length - keep.length;
  }

  /* 放进收购箱：一份一份放（每份品质 / 保质期可能不同） */
  function boxPutFood(s, idx) {
    const list = s.food || [];
    const f = list[idx];
    if (!f) return { ok: false, msg: '没有这份料理' };
    const n = f.n || 1;
    list.splice(idx, 1);
    s.box = s.box || [];
    s.box.push({ kind: 'food', name: f.name, emoji: f.emoji, n: n, raw: (f.price || 1) * n,
                 q: f.q, energy: f.energy, rid: f.rid, expire: f.expire });
    log(s, '📦 ' + f.emoji + ' ' + f.name + '×' + n + ' 放进收购箱（' + ((f.price || 1) * n) + ' 金，睡觉结算）', 'info');
    return { ok: true, name: f.name, v: (f.price || 1) * n, n: n };
  }

  /* 按合并后的组整组放进收购箱 */
  function boxPutFoodGroup(s, key) {
    const g = foodGroups(s).filter(function (x) { return x.key === key; })[0];
    if (!g) return { ok: false, msg: '没有这种熟食' };
    const list = s.food || [];
    let n = 0, raw = 0;
    g.idx.slice().sort(function (a, b) { return b - a; }).forEach(function (i) {
      const f = list[i];
      if (!f) return;
      n += f.n || 1;
      raw += (f.price || 1) * (f.n || 1);
      list.splice(i, 1);
    });
    s.box = s.box || [];
    s.box.push({ kind: 'food', name: g.name, emoji: g.emoji, n: n, raw: raw,
                 q: g.q, energy: g.energy, rid: g.rid, expire: g.expire });
    log(s, '📦 ' + g.emoji + ' ' + g.name + '×' + n + ' 放进收购箱（' + raw + ' 金，睡觉结算）', 'info');
    return { ok: true, name: g.name, v: raw, n: n };
  }

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================
 * 我的小农场 · 界面层
 * 由 build-ui.cjs 从 ui-src/ 拼装生成 —— 不要直接改这个文件，改 ui-src/ 下的模块。
 * ============================================================ */
(function () {
  'use strict';

  /* ===== 01-core.js ===== */
/* 我的小农场 · 界面层 / 01-core.js
 * 顶层依赖 / 存档与读写 / 导入导出 / 音效 / Toast 与飘字 / 弹窗开合
 * 由 build-ui.cjs 按文件名顺序拼进 ui.js（共享同一个 IIFE 作用域），不要单独加载。
 */

  const G = window.FarmGame;
  const SAVE_KEY = 'farm-gui-save-v1';

  let state = null;
  let baitSel = 'worm';
  let soundOn = true;
  let storeFilter = 'all';
  let storeQuery = '';
  let futureSave = false;   // 读档时发现「来自更新版本」的存档 → 备份并提示

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.prototype.slice.call(document.querySelectorAll(sel));

  /* HTML 转义：日志 / 账本 / 鱼名这些来自存档的文本，拼进 innerHTML 前一律先过一遍。
   * 存档导入（G.deserialize）已经清洗过一轮，这里是输出侧的第二层保险。 */
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------------- 存档 ---------------- */

  /* 写入去抖：连续操作（连点、连甩、全部浇水）只落一次盘；
   * 页面隐藏 / 关闭时用 flushSave() 同步补写，保证不丢最后一笔。 */
  const SAVE_DEBOUNCE = 400;
  let saveTimer = null;

  function saveNow() {
    try { localStorage.setItem(SAVE_KEY, G.serialize(state)); } catch (e) { /* 忽略 */ }
  }

  function save() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      saveNow();
    }, SAVE_DEBOUNCE);
    // Node 下（dom-test）不要因为这个定时器拖住进程
    if (saveTimer && typeof saveTimer.unref === 'function') saveTimer.unref();
  }

  function flushSave() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (state) saveNow();
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return G.deserialize(raw);
    } catch (e) {
      // 存档来自更新的版本：先把原文另存一份，免得被新档覆盖丢掉
      if (e && e.code === 'FUTURE_SAVE') {
        futureSave = true;
        try { localStorage.setItem(SAVE_KEY + '-future', localStorage.getItem(SAVE_KEY) || ''); } catch (e2) { /* 忽略 */ }
      }
    }
    return null;
  }

  /* ---------------- 导入 / 导出 ---------------- */

  function stamp() {
    const d = new Date();
    const p2 = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' +
           p2(d.getHours()) + p2(d.getMinutes());
  }

  function download(name, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 80);
  }

  function exportSave() {
    download('小农场存档-' + stamp() + '.json', G.serialize(state), 'application/json;charset=utf-8');
    toast('存档已导出 ⬇️', 'good');
  }

  function exportLedger() {
    const days = G.ledgerByDay(state);
    const lines = ['# 我的小农场 · 账本', '',
      '> 导出时间：' + new Date().toLocaleString('zh-CN'),
      '> 当前进度：第 ' + state.day + ' 天 · ' + state.coins + ' 金 · ' + state.plots.length + ' 块地', '',
      '| 天数 | 收入 | 支出 | 净 | 余额 |', '|---|---|---|---|---|'];
    days.forEach(function (d) {
      const net = d.income - d.expense;
      lines.push('| D' + d.day + ' | +' + d.income + ' | -' + d.expense + ' | ' +
        (net >= 0 ? '+' : '') + net + ' | ' + d.balance + ' |');
    });
    lines.push('', '## 明细');
    days.forEach(function (d) {
      lines.push('', '### D' + d.day);
      d.items.slice().reverse().forEach(function (it) {
        lines.push('- ' + it.label + '：' +
          (it.income ? '+' + it.income : (it.expense ? '-' + it.expense : '—')) + ' 金');
      });
    });
    const total = days.reduce(function (a, d) { return a + d.income - d.expense; }, 0);
    lines.push('', '**累计净收益：' + (total >= 0 ? '+' : '') + total + ' 金**');
    download('小农场账本-' + stamp() + '.md', lines.join('\n') + '\n', 'text/markdown;charset=utf-8');
    toast('账本已导出 ⬇️', 'good');
  }

  function exportLog() {
    const dayWater = '第 ' + state.day + ' 天 · ' + state.coins + ' 金 · 体力 ' +
      state.energy + '/' + state.maxEnergy + ' · ' + state.plots.length + ' 块地';
    const lines = state.log.slice().reverse().map(function (r) {
      return '- **D' + r.day + '** ' + r.text;
    });
    const text = '# 我的小农场 · 游戏日志\n\n' +
      '> 导出时间：' + new Date().toLocaleString('zh-CN') + '\n' +
      '> 当前进度：' + dayWater + '\n' +
      '> 累计渔获：' + state.fishBook.count + ' 条\n\n' +
      lines.join('\n') + '\n';
    download('小农场日志-' + stamp() + '.md', text, 'text/markdown;charset=utf-8');
    toast('日志已导出 ⬇️', 'good');
  }

  function importSave(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const raw = JSON.parse(String(reader.result));
        if (!raw || !Array.isArray(raw.plots) || typeof raw.coins !== 'number') {
          throw new Error('bad save');
        }
        state = G.deserialize(raw);
        catchLog = (state.fishBook.entries || []).slice(0, 5);
        save();
        renderAll();
        toast('存档已导入：第 ' + state.day + ' 天 · ' + state.coins + ' 金', 'good');
      } catch (e) {
        toast('导入失败：不是有效的小农场存档', 'bad');
      }
    };
    reader.readAsText(file);
  }

  /* ---------------- 音效 ---------------- */

  let actx = null;
  function beep(freq, dur, type, gain) {
    if (!soundOn) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, actx.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.12));
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + (dur || 0.12) + 0.02);
    } catch (e) { /* 忽略 */ }
  }
  const SFX = {
    plant: () => beep(330, 0.1, 'triangle', 0.05),
    water: () => beep(520, 0.08, 'sine', 0.04),
    coin:  () => { beep(880, 0.09, 'triangle', 0.06); setTimeout(() => beep(1180, 0.1, 'triangle', 0.05), 70); },
    catch: () => { beep(660, 0.09, 'sine', 0.06); setTimeout(() => beep(990, 0.14, 'sine', 0.05), 80); },
    good:  () => beep(740, 0.13, 'sine', 0.05),
    bad:   () => beep(200, 0.16, 'sawtooth', 0.05),
    sleep: () => { beep(420, 0.14, 'sine', 0.05); setTimeout(() => beep(300, 0.18, 'sine', 0.04), 120); }
  };

  /* ---------------- Toast / 飘字 ---------------- */

  function toast(msg, kind) {
    if (!msg) return;
    const root = $('#toast-root');
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () {
      el.classList.add('out');
      setTimeout(function () { el.remove(); }, 320);
    }, 1900);
  }

  function floatText(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = 'float ' + (cls || '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    $('#fx').appendChild(el);
    setTimeout(function () { el.remove(); }, 1100);
  }

  /* ---------------- 农田 ---------------- */

  const PLOT_CLASS = { growing: 'growing', regrow: 'growing', ripe: 'ripe' };

  function renderPlots() {
    const grid = $('#plot-grid');
    const keepScroll = grid.scrollTop;          // 重绘会重置滚动条，先存下来
    grid.innerHTML = state.plots.map(function (p, i) {
      if (!p.crop) {
        return '<div class="plot empty" data-i="' + i + '" role="button" tabindex="0"' +
          ' aria-label="第 ' + (i + 1) + ' 块地，空地，点击播种">' +
          '<div class="plot-top"><span class="plot-no">' + (i + 1) + '</span></div>' +
          '<div class="plot-art soil"><span class="seed-dot">＋</span></div>' +
          '<div class="plot-name">空地</div>' +
          '<div class="bar"><i style="width:0%"></i></div>' +
          '<div class="plot-foot">点击播种</div>' +
        '</div>';
      }
      const c = G.CROPS[p.crop];
      const need = G.needOf(p);
      const pct = Math.round(p.growth / need * 100);
      const can = G.canHarvest(state, p);
      const cls = PLOT_CLASS[p.phase] || '';

      let badges = '';
      if (p.watered) badges += '<span title="今日已浇水">💧</span>';
      if (p.fert) badges += '<span title="已施肥 +' + p.fert + '">🧪</span>';

      let foot;
      if (p.phase === 'ripe') {
        foot = can ? '<span style="color:var(--green-d)">✨ 点击收获</span>'
                   : '明天可收';
      } else if (p.watered) {
        foot = '<span style="color:var(--blue)">今日已浇</span>';
      } else {
        foot = p.missed > 0 ? '<span class="warn">缺水 ×' + p.missed + '</span>' : '待浇水';
      }

      const nameExtra = p.phase === 'regrow' ? '再生' : '';
      const aria = '第 ' + (i + 1) + ' 块地，' + c.name + '，' + p.growth + '/' + need + ' 天，' +
        (can ? '可以收获' : (p.phase === 'ripe' ? '明天可收' : (p.watered ? '今天已浇水' : '待浇水')));

      return '<div class="plot ' + cls + '" data-i="' + i + '" role="button" tabindex="0"' +
        ' aria-label="' + aria + '">' +
        '<div class="plot-top"><span class="plot-no">' + (i + 1) + '</span>' +
          '<div class="plot-badges">' + badges + '</div></div>' +
        '<div class="plot-art">' + G.stageEmoji(p) + '</div>' +
        '<div class="plot-name">' + c.name +
          '<small>' + (nameExtra ? nameExtra + ' ' : '') + p.growth + '/' + need + '天</small></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="plot-foot">' + foot + '</div>' +
      '</div>';
    }).join('');
    grid.scrollTop = keepScroll;

    const anyGrow = state.plots.some(function (p) {
      return p.crop && p.phase !== 'ripe' && !p.watered;
    });
    const anyRipe = state.plots.some(function (p) { return p.crop && G.canHarvest(state, p); });
    const anyEmpty = state.plots.some(function (p) { return !p.crop; });
    const seedTotal = Object.keys(state.seeds).reduce(function (n, k) { return n + (state.seeds[k] || 0); }, 0);
    const fertList = G.fertTargets(state);

    const frozen = G.isWinter(state.day);
    $('[data-act="waterAll"]').disabled = !anyGrow;
    $('[data-act="harvestAll"]').disabled = !anyRipe;
    $('[data-act="plantAll"]').disabled = !anyEmpty || frozen;
    $('[data-act="fertilizeAll"]').disabled = !fertList.length || state.energy < 1 || state.coins < 5;
    $('#plantall-txt').textContent = frozen ? '❄️ 冬天土地封冻'
      : (anyEmpty
        ? (seedTotal ? '库存 ' + seedTotal + ' 颗 · 空地 ' + state.plots.filter(function (p) { return !p.crop; }).length + ' 块'
                     : '没种子 · 点这里去种子店')
        : '没有空地');
    $('#fertall-txt').textContent = fertList.length
      ? '可施 ' + fertList.length + ' 块 · 5 金起'
      : (anyGrow ? '都施过肥了' : '没有进行中的作物');
  }

  /* ---------------- 操作按钮 ---------------- */

  function renderActions() {

      $('#work-txt').textContent = '今天已经打过了 · 明天再来';

      $('#work-txt').textContent = '全天 · -' + fullNeed + ' 体力 · +' + G.workPay(state, 'full') + ' 金';
    } else if (state.energy >= halfNeed) {
      $('#work-txt').textContent = '半天 · -' + halfNeed + ' 体力 · +' + G.workPay(state, 'half') + ' 金';

      $('#work-txt').textContent = '半天 · 用光 ' + state.energy + ' 点 · +' + Math.round(state.energy * G.WORK_RATE_HALF) + ' 金';
    } else {
      $('#work-txt').textContent = '体力不足 · 先睡觉';
    }

    $('#sprinkler-txt').textContent = sprLock

      : '已有 ' + state.sprinklers + ' 个 · ' + G.SPRINKLER_COST + ' 金/个';

    $('#harvester-txt').textContent = harvLock
      ? '需种田 Lv' + G.BALANCE.gate.harvester + ' 解锁'
      : (!state.harvester
        ? G.HARVESTER_COST + ' 金 · 睡觉时自动收'

      seedTxt.textContent = seedLock
        ? '需种田 Lv' + G.BALANCE.gate.seeder + ' 解锁'
        : (!sc
          ? G.SEEDER_COST + ' 金/台 · 一台管 ' + G.SEEDER_PLOTS + ' 块'

            (state.seederOn ? '' : '（已关）') +
            (picked ? ' · ' + picked + ' 台已选种子' : ' · 都没选种子')));
    }
    const devSum = $('#dev-sum');
    if (devSum) {
      const fee = G.deviceUpkeep(state);
      devSum.textContent = fee ? '维护 ' + fee + ' 金/周' : '';

    renderCrew();

    const teaBtn = $('[data-act="tea"]');
    const teaHave = G.teaStock(state);
    const teaBest = teaHave.slice().sort(function (a, b) { return b.energy - a.energy; })[0];
    teaBtn.disabled = state.teaUsed || state.energy >= state.maxEnergy || !teaHave.length;
    $('#tea-txt').textContent = state.teaUsed
      ? '今天喝过了'
      : (!teaHave.length ? '没有茶了' :
        (state.energy >= state.maxEnergy ? '体力已满'
          : teaBest.emoji + ' ' + teaBest.name + ' · +' + teaBest.energy + ' 体力'));

    const digCost = G.digCost(state);    const digFrozen = G.isWinter(state.day);
    $('[data-act="dig"]').disabled = digFrozen || state.energy < digCost;
    const digTxt = $('#dig-txt');
    if (digTxt) digTxt.textContent = digFrozen ? '封冻期 · 挖不了' : digCost + ' 体力';

    /* 厨房 */

    const cookLvEl = $('#cook-lv');
    if (cookLvEl) {
      cookLvEl.textContent = '🍳 Lv' + cookLv;
      cookLvEl.title = G.levelEffectText('cook', cookLv);
    }
    const unlocked = G.kitchenUnlocked(state);
    const kitchenTxt = $('#kitchen-txt');
    if (kitchenTxt) {
      kitchenTxt.textContent = unlocked
        ? '今日 ' + G.cookLeft(state) + '/' + G.cookDailyLimit(state) + ' 份 · 食谱 ' +
          G.cookRecipes().filter(function (r) { return r.lv <= cookLv; }).length + ' 道'
        : '需种田 Lv' + G.BALANCE.cook.unlockFarm + ' + 钓鱼 Lv' + G.BALANCE.cook.unlockFish;
    }

    if (lunchTxt) {
      lunchTxt.textContent = !unlocked ? '厨房未解锁'

    }
    const forageBtn = $('[data-act="forage"]');
    if (forageBtn) {
      const fp = G.foragePool(state.day);
      const fCost = G.forageCost(state);
      forageBtn.disabled = state.energy < fCost || !fp.length;
      const ft = $('#forage-txt');
      if (ft) {

          : '这个季节没得采';

    $('[data-act="expand"]').disabled = state.plots.length >= G.BALANCE.expand.max ||
      state.coins < G.expandCost(state);

    $('[data-act="sprinkler"]').disabled = sprLock ||
      state.coins < G.SPRINKLER_COST || state.sprinklers >= state.plots.length;
    $('[data-act="harvester"]').disabled = harvLock || (!state.harvester && state.coins < G.HARVESTER_COST);
  }

          '<span class="cc-tag">未解锁</span></div>' +

      '</div>';
    } else if (!state.nets) {
      netCard = '<div class="crew-card empty">' +
        '<div class="cc-head"><span class="cc-ic">🕸️</span><span class="cc-t">渔网</span>' +
          '<span class="cc-tag">0 / ' + G.netMax(state) + '</span></div>' +
        '<div class="cc-sub">河边还没放网 · 渔具店 ' + G.NET_COST + ' 金/张</div>' +

          '<span class="cc-tag">' + setN + ' / ' + state.nets + ' 已布</span></div>' +
        '<div class="cc-dots">' + dots + '</div>' +
        '<div class="cc-sub">' + Math.round(G.NET_CHANCE * 100) + '% 各上 1 条 · 每天 ' + setN +
