name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 逻辑自测
        run: node selftest.cjs
      - name: 界面绑定检查
        run: node check-ui.cjs
      - name: 配置来源检查
        run: node check-config.cjs
      - name: 文档一致性
        run: node check-docs.cjs
      - name: 数据表检查
        run: node check-data.cjs
      - name: DOM 冒烟测试
        run: node dom-test.cjs
      - name: 数值体检
        run: node balance.cjs
      - name: 单文件打包 + 生成物同步检查
        run: |
          node build-single.cjs
          # 生成物（game.js / ui.js / 我的小农场.html）必须和源码一致，否则 CI 失败
          git diff --exit-code
